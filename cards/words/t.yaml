words:
  - word: tacit
    ipa: /ˈtæs.ɪt/
    pos: adjective
    tip: ta-cit — "tac" silent
    definition: Understood or agreed without being stated in words.
    example: His silence was tacit agreement.
    synonyms:
      - implicit
      - unspoken
      - implied
      - understood
    syn_pos: adjective
    syn_example: Tacit / implicit / unspoken — understood without words.
    components:
      - spelling
      - definitions
  - word: tactic
    ipa: /ˈtæk.tɪk/
