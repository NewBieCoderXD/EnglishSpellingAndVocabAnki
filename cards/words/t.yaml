      - definitions
  - word: tentative
    ipa: /ˈten.tə.tɪv/
    pos: adjective
    tip: ten-ta-tive — "ta" not "te", and three syllables
    spelling_hint: ""
    definition: Provisional; stated or agreed as a temporary step that may still be changed.
    example: We reached a tentative agreement on the new deadline.
    synonyms:
      - provisional
      - preliminary
      - interim
      - cautious
      - inconclusive
    syn_pos: adjective
    syn_example: A tentative agreement / estimate — agreed or stated, but not final.
    syn_examples:
      - the: We reached a tentative agreement on the new deadline.
        syns:
          - provisional
          - preliminary
          - interim
      - the: His conclusion was tentative because the sample was small.
        syns:
          - preliminary
          - provisional
        avoid:
          interim: >-
            = the temporary stage sitting between two events, as in an interim
            report; it is not about a conclusion that may still be revised
    syn_notes:
      provisional: in force for now, until something replaces it
      preliminary: an early stage before the real one
      interim: covering the gap between two stages
    syn_near:
      - vague
      - hesitant
      - doubtful
    syn_avoid:
      cautious: >-
        = careful about risk, and it describes a person or a choice: 'a cautious
        agreement' is not a phrase, though 'a cautious approach' is
      inconclusive: >-
        = says nothing can be concluded from the evidence; a tentative finding is
        one you are not yet sure of, which is a different problem
      vague: >-
        = not specific enough to be usable; a tentative agreement is clear about
        what was agreed, only not final
      hesitant: >-
        = describes a person wavering, as in a hesitant reply; it cannot describe
        the agreement itself
      doubtful: >-
        = not sure it is true or right, so 'a doubtful agreement' says you doubt
        it exists at all; tentative says it stands for now
    syn_nuance: >-
      All four mark something as not final, but they differ in why. Tentative =
      stated or agreed, yet open to change (a tentative finding, a tentative
      peace deal). Provisional = officially in force until something replaces it
      (a provisional permit). Preliminary = the first stage of a longer process
      (preliminary data). Interim = the temporary stage in between (an interim
      report).
    components:
      - spelling
      - definitions
      - synonyms
