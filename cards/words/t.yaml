  - word: transform
    ipa: /trænsˈfɔːm/
    pos: verb
    tip: trans-form — the prefix 'trans'
    spelling_hint: ""
    definition: To change something completely, usually for the better.
    example: Technology has transformed the industry.
    synonyms:
      - change
      - convert
      - alter
      - renovate
      - reshape
    syn_pos: verb
    syn_example: Technology has transformed / reshaped / revolutionised work.
    syn_examples:
      - the: Technology continues to transform the industry.
        syns:
          - change
          - reshape
          - alter
        avoid:
          convert: >-
            = to change the form or the use of a thing, and its frame is convert
            something into something else, so it has no into phrase in the industry
            sentence
          renovate: >-
            = to restore an old property to good condition, so its object must be a
            building, a room or a fitment; an industry is not something that can be
            repaired, and renovate the industry is not idiomatic
      - the: They plan to transform the old factory into flats.
        syns:
          - convert
          - renovate
          - change
      - the: We need to transform the way we work.
        syns:
          - change
          - alter
          - reshape
        avoid:
          convert: >-
            = to change the form or the use of a thing, and its frame is convert
            something into something else; the way we work is a practice, not a
            substance, and no into phrase appears here
          renovate: >-
            = to restore an old property to good condition ("renovate the house",
            "renovate the kitchen"); the way we work is a method, and no building or
            room in this sentence can be renovated
    syn_notes:
      change: make different
      convert: change in form or use
      alter: make a small change
      renovate: restore to good condition
      reshape: give a new shape
    syn_near:
      - improve
      - upgrade
      - modify
      - revolutionise
      - replace
    syn_avoid:
      alter: >-
        = to change something slightly while keeping its nature, so it cannot
        carry a whole new use in the factory sentence; it fits the way we work,
        where a detail changes
      convert: >-
        = to change the form or the use of a thing, and its frame is convert
        something into something else, so it has no into phrase in the industry
        sentence
      renovate: >-
        = to restore an old property to good condition, and its object must be a
        building or a room, not an industry or the way we work
      reshape: >-
        = to give a new shape or structure to a thing that already has shape, so
        it takes a landscape or a career, and it does not accept an into phrase
      improve: >-
        = to make something better while leaving it the same thing, so it is too
        small for a verb that replaces the old with something new; it fits a
        service or a result
      upgrade: >-
        = to raise something to a higher standard or a newer version, and it
        expects a product or a system that already exists; upgrading the way we
        work is not idiomatic
      modify: >-
        = a technical word, standard in science and law, for a small change to a
        specification; modify the industry and modify the way we work are both off
      revolutionise: >-
        = to change a whole field completely, and it is the strong verb used with
        manufacturing, the media or transport; far too dramatic for one old
        factory
      replace: >-
        = to take one thing out and put another in its place, so it leaves the
        original entity standing rather than changing it, as a replacement would
    syn_nuance: >-
      Transform says a complete change, and it takes almost any object, from an
      industry to the way we work. Alter edits a detail, convert needs an into
      phrase, renovate is for old property, and reshape takes something that
      already has a shape. The object in the sentence, and the presence of into,
      decide the member.
    components:
      - spelling
      - definitions
      - synonyms
  - word: translate
    ipa: /trænzˈleɪt/
    pos: verb
    tip: trans-late — "trans" across
    definition: To change words from one language into another.
    example: The novel was translated into twenty languages.
    synonyms:
      - interpret
      - render
      - convert
    syn_pos: verb
    syn_example: Translate / render — to change from one language into another.
    components:
      - spelling
      - definitions
  - word: transmit
    ipa: /trænzˈmɪt/
    pos: verb
    tip: trans-mit — the prefix 'trans', double t at end
    spelling_hint: ""
    definition: To send or pass on something from one place or person to another.
    example: The signal is transmitted over long distances.
    synonyms:
      - send
      - pass on
      - convey
      - transfer
      - broadcast
    syn_pos: verb
    syn_example: Transmit / convey / pass on information.
    syn_examples:
      - the: The signal is designed to transmit over long distances.
        syns:
          - send
          - transfer
          - broadcast
        avoid:
          convey: >-
            = to carry an idea, a feeling or a message in words, so its object must
            be a meaning; here the verb takes no object at all, only over long
            distances, and a signal carries no sense
      - the: Water can transmit the disease.
        syns:
          - pass on
          - transfer
        avoid:
          convey: >-
            = to carry an idea, a feeling or a message in words, so its object must
            be a meaning; a disease is a physical agent, not a sense, and what water
            does here is move a germ
          broadcast: >-
            = a mass medium act, sending the same item to a wide audience
            ("broadcast on a station"); water is not a station and nobody chooses to
            send this out, so a disease spreads rather than broadcasts
      - the: She will transmit the message to the whole team.
        syns:
          - convey
          - pass on
          - send
        avoid:
          broadcast: >-
            = a mass medium act, sending the same item to a wide audience, with the
            frames broadcast on a station and broadcast to the public; one message
            to a team is not a broadcast
    syn_notes:
      send: make something go to someone
      pass on: hand along
      convey: communicate or carry
      transfer: move from one to another
      broadcast: send out to many
    syn_near:
      - communicate
      - spread
      - relay
      - forward
      - deliver
    syn_avoid:
      broadcast: >-
        = a mass medium act, sending the same item to a wide audience, with the
        frames broadcast on a station and broadcast to the public; one message to
        a team is not a broadcast
      convey: >-
        = to carry an idea, a feeling or a message in words, so its object must be
        a meaning; it will not carry a signal over a distance or a disease in
        water
      pass on: >-
        = to hand something to the next person, and it is natural for humans
        passing a message; the subject here is a signal or water, which needs a
        more direct verb
      send: >-
        = the plainest verb, and it wants a recipient in a to or for phrase or a
        destination; water does not send anything, and a signal sends itself only
        by a strained metaphor
      transfer: >-
        = to move money, a person or ownership from one holder to another, so it
        needs a from or to pair; a message or a signal has no owner to hand it
        over
      communicate: >-
        = a two-way human act with the frames communicate something to someone and
        communicate with someone; a disease passing through water is not a person
        telling a person
      spread: >-
        = to extend over an area or from person to person, and spread the disease
        is perfectly good English, so it works, but it names the spread rather
        than the carrying
      relay: >-
        = to pass a signal or a message along a chain, at once technical and
        broadcast, and it likes a relay station or a relay from A to B rather than
        a plain subject
      forward: >-
        = the office and email word, and it needs a to addressee; forwarding a
        disease, or a signal across a distance, is not idiomatic English
      deliver: >-
        = to carry and hand over goods, a parcel or a message to a place or a
        person; a signal designed to deliver over long distances loses the sense
        of carrying
    syn_nuance: >-
      Transmit is the general verb for sending a signal, a disease or a message
      along a route, and it accepts all three. Send wants a recipient, broadcast
      an audience, convey a meaning and transfer an owner, while pass on belongs
      to people handing something along. The subject and the object decide, so a
      signal transmits and a team receives.
    components:
      - spelling
      - definitions
      - synonyms
  - word: tremendous
