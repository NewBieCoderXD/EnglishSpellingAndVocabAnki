  - word: relevant
    ipa: /ˈrel.ə.vənt/
    pos: adjective
    tip: rel-e-vant — 'e-va', keep all vowels
    spelling_hint: ""
    definition: Closely connected to the matter at hand; applicable.
    example: Please share all relevant information.
    synonyms:
      - pertinent
      - applicable
      - related
      - germane
      - apt
    syn_pos: adjective
    syn_example: Include all relevant / pertinent / applicable details.
    syn_examples:
      - the: Please share all relevant information.
        syns:
          - pertinent
          - applicable
      - the: Her experience is directly relevant to the job.
        syns:
          - related
          - germane
          - apt
          - pertinent
    syn_notes:
      pertinent: directly applicable
      applicable: can be applied
      related: connected
      germane: relevant to the point
      apt: fitting, appropriate
    syn_near:
      - important
      - significant
      - necessary
      - suitable
      - useful
    syn_avoid:
      applicable: >-
        = can be applied to a given case; it needs a rule, law or system to apply
        to, so it sits awkwardly beside her experience being relevant to the job
      apt: >-
        = suited to a purpose, and by extension quick-witted; it rates fitness,
        not connection, so it cannot modify the bare noun information
      germane: >-
        = relevant to the point at issue, a formal and slightly bookish word that
        wants a stated topic, as in germane to the discussion
      related: >-
        = loosely connected, too weak to replace relevant before a noun; it needs
        the frame related to + noun, and all related information reads as
        everything connected to something
      important: >-
        = a learner reaches for it because the two feel alike in speech, but
        importance is about consequence, not about a link to the topic or the
        duties
      significant: >-
        = large or important enough to matter, an intensifier for a figure or a
        change, not a word for a connection to a subject
      necessary: >-
        = required, which makes the link one of obligation; experience can be
        relevant to a job without being necessary for it
      suitable: >-
        = a quality judgement about fit for a use or a role, so it would rate the
        experience as qualified rather than connected to the work
      useful: >-
        = of practical help, a value judgement; relevance can be purely
        informational, with no benefit attached, as when you ask for all relevant
        information
    syn_nuance: >-
      The family all say connected to the point, but only relevant, pertinent and
      germane travel as bare adjectives before a noun. Pertinent is the formal
      word for details, germane wants a stated topic, applicable needs a rule or
      system, and related and apt weaken or redirect the link when they sit in
      front of a plain noun such as information.
