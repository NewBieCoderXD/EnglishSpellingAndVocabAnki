  - word: regulate
    ipa: /ˈreɡ.jʊ.leɪt/
    pos: verb
    tip: reg-u-late — 'reg', then 'u-late'
    spelling_hint: ""
    definition: To control or maintain something by rules or laws.
    example: The government regulates the market.
    synonyms:
      - control
      - govern
      - monitor
      - manage
      - oversee
    syn_pos: verb
    syn_example: Regulate / control / govern the sector.
    syn_examples:
      - the: The government has powers to regulate the market.
        syns:
          - control
          - govern
        avoid:
          manage: >-
            = to run the day-to-day operation, with a person or team as subject
            ("manage a team"); a government with such powers is setting legal
            limits, and no one is running the market as a business
          monitor: >-
            = to watch and check over time without changing anything ("monitor the
            temperature"); "powers to monitor the market" is good English, but it
            only watches, and the sentence names a power to set limits
          oversee: >-
            = to watch over a task or a junior member to check quality ("oversee the
            work", "oversee trainees"); a government can oversee a project, but a
            whole market is too wide to watch and no task is in hand
      - the: New rules regulate how companies operate.
        syns:
          - control
          - govern
        avoid:
          manage: >-
            = to run the day-to-day operation, with a person or team as subject
            ("manage a team"); rules are not managers, and how companies operate is
            a clause, not an organisation to be run
          monitor: >-
            = to watch and check over time without changing anything ("monitor the
            temperature"); a rulebook is a setter of conduct, not an observer, and
            it has nothing on a gauge to read
          oversee: >-
            = to watch over a task or a junior member to check quality ("oversee the
            work"); impersonal rules never oversee, and the clause how companies
            operate is not a task anyone checks
      - the: A supervisor is on hand to regulate the flow of work.
        syns:
          - monitor
          - oversee
          - manage
          - control
    syn_notes:
      control: make something behave a certain way
      govern: rule or control
      monitor: watch over
      manage: organize or deal with
      oversee: supervise
    syn_near:
      - enforce
      - restrict
      - check
      - direct
    syn_avoid:
      govern: >-
        = to rule a country or an organisation with lasting authority ("a
        governing body", "governed by law"); a supervisor keeping work in order
        has no such power, so the verb here is not govern
      monitor: >-
        = to watch and check over time without changing anything ("monitor the
        temperature"); a government or a rulebook is shaping conduct, not just
        watching it, so neither fits the first two sentences
      manage: >-
        = to run the day-to-day operation, with a person or team as subject
        ("manage a team"); neither a government regulating a market nor a rule
        regulating a system is doing the day-to-day running
      oversee: >-
        = to watch over a task or a junior member to check quality ("oversee the
        work", "oversee trainees"); it needs a person or a committee, so
        impersonal rules or a national authority never oversee
      enforce: >-
        = to make people obey a rule, and the doer is normally the police or a
        regulator ("enforce the ban"); with the rules themselves as subject the
        sense is shaping conduct, not punishing a breach
      restrict: >-
        = to limit the size, amount or range of something ("restrict access"); it
        names a fixed limit, not the steady job of keeping a system to agreed
        standards, and a supervisor restricts nothing
      check: >-
        = a plain, one-off verb for looking at something to see if it is right
        ("check the figures"); too casual and too brief for the continuous,
        rule-based sense of regulate in the first two sentences
      direct: >-
        = to give orders about what people should do ("direct the team"); it needs
        a human instructor and describes issuing instructions, not holding a
        market or a workflow to a standard
    syn_nuance: >-
      All of these keep a system working as intended, but the actor separates
      them. Regulate, control and govern take a system ("regulate the market",
      "new rules regulate how companies operate"), with govern marking formal
      state or organisational authority, while monitor, manage and oversee want a
      person and describe the daily running.
