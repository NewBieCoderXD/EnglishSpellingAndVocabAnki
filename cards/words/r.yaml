  - word: research
    ipa: /rɪˈsɜːtʃ/
    pos: noun/verb
    tip: re-search — the prefix re-
    spelling_hint: ""
    definition: Systematic investigation to discover or establish facts.
    example: She is doing research on climate change.
    synonyms:
      - study
      - inquiry
      - investigation
      - analysis
      - exploration
    syn_pos: noun
    syn_example: Conduct research / a study / an inquiry.
    syn_examples:
      - the: She is doing research on climate change.
        syns:
          - study
          - investigation
          - analysis
          - exploration
      - the: The team conducted research into the disease.
        syns:
          - study
          - inquiry
    syn_notes:
      study: a detailed examination
      inquiry: the process of asking
      investigation: a systematic examination
      analysis: breaking something down
      exploration: investigating widely
    syn_near:
      - survey
      - experiment
      - trial
      - paper
      - poll
    syn_avoid:
      analysis: >-
        = working on a body of data that already exists, so it needs material in
        hand; the team conducted analysis into the disease has the wrong
        preposition
      exploration: >-
        = a wide and often untargeted look around a field or a place, with the
        frame an exploration of; it lacks the systematic sense that research
        carries
      inquiry: >-
        = the act of asking questions, which takes an inquiry by or an inquiry
        into; doing inquiry on climate change drops both the article and the
        preposition
      investigation: >-
        = a systematic hunt for causes or faults, usually of a crime, and it
        weighs heavier than a routine study on a subject
      survey: >-
        = asking a sample of people the same questions, so it belongs to opinion
        or customer work; her study of climate change is not a survey of the
        public
      experiment: >-
        = a planned test in which something is varied on purpose, and it takes an
        experiment on or with a sample rather than the wide frame of research on +
        topic
      trial: >-
        = a test of a drug or a method in the field, so a trial of or a trial on
        is its frame and it names the test itself, not the body of work
      paper: >-
        = the written report, so a paper on + topic is the article while research
        is the activity; she is doing research, not publishing
      poll: >-
        = a snapshot of opinion from a sample of voters, with the frames a poll of
        or in a poll; it fits election or market work, not climate science
    syn_nuance: >-
      Research is the general word for systematic enquiry and it takes on, into
      and for. Study names a body of written work as much as the activity,
      investigation adds a hunt for causes, analysis needs data that already
      exists, and inquiry wants into or by. The frame, not the sense, tells you
      which member fits the sentence in front of you.
