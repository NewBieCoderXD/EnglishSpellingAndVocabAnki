  - word: problem
    ipa: /ˈprɒb.ləm/
    pos: noun
    tip: prob-lem — 'prob', then 'lem'
    spelling_hint: ""
    definition: A matter or situation regarded as unwelcome or harmful.
    example: We need to solve this problem.
    synonyms:
      - issue
      - challenge
      - difficulty
      - obstacle
      - drawback
    syn_pos: noun
    syn_example: '"Drawback" suits essays: "The main drawback is the cost."'
    syn_id: problem
    syn_examples:
      - the: Traffic is a serious problem in most big cities.
        syns:
          - issue
          - challenge
          - difficulty
        avoid:
          drawback: >-
            = a disadvantage attached to a plan or product, so the frame is "the
            main drawback of + -ing"; traffic as a problem has no alternative or
            advantage to weigh it against
      - the: The main problem is a lack of funding.
        syns:
          - difficulty
          - obstacle
          - drawback
        avoid:
          issue: >-
            = a topic or matter under discussion, the neutral word in business
            English; too bland for the main problem is a lack of funding, which
            names a fault, though "funding is an issue" fits elsewhere
      - the: Finding affordable housing can be a problem.
        syns:
          - challenge
          - difficulty
          - obstacle
        avoid:
          drawback: >-
            = a disadvantage attached to a plan or product, so the frame is "the
            main drawback of + -ing"; "can be a problem" is used on its own here,
            with no other option to set the drawback against
          issue: >-
            = a topic or matter under discussion, the neutral word in business
            English; the frame is "can be a + noun" about finding housing, and an
            issue is a topic, not a fault or a piece of trouble
    syn_notes:
      issue: a topic or problem
      challenge: a task that tests ability
      difficulty: trouble
      obstacle: a barrier
      drawback: a disadvantage
    syn_near:
      - trouble
      - flaw
      - dilemma
      - worry
      - snag
    syn_avoid:
      issue: >-
        = a topic or matter under discussion, the neutral word in business
        English; too bland for the main problem is a lack of funding, which names
        a fault, and housing can be an issue in other writing.
      challenge: >-
        = a task that tests your ability, usually positive; it needs a challenge
        of doing something, and it cannot name the main fault here, where the
        point is what is broken, not what tests you.
      obstacle: >-
        = a barrier that blocks progress, so it needs a noun of movement (an
        obstacle to progress); too narrow for traffic in general or for a shortage
        of money, which is not something you must get past.
      drawback: >-
        = a disadvantage attached to a plan or product, so the frame is the main
        drawback of X is ...; the sentences contain no option or advantage to set
        the disadvantage against.
      trouble: >-
        = difficulty in general, and it is uncountable (have trouble finding); too
        vague for a serious problem in most big cities, which names a named fault
        of a system.
      flaw: >-
        = a defect in how something is made, so it needs a flaw in the design;
        traffic and a lack of funding are not defects in an object, and a problem
        can be a shortage rather than a fault.
      dilemma: >-
        = a hard choice between two options, and it needs a dilemma about or a
        dilemma for; the three sentences describe a fault, not a decision to be
        made.
      worry: >-
        = something that causes anxiety, and it takes a worry about or a worry
        for; it frames the trouble as a person's unease, while these sentences
        state an objective fault.
      snag: >-
        = a small unexpected obstacle, and it is informal; far too minor for a
        serious problem in most big cities, where the fault is large and
        structural.
    syn_nuance: >-
      Problem is the general word and the others narrow it. Difficulty is trouble
      in doing something, obstacle is a barrier to progress, issue is the neutral
      topic word, challenge frames a task as a test, and drawback is a
      disadvantage of a choice, so a lack of funding takes obstacle or drawback,
      while traffic takes issue or difficulty.
