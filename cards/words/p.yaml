  - word: prioritize
    ipa: /praɪˈɒr.ɪ.taɪz/
    pos: verb
    tip: pri-or-i-tize — 'or', then 'i-tize'
    spelling_hint: ""
    definition: To treat something as more important than others.
    example: We must prioritize safety.
    synonyms:
      - rank
      - favour
      - emphasize
      - put first
      - prefer
    syn_pos: verb
    syn_example: Prioritize / rank / put first the key tasks.
    syn_examples:
      - the: We must prioritize safety above all.
        syns:
          - rank
          - put first
          - emphasize
        avoid:
          favour: >-
            = to prefer one option as a matter of taste, so the frame is a person
            plus a noun ("she favours her studies"); liking safety first is not
            ranking it against the rest
          prefer: >-
            = to like A more than B, and it needs both options, as in "prefer A to
            B"; "prefer safety above all" names no rival, and "above all" is a
            priority
      - the: She tends to prioritize her studies over socialising.
        syns:
          - prefer
          - favour
          - put first
      - the: The plan is designed to prioritize the most urgent tasks.
        syns:
          - emphasize
          - rank
          - put first
        avoid:
          favour: >-
            = to treat one option as preferable, a matter of taste; a plan has no
            tastes, and what it does here is order the tasks, which needs "rank" or
            "put first"
          prefer: >-
            = to like A more than B, and it needs both options; a plan likes
            nothing, and the urgent tasks are set against no rival, only placed
            first
    syn_notes:
      rank: order by importance
      favour: treat with preference
      emphasize: focus attention on
      put first: make the top priority
      prefer: like better
    syn_near:
      - focus on
      - value
      - promote
      - speed up
    syn_avoid:
      rank: >-
        = to order several items on a scale ("rank them by importance"); with only
        one thing named, as when she prioritizes her studies, there is nothing to
        order, so use put first or prefer
      emphasize: >-
        = to give extra weight to a point in speech or text ("emphasized the
        risks"); it stresses a message instead of choosing between two things, so
        it has no slot for studies over socialising
      favour: >-
        = to prefer one option as a matter of taste, and the frame is a person
        plus a noun ("she favours her studies"); it ranks nothing, so it cannot
        express a plan in which something comes first
      prefer: >-
        = to like A more than B, and it needs both options, as in "prefer A to B"
        or "prefer A over B"; "we must prefer safety above all" is wrong, as no
        rival option and no ranking are given
      focus on: >-
        = a phrasal verb that must take "on" ("focus on the urgent tasks"), so it
        is fine English here, but it narrows attention to one topic instead of
        deciding what comes first in a plan
      value: >-
        = to hold something in high esteem ("we value safety"); it states a
        standing attitude, not a decision to do one thing before another, so
        "value safety above all" praises rather than sequences
      promote: >-
        = to advance someone in rank, or to advertise a product ("promote a new
        line"); it changes status or publicity, whereas here the tasks are only
        being ordered, so nothing is promoted
      speed up: >-
        = to make a process happen faster; nothing here is accelerated, only
        rearranged, and the supervisor who keeps work moving would speed it up
        only in a rush
    syn_nuance: >-
      All of these decide what comes first, but the object differs. Prioritize,
      put first and rank work on a list of jobs and take the item itself
      ("prioritize the urgent tasks"), whereas prefer and favour compare two named
      options ("prefer studies to socialising"), and emphasize only adds weight to
      what you say.
