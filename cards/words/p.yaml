  - word: pursue
    ipa: /pəˈsjuː/
    pos: verb
    tip: pur-sue — the 'ue' at the end
    spelling_hint: ""
    definition: To follow or chase; to aim to achieve something.
    example: She decided to pursue a career in science.
    synonyms:
      - chase
      - seek
      - follow
      - strive for
      - aim for
    syn_pos: verb
    syn_example: Pursue / seek / strive for excellence.
    syn_examples:
      - the: She decided to pursue a career in science.
        syns:
          - seek
          - strive for
          - aim for
        avoid:
          chase: >-
            = to run after something in order to catch it ("chase the thief"); a
            career is not run down, so "chase a career" is not English, though
            "chase the suspect" is
      - the: The police decided to pursue the suspect on foot.
        syns:
          - chase
          - follow
        avoid:
          seek: >-
            = to search for something not yet known, and it takes a plain noun
            ("seek advice"); the suspect is already in sight, so the frame is
            "chase" or "follow"
          strive for: >-
            = to strain continuously towards a goal ("strive for excellence"); it
            names the effort, not the tracking here, and "strive for the suspect"
            means trying to catch him
      - the: We will pursue every possible option.
        syns:
          - follow
          - aim for
        avoid:
          chase: >-
            = to run after something in order to catch it; nothing runs here and
            options cannot be caught, though "chase the suspect on foot" is exactly
            right
          seek: >-
            = to search for something not yet known ("seek advice", "seek
            permission"); the options are already listed, so none is being sought,
            and effort is not a hunt
          strive for: >-
            = to strain towards a goal, so it takes "for + noun/gerund"; what is
            meant here is following up each option, not one straining effort at a
            single goal
    syn_notes:
      chase: go after actively
      seek: look for
      follow: go along or after
      strive for: make a strong effort for
      aim for: intend to reach
    syn_near:
      - explore
      - hunt
      - continue
      - proceed with
    syn_avoid:
      chase: >-
        = to run after something in order to catch it ("chase the thief"); it
        needs a physical runner, so "chase a career" is not English, though "chase
        the suspect on foot" is exactly right
      seek: >-
        = to search for something not yet known, and it takes a plain noun ("seek
        advice", "seek permission"); nothing is being searched for in "pursue
        every possible option", and effort is not a hunt
      follow: >-
        = to go after someone ahead of you, or to obey a rule ("follow the
        guidelines"); it presupposes a leader or an instruction, and a career is
        neither, so "follow a career" does not work
      strive for: >-
        = to make a continuous, often strained effort towards a goal ("strive for
        excellence"); it names the effort, not the course of action, and "strive
        for the suspect" would mean aiming to catch him
      aim for: >-
        = to intend to reach a goal, so it stays on the planning side; "the police
        aim for the suspect" means they intend to catch him, while pursuing him
        means actually closing in on him
      explore: >-
        = to look into a subject or travel round a place ("explore the options");
        fine English in the third sentence, but it describes the search itself,
        not a course of action followed through to the end
      hunt: >-
        = to search hard for something hidden or wanted, in the frames "hunt for"
        and "hunt down"; it cannot take a bare career or option, and it adds a
        secretive, aggressive tone
      continue: >-
        = to keep on with an activity already begun ("continue her career");
        pursuing a career means starting one and working towards it, and it fits
        neither the suspect nor a list of options
      proceed with: >-
        = a formal phrasal verb that needs "with" plus a noun or "to" plus a verb;
        it means to go ahead, not to follow something through, and "proceed with
        the suspect" is not English
    syn_nuance: >-
      Pursue means following something through in order to reach or obtain it, and
      it takes that object directly, as in a career, an option or a clue. Seek and
      strive for search or strain towards the goal, aim for states the intention
      only, and follow and chase need someone or something ahead of you.
    components:
      - spelling
      - definitions
      - synonyms
