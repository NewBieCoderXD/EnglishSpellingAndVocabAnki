  - word: plausible
    ipa: /ˈplɔː.zə.bəl/
    pos: adjective
    tip: plau-si-ble — 'plau', then 'sible'
    spelling_hint: ""
    definition: Seeming reasonable or likely to be true.
    example: She offered a plausible explanation.
    synonyms:
      - credible
      - believable
      - reasonable
      - convincing
      - likely
    syn_pos: adjective
    syn_example: A plausible / credible / convincing explanation.
    syn_examples:
      - the: She offered a plausible explanation.
        syns:
          - credible
          - believable
          - reasonable
          - convincing
      - the: There is a plausible link between the two events.
        syns:
          - likely
          - believable
          - reasonable
    syn_notes:
      credible: believable, trustworthy
      believable: can be believed
      reasonable: sensible
      convincing: persuasive
      likely: probable
    syn_near:
      - possible
      - feasible
      - logical
      - tenable
    syn_avoid:
      likely: >-
        = probable, and it wants "to + verb" or a noun such as "the likely cause";
        an explanation is not likely but true or false, whereas "a likely link
        between events" is correct
      credible: >-
        = believable because the source is trustworthy, so it judges a person or a
        story; a link between two events is judged on the evidence, not on who
        describes it
      convincing: >-
        = so persuasive that it settles the question, the frame of "a convincing
        argument or witness"; a suspected link between events is only reasonable
        or possible, never convincing yet
      possible: >-
        = able to happen at all, which admits far more than plausible; "a possible
        explanation" leaves room for one that is merely imaginable
      feasible: >-
        = possible to carry out in practice, the frame of "a feasible plan,
        timetable or option"; it is about practicality and logistics, not about
        whether a claim is believable
      logical: >-
        = following from the premises, so it grades the structure of an argument;
        an argument can be logical and still rest on false facts
      tenable: >-
        = able to be defended against criticism, a formal word for a hypothesis, a
        theory or a position; it does not fit an explanation, which is judged on
        its truth
    syn_nuance: >-
      All five say a statement can be accepted, but they grade how far. Plausible
      means it fits the facts and could be true, so it is the default hedge.
      Credible and convincing judge the source, likely grades probability and
      takes "likely to + verb", reasonable rates the judgement itself, and
      possible admits far more than plausible does.
