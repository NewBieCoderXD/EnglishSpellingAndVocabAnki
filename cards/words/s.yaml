  - word: sufficient
    ipa: /səˈfɪʃ.ənt/
    pos: adjective
    tip: suf-fi-cient — double f, then 'icient'
    spelling_hint: ""
    definition: Enough; adequate for a purpose.
    example: We have sufficient funds to proceed.
    synonyms:
      - enough
      - adequate
      - ample
      - plenty
      - satisfactory
    syn_pos: adjective
    syn_example: Provide sufficient / enough / adequate evidence.
    syn_examples:
      - the: We have sufficient funds to proceed.
        syns:
          - enough
          - adequate
          - ample
          - plenty
        avoid:
          satisfactory: >-
            = meeting a standard or expectations, so it is a verdict on quality; we
            have satisfactory funds asks how good the money is, not how much there
            is
      - the: The report provides sufficient evidence.
        syns:
          - adequate
          - satisfactory
          - enough
      - the: There is sufficient space for everyone.
        syns:
          - enough
          - ample
          - plenty
        avoid:
          satisfactory: >-
            = meeting a standard or expectations, so it is a verdict on quality;
            space is judged by how much there is, and there is satisfactory space
            asks how good the room is, not whether it holds everyone
    syn_notes:
      enough: the needed amount
      adequate: sufficient for the purpose
      ample: more than enough
      plenty: abundant
      satisfactory: meeting expectations
    syn_near:
      - abundant
      - spacious
      - substantial
      - complete
      - convincing
    syn_avoid:
      adequate: >-
        = good enough for a named purpose, and it needs adequate for or adequate
        to; with space there is no task to be adequate for, so we fall back on
        enough or ample
      ample: >-
        = more than enough for a purpose, and the natural word before time and
        space; ample evidence is possible English but the report sentence wants
        adequate or enough
      plenty: >-
        = a quantifier that needs of before its noun, so plenty cannot stand where
        sufficient stands before a bare noun; there is plenty of space is the
        natural frame
      satisfactory: >-
        = meeting a standard or expectations, so it is a verdict on quality; we
        have satisfactory funds asks how good the money is, not how much there is
      abundant: >-
        = present in large quantities, which stresses supply rather than adequacy
        for a task; abundant funds is fine English, but the point of the sentence
        is having just enough to proceed
      spacious: >-
        = physically roomy, and it describes a room, a car or a layout rather than
        space as a mass noun; there is spacious space collides with itself
      substantial: >-
        = large in amount or importance, a finance and academic word; a
        substantial amount of is its frame, and it says well over the needed
        amount, not exactly enough
      complete: >-
        = whole, with nothing missing, a real collocation before evidence but the
        opposite idea, since a complete set suggests everything, not a threshold
      convincing: >-
        = so persuasive that it settles a doubt, with the frames convincing
        evidence and convincing proof; it answers a different question from
        whether enough has been shown
    syn_nuance: >-
      Sufficient is a formal adjective that stands before a bare noun, as in
      sufficient funds or sufficient evidence, and it means exactly the amount
      needed. Enough is the everyday equivalent, ample adds surplus, adequate is
      tied to a stated purpose, and satisfactory judges quality. Plenty is a
      quantifier, so it needs of plus its noun.
