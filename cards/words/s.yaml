  - word: substitute
    ipa: /ˈsʌb.stɪ.tjuːt/
    pos: noun
    tip: sub-sti-tute — "sub" under (in place of)
    definition: A person or thing that takes the place of another.
    example: There is no substitute for hard practice.
    synonyms:
