  - word: strategy
    ipa: /ˈstræt.ə.dʒi/
    pos: noun
    tip: strat-egy — 'at', then 'egy'
    spelling_hint: ""
    definition: A plan of action designed to achieve a long-term goal.
    example: We agreed on a new strategy.
    synonyms:
      - plan
      - approach
      - tactic
      - scheme
      - method
    syn_pos: noun
    syn_example: Develop a strategy / plan / approach.
    syn_examples:
      - the: We agreed on a new strategy.
        syns:
          - plan
          - approach
          - scheme
      - the: Their marketing strategy targets young adults.
        syns:
          - approach
          - tactic
          - method
          - plan
    syn_notes:
      plan: a detailed arrangement
      approach: a way of dealing with
      tactic: a short-term action
      scheme: an organized plan
      method: a way of doing something
    syn_near:
      - policy
      - campaign
      - technique
      - programme
      - roadmap
    syn_avoid:
      method: >-
        = a set of steps for doing a task, and it modifies the doing, as in a
        method of teaching; we agreed on a new method points at a technique, not a
        chosen course of action
      scheme: >-
        = an organised plan, but in British English a scheme is a government or
        local authority programme, so their marketing scheme reads as a funded
        project
      tactic: >-
        = one clever move inside a larger plan, so it needs a tactic for doing
        something; we agreed on a new tactic names a single step, not the whole
        approach
      policy: >-
        = a rule set that an organisation adopts and applies to everyone, so it is
        an institutional frame rather than something two people settle between
        them
      campaign: >-
        = a burst of activity to win publicity or votes over a few weeks, so it
        covers one push, not the long-term positioning behind it
      technique: >-
        = a knack or skill for performing a task well, so it describes doing
        something, not choosing what to do; a marketing technique is the craft,
        not the strategy
      programme: >-
        = a named set of scheduled projects, or a television series; a company
        programme is a budgeted plan of activities, not the thinking behind a
        strategy
      roadmap: >-
        = business jargon for a phased timeline, and it needs a roadmap to or a
        roadmap for; we agreed on a new roadmap sounds like project management
        talk
    syn_nuance: >-
      Strategy is the reasoning behind a course of action, and it takes on, for
      and in + field. Plan is the plain word, approach the neutral one, method the
      set of steps, tactic a single move, and scheme usually a government
      programme in British English. A verb phrase like targets young adults asks
      for the approach, not the scheme.
