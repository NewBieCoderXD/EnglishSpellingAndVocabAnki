  - word: significant
    ipa: /sɪɡˈnɪf.ɪ.kənt/
    pos: adjective
    tip: <b>signi</b>-fi-<b>cant</b> — commonly mis-spelled "signficant"
    spelling_hint: ""
    definition: Large or important enough to be noticed; having a real effect on something.
    example: The results show a significant improvement.
    synonyms:
      - substantial
      - considerable
      - major
      - marked
      - notable
    syn_pos: adjective
    syn_example: '"A significant improvement" — substantial / considerable are task 1 staples.'
    syn_examples:
      - the: The results show a significant improvement.
        syns:
          - substantial
          - notable
          - marked
        avoid:
          major: >-
            = of high importance or big size, and it is fine for a breakthrough ("a
            major breakthrough"); the results here only report a measured change,
            and major would add a ranking the data does not make
      - the: There has been a significant rise in online shopping.
        syns:
          - considerable
          - major
          - substantial
      - the: The study found significant differences between the two groups.
        syns:
          - marked
          - considerable
          - notable
        avoid:
          major: >-
            = it rates something as important or big ("a major concern"); with two
            groups the study reports a measurable gap, and major would claim the gap
            was large, which the sentence does not say
    syn_notes:
      substantial: large in amount
      considerable: quite large
      major: big or important
      marked: clearly noticeable
      notable: worth noting
    syn_near:
      - appreciable
      - dramatic
      - sizeable
      - sharp
      - relevant
    syn_avoid:
      substantial: >-
        = large in amount, and it is accepted with the rise; but "a substantial
        improvement" and "substantial differences" claim a big size, whereas the
        study reports the strength of a measured gap
      considerable: >-
        = quite large in amount, so it is right for the rise; but "a considerable
        improvement" and "considerable differences" overstate the size and still
        leave out statistical weight
      major: >-
        = of high importance or big size, and it fits the rise; but "a major
        improvement" and "major differences" talk of importance, where the study
        reports a measurable gap, not a ranking
      marked: >-
        = clearly noticeable ("marked differences"), and it fits the differences;
        but "a marked improvement" and "a marked rise" promise a striking change,
        which is a stronger claim than significant
      notable: >-
        = worth remarking on ("a notable achievement"), and it fits the
        differences; but "a notable improvement" and "a notable rise" say only
        that it deserved a comment, not that it was large or measurable
      appreciable: >-
        = large enough to be noticed ("an appreciable rise"); correct in the rise
        sentence, but it measures how noticeable an effect is, so it cannot report
        the weight of a finding or a difference
      dramatic: >-
        = sudden and far bigger than expected, or done for effect ("a dramatic
        fall in sales"); it adds shock and speed that significant does not, so "a
        dramatic improvement" overstates a plain gain
      sizeable: >-
        = the same as substantial but less formal; it can only mean large in size
        or amount, so it fails for "significant differences" and for the
        statistical weight of a finding
      sharp: >-
        = rising or falling fast, as in "a sharp rise in costs"; it describes the
        shape of the change, and here the data report size and weight rather than
        speed
      relevant: >-
        = connected to the matter in hand ("relevant evidence"); it says what
        relates, not what matters or how large it is, so "relevant differences"
        answers a different question
    syn_nuance: >-
      Significant covers two senses. With a quantity ("a significant rise") it
      means large, like substantial, considerable and major, and with a result
      ("significant differences") it means large enough to be trusted, which is
      where marked and notable belong. Sharp and dramatic add speed and shock.
