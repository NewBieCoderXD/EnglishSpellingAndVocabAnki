  - word: impartial
    ipa: /ɪmˈpɑː.ʃəl/
    pos: adjective
    tip: im-par-tial — 'par', then 'tial'
    spelling_hint: ""
    definition: Fair and neutral; not favouring one side.
    example: The judge must remain impartial.
    synonyms:
      - neutral
      - unbiased
      - objective
      - fair
      - even-handed
    syn_pos: adjective
    syn_example: An impartial / unbiased / objective assessment.
    syn_examples:
      - the: The judge must remain impartial.
        syns:
          - neutral
          - fair
          - unbiased
          - objective
      - the: We need an impartial assessment of the evidence.
        syns:
          - objective
          - even-handed
          - fair
          - unbiased
    syn_notes:
      neutral: not taking sides
      unbiased: without prejudice
      objective: based on facts, not feelings
      fair: just
      even-handed: balanced
    syn_near:
      - disinterested
      - uninvolved
      - uncompromising
      - detached
    syn_avoid:
      even-handed: >-
        = giving both sides equal weight; it describes a decision or a split ("an
        even-handed ruling"), not a person who has to stay that way all day
      neutral: >-
        = not taking sides, and normally it names a stance between others
        ("neutral sources", "remain neutral"): a neutral assessment suggests an
        absent middle ground, not balanced evidence
      disinterested: >-
        = having no stake in the outcome, as in a disinterested observer: it needs
        a person, and in casual English it now means bored or uninvolved
      uninvolved: >-
        = not taking part in the event, a fact about participation rather than
        bias: a judge who stays uninvolved can still be biased
      uncompromising: >-
        = refusing to give way, so it means stubborn ("an uncompromising
        attitude"): used of a person here it suggests bias in the opposite
        direction
      detached: >-
        = free from emotion, and it pairs with a person, a voice or a tone ("a
        detached tone"): an assessment is called objective or impartial, never
        detached
    syn_nuance: >-
      All mean giving no side special weight, but the object decides which. A
      judge, jury or reporter takes impartial, neutral or unbiased; a piece of
      analysis takes objective, which stresses facts rather than feelings.
      Even-handed is for the decision itself, as in an even-handed ruling, and it
      always shows the two sides balanced.
    components:
