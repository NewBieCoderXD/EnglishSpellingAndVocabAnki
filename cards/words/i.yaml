  - word: increase
    ipa: /ɪnˈkriːs/
    pos: verb
    tip: in-crease — the 'ea' = /iː/
    spelling_hint: ""
    definition: To become or make something greater in size, amount or degree.
    example: Prices continue to increase.
    synonyms:
      - rise
      - grow
      - surge
      - climb
      - escalate
      - rocket
    syn_pos: verb
    syn_example: '"Sales surged in 2024" or "prices rocketed" — vivid verbs for IELTS task 1.'
    syn_id: increase
    syn_examples:
      - the: Prices tend to increase during the winter.
        syns:
          - rise
          - climb
          - surge
          - rocket
        avoid:
          escalate: >-
            = get steadily worse, the word for conflict, crime or prices someone has
            deliberately raised; "prices tend to escalate" blames a decision and is
            far too strong for a seasonal drift
      - the: Demand for clean energy continues to increase.
        syns:
          - grow
          - rise
          - surge
          - climb
        avoid:
          escalate: >-
            = get steadily worse, normally conflict, crime or prices a supplier has
            raised; "demand continues to escalate" reads as a hostile build-up, not
            growth in a market report
          rocket: >-
            = shoot up in a sudden leap, far too big for a trend that simply
            continues; "demand continues to rocket" also fights the plain present
            perfect of "continues to increase"
      - the: Tensions between the two nations may increase.
        syns:
          - escalate
          - rise
          - grow
        avoid:
          rocket: >-
            = shoot up in a sudden leap, and it wants an agent doing the shooting;
            "tensions may rocket" has nobody to fire them up and the modal may makes
            the leap impossible
    syn_notes:
      rise: go up
      grow: become larger
      surge: jump suddenly and strongly
      climb: rise gradually
      escalate: increase steadily (often bad)
      rocket: increase very fast
    syn_near:
      - raise
      - boost
      - soar
      - expand
      - improve
    syn_avoid:
      grow: >-
        = become larger or more numerous, the word for output or demand; after
        prices it needs a countable or mass noun, and the general term for figures
        going up is rise.
      escalate: >-
        = get steadily worse, usually conflict, crime or prices someone has
        raised; too negative and too transitive in business for prices tend to
        escalate or demand continues to escalate.
      surge: >-
        = jump up suddenly and sharply, so it needs a one-off event; it cannot
        describe the winter pattern that repeats in Prices tend to increase, and
        it is too violent for tensions may increase.
      climb: >-
        = go up gradually, and it wants a hill, a ladder or a line of figures;
        prices tend to climb and tensions may climb are not the natural verb
        choices here, and it is too physical for demand.
      rocket: >-
        = shoot up extremely fast in a sudden leap; far too strong for the gentle
        seasonal rise in prices, and rocket cannot sit with the modal may in
        tensions may increase.
      raise: >-
        = transitive, so a subject has to raise something (raise prices, the city
        raised prices); the three frames need an intransitive verb after prices,
        demand and tensions.
      boost: >-
        = lift a figure, transitive and businessy (boost sales); it needs an
        object, so it cannot stand after prices tend to or after tensions may
        increase.
      soar: >-
        = rise very steeply, and it is stronger than increase; prices tend to soar
        says the opposite of a steady, moderate winter rise, and soar suits a
        sudden jump in a figure.
      expand: >-
        = grow in size or spread into new areas, and it usually needs an object or
        expand into; it measures extent, not the level of a figure, so it cannot
        replace increase here.
      improve: >-
        = get better in quality, and it takes improve on or an object; more demand
        is not the same as better demand, so demand continues to improve would
        mean something else entirely.
    syn_nuance: >-
      All are intransitive verbs of going up, differing by speed and subject.
      Prices and demand take rise or climb for a gradual trend and surge or rocket
      for a sudden jump; grow fits a quantity that becomes more numerous; escalate
      is reserved for a worsening situation, so tensions take escalate, rise or
      grow, not the others.
