  - word: imperative
    ipa: /ɪmˈper.ə.tɪv/
    pos: adjective/noun
    tip: im-per-a-tive — 'per', then 'a-tive'
    spelling_hint: ""
    definition: Absolutely necessary; vitally important.
    example: It is imperative that we act now.
    synonyms:
      - essential
      - vital
      - crucial
      - mandatory
      - required
    syn_pos: adjective
    syn_example: It is imperative / essential / crucial to respond.
    syn_examples:
      - the: It is imperative that we act now.
        syns:
          - essential
          - crucial
          - vital
      - the: Pollution control is imperative.
        syns:
          - essential
          - mandatory
          - required
    syn_notes:
      essential: absolutely necessary
      vital: critically important
      crucial: make-or-break
      mandatory: compulsory by rule
      required: needed or demanded
    syn_near:
      - compulsory
      - indispensable
      - urgent
      - paramount
    syn_avoid:
      vital: >-
        = needed to keep someone or something alive, so it takes "vital to + noun"
        or names an organ: it suits "it is vital that we act", but pollution
        control is only essential
      crucial: >-
        = the whole outcome turns on it, a decision-level word ("a crucial
        moment", "crucial to the result"): the register is too high for a whole
        field of policy
      mandatory: >-
        = laid down by a rule, statute or contract, so it needs an enforceable
        source: it can pass with pollution control, but nobody is forcing our
        decision to act
      required: >-
        = needed or formally asked for, with no sense of a near duty: "it is
        required that we act now" merely states a need, where the frame demands
        what must not wait
      compulsory: >-
        = imposed by a rule or law and enforceable, so it always has an authority
        behind it: "it is compulsory that we act now" implies a statute, not a
        judgement
      indispensable: >-
        = you cannot function without it, and it takes a person or a tool ("water
        is indispensable to life"): it cannot describe a field of policy at all
      urgent: >-
        = needing to happen now, so it is about timing: an urgent case or an
        urgent problem fits, but pollution control as a whole is essential, not
        urgent
      paramount: >-
        = the single most important thing, a superlative that wants "a paramount
        concern": with nothing to compare it to, "pollution control is paramount"
        says nothing
    syn_nuance: >-
      All insist that something must be done, but the source of the duty separates
      them. Imperative, essential, vital and crucial argue from importance, so
      they fit "it is imperative that", while mandatory, compulsory and required
      argue from rules someone enforces. Vital and indispensable are
      life-or-death, too strong for pollution control.
    components:
      - spelling
      - definitions
      - synonyms
  - word: implement
    ipa: /ˈɪm.plɪ.ment/
    pos: verb
    tip: im-<b>ple</b>-ment — remember the "e" after "pl"
    spelling_hint: ""
    definition: To put a plan, decision or agreement into effect.
    example: The school will implement the new timetable next term.
    synonyms:
      - introduce
      - enforce
      - adopt
      - apply
    syn_pos: verb
    syn_example: '"Implement reforms" — introduce / adopt / enforce fit policy sentences.'
    syn_examples:
      - the: The school will implement the new timetable next term.
        syns:
          - introduce
          - adopt
          - apply
        avoid:
          enforce: >-
            = to make sure people obey, so it needs a rule with a penalty behind it;
            the frame here is "will implement the new timetable", and a school
            laying out a schedule is not policing anyone
      - the: Governments must implement stricter environmental rules.
        syns:
          - introduce
          - enforce
      - the: The company plans to implement the agreed changes.
        syns:
          - apply
          - adopt
          - introduce
        avoid:
          enforce: >-
            = to make sure people obey, so it needs a rule with a penalty behind it;
            "plans to implement the agreed changes" is about carrying out terms both
            sides settled, which nobody has to be made to obey
    syn_notes:
      introduce: bring in formally
      enforce: make sure it is followed
      adopt: take up officially
      apply: put into effect
    syn_near:
      - examine
      - comply
      - impose
      - installation
      - launch
    syn_avoid:
      adopt: >-
        = to take up officially, which fits "the agreed changes"; it is rejected
        for stricter rules, where nothing is being chosen for the first time, only
        brought into force
      apply: >-
        = to put rules into force, but the usual collocation is "apply the rules
        to conduct"; it is rejected in "Governments must implement stricter
        rules", where the new rules themselves are the news
      enforce: >-
        = to make sure people obey, which needs an authority with power to punish;
        a school bringing in a timetable or a company applying agreed changes has
        nobody to enforce them on
      examine: >-
        = to inspect closely, a false friend from Latin; the sentences need a verb
        meaning put into practice, not one meaning study a timetable or a set of
        changes
      comply: >-
        = to obey a rule, and it always takes "with", as in "comply with the new
        timetable"; here the school and the government are making the rule, not
        obeying it
      impose: >-
        = to force something on people, as in "impose a tax" or "impose a ban"; it
        fits the announcement of a tax but not bringing agreed changes or a
        timetable into practice
      installation: >-
        = the noun, as in "the installation of the new system"; every sentence
        here needs a verb after its subject, so a noun cannot fill the slot before
        the object
      launch: >-
        = to start something publicly, as in "launch an app" or "launch a
        product"; it suits the entrepreneur's app, not the putting of a timetable
        or agreed changes into effect
    syn_nuance: >-
      The family splits between putting something into force and making people
      obey it. Implement is the neutral policy word, introduce and apply cover a
      new measure or a rule, adopt stresses official choice, and enforce needs an
      authority with power to sanction. A firm implements; a government or a court
      enforces.
    components:
      - spelling
      - definitions
      - synonyms
  - word: implicit
    ipa: /ɪmˈplɪs.ɪt/
    pos: adjective
    tip: im-pli-cit — 'pli', then 'cit'
    spelling_hint: ""
    definition: Suggested or understood without being stated directly.
    example: There is an implicit assumption in the argument.
    synonyms:
      - implied
      - unspoken
      - inherent
      - understood
      - tacit
    syn_pos: adjective
    syn_example: An implicit / implied / unspoken agreement.
    syn_examples:
      - the: There is an implicit assumption in the argument.
        syns:
          - implied
          - unspoken
          - tacit
          - understood
      - the: The risks are implicit in the plan.
        syns:
          - inherent
          - understood
          - implied
    syn_notes:
      implied: suggested indirectly
      unspoken: not expressed in words
      inherent: existing as an essential part
      understood: known, grasped
      tacit: understood without being stated
    syn_near:
      - latent
      - covert
      - taciturn
      - unconscious
    syn_avoid:
      inherent: >-
        = existing as an essential part of something: it needs "inherent in +
        noun" ("risks inherent in the plan"), never "an inherent assumption"
      tacit: >-
        = agreed between people without being said ("tacit agreement", "tacit
        understanding"): fine for an assumption, but the plan's risks are
        contained in it, not shared
      unspoken: >-
        = never said out loud, which implies people chose silence: a risk can sit
        inside a plan that everyone discusses openly
      latent: >-
        = present but not yet active or developed, so it pairs with a defect or
        potential: the risks here are already in plain sight, not waiting to
        appear
      covert: >-
        = hidden on purpose and usually for a bad reason, as in a covert agenda: a
        text that leaves something open is not hiding anything
      taciturn: >-
        = a person who says very little, a word for people ("a taciturn witness"):
        it cannot modify an assumption or a plan
      unconscious: >-
        = not in awareness, the usual word for motives, habits and bias: "risks
        are unconscious in the plan" is not a frame English uses
    syn_nuance: >-
      All share the idea of meaning that is not spelled out, but the frame decides
      which fits. Before a noun like assumption or agreement, implicit, implied,
      tacit and unspoken are all natural, while the pattern "inherent in + noun"
      says the quality cannot be pulled out of the thing, as in risks inherent in
      the plan.
    components:
      - spelling
      - definitions
      - synonyms
  - word: implied
    ipa: /ɪmˈplaɪd/
    pos: adjective
    tip: im-pli-ed — "ply" fold in
    definition: Suggested but not directly expressed.
    example: The report carries an implied criticism of the plan.
    synonyms:
      - implicit
      - unspoken
      - tacit
      - suggested
    syn_pos: adjective
    syn_example: Implied / implicit / tacit — suggested without being stated.
    components:
      - spelling
      - definitions
  - word: important
    ipa: /ɪmˈpɔː.tənt/
    pos: adjective
    tip: im-por-tant — 'por', then 'tant'
    spelling_hint: ""
    definition: Of great significance or value; mattering a lot.
    example: This is an important decision.
    synonyms:
      - significant
      - crucial
      - vital
      - essential
      - key
    syn_pos: adjective
    syn_example: Instead of "very important", write "crucial" / "vital" in essays.
    syn_id: important
    syn_examples:
      - the: It is important that we reach a decision today.
        syns:
          - crucial
          - vital
          - essential
      - the: Diet is important in heart disease.
        syns:
          - significant
          - key
          - crucial
    syn_notes:
      significant: notably important
      crucial: make-or-break
      vital: essential for life
      essential: absolutely necessary
      key: central, most important
    syn_near:
      - major
      - notable
      - central
      - prime
      - serious
    syn_avoid:
      vital: >-
        = needed to keep something alive or working, so it takes vital to or vital
        for (vital to recovery); too absolute and too biological for the general
        frame Diet is important in heart disease.
      essential: >-
        = absolutely necessary, pointing at something you cannot do without; too
        strong for important in heart disease, which reports a contribution, not a
        requirement.
      significant: >-
        = large enough to matter, and it wants a measurable result (a significant
        increase, significant differences), so it says nothing about importance,
        and the frame significant that we decide is wrong.
      key: >-
        = the single most important of a set, so it usually needs a countable noun
        (a key factor) or key to; it ranks items and cannot fill the plain
        predicate before that ...
      major: >-
        = big in size, scope or amount, so it needs a countable noun (a major
        factor); it measures scale, not importance, and major in heart disease is
        not English.
      notable: >-
        = worth noticing, clearly weaker than important, and it needs notable for
        or a countable noun (a notable change); too faint for the it is ___ that
        frame.
      central: >-
        = at the centre of something, so its frame is central to the argument; it
        does not work as a plain predicate before that or in the topic frame
        important in heart disease.
      prime: >-
        = the single main one of its kind, and it needs a countable noun (prime
        example, prime target); it cannot stand before that, so it is prime that
        we decide today is not English.
      serious: >-
        = not trivial or not joking, and it takes serious about or a countable
        noun (a serious illness); it is serious that we decide today is not
        idiomatic English.
    syn_nuance: >-
      Importance is a scale. Crucial, vital and essential say the outcome depends
      on it, with vital and essential adding that you cannot do without it, so
      they take it is ___ that we decide. Significant reports a large effect and
      key names the single most important of a set, which is why both are taken in
      Diet is ___ in heart disease.
    components:
      - synonyms
