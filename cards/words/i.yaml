  - word: intrinsic
    ipa: /ɪnˈtrɪn.zɪk/
    pos: adjective
    tip: in-trins-ic — "ins" inside
    definition: Belonging to a thing by its own nature, not added from outside; said of value, worth or motivation.
    example: There is intrinsic value in learning for its own sake.
    synonyms:
      - inherent
      - innate
      - natural
      - inbuilt
      - genuine
    syn_pos: adjective
    syn_example: The intrinsic value of learning.
    syn_examples:
      - the: She has intrinsic motivation for the subject.
        syns:
          - natural
          - innate
          - genuine
        avoid:
          inherent: >-
            = an inseparable part of a thing, and it needs "inherent in + noun"
            ("risks inherent in the plan"); motivation that belongs to her by nature
            is intrinsic, not inherent in the subject
      - the: There is intrinsic value in learning for its own sake.
        syns:
          - natural
          - genuine
        avoid:
          inherent: >-
            = an inseparable part of a thing, and it needs "inherent in + noun"; the
            worth of learning is not a part you can point to inside it
          innate: >-
            = inborn, said of people and animals; the worth of a subject is something
            you come to see, not something you were born with
      - the: Curiosity is intrinsic to human nature.
        syns:
          - inherent
          - innate
          - natural
        avoid:
          genuine: >-
            = real rather than pretended, which suits a feeling or a material
            ("genuine concern", "genuine leather"); a curiosity that belongs to human
            nature is not up for debate, so nothing is being faked here
    syn_notes:
      inherent: an inseparable part, "inherent in + noun"
      innate: inborn, said of people and animals
      natural: arising from the thing itself, not imposed
      inbuilt: built into a design or machine
      genuine: real and not pretended
    syn_near:
      - integral
      - essential
      - valuable
    syn_avoid:
      inbuilt: >-
        = built into a design or a machine ("inbuilt safeguards"); worth is not a
        part anyone installed, so "inbuilt value" is not a phrase
      integral: >-
        = necessary to complete something ("integral to the project"): it ranks a
        part by how important it is, rather than naming worth that is there already
      essential: >-
        = absolutely necessary, so it belongs to what you must have, not to the value
        something carries by its own nature
      valuable: >-
        = worth a lot in someone's judgement, a money sense; "intrinsic" says the
        worth is in the thing itself, whether or not the market agrees
    syn_nuance: >-
      All of these say the quality is there of its own accord, without anything adding
      it. Intrinsic takes "to" and covers worth that belongs to the thing itself —
      value, motivation, merit. Inherent is its near twin but takes "in" and covers an
      inseparable part: where both fit, as in curiosity intrinsic to human nature, the
      preposition is the only difference. Innate is the inborn version and belongs to
      people and animals; inbuilt is the mechanical one; genuine and natural are the
      plain, looser ways to say the same thing.
