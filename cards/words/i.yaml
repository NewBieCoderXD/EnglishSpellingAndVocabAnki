  - word: indicate
    ipa: /ˈɪn.dɪ.keɪt/
    pos: verb
    tip: in-di-cate — 'di', then 'cate'
    spelling_hint: ""
    definition: To point out or show; to be a sign of something.
    example: The results indicate a clear improvement.
    synonyms:
      - show
      - suggest
      - signal
      - point to
      - demonstrate
    syn_pos: verb
    syn_example: The data indicates / suggests / shows a trend.
    syn_examples:
      - the: The results indicate a clear improvement.
        syns:
          - show
          - demonstrate
          - signal
          - point to
      - the: The clouds indicate that rain is coming.
        syns:
          - suggest
          - signal
          - point to
    syn_notes:
      show: make evident
      suggest: imply
      signal: send a sign
      point to: provide evidence toward
      demonstrate: prove with evidence
    syn_near:
      - imply
      - reflect
      - highlight
      - predict
      - establish
    syn_avoid:
      demonstrate: >-
        = to prove a point by showing evidence or examples, the strongest of the
        family: clouds are not evidence, so only a test can demonstrate an
        improvement
      show: >-
        = to make something visible or evident, which needs firm evidence: the
        clouds cannot show that rain is coming, they signal or suggest it
      suggest: >-
        = to put forward a possible reading rather than a certain one, so the
        clouds suggest that rain is coming, but a measured result shows an
        improvement or it does not
      imply: >-
        = to suggest without stating, and it works in the clouds frame as a weaker
        hedge, but it is too vague for results that imply a clear improvement
      reflect: >-
        = to mirror something back, as in a report reflects public opinion: it
        describes a picture, not a piece of evidence, and cannot stand for the
        data
      highlight: >-
        = to draw the reader's attention to something, as in the report highlights
        poverty: it describes what a text does, so it takes a topic, not a finding
      predict: >-
        = to state what will happen, as in predict a fall in sales: neither the
        clouds nor the results can forecast an event that has not happened
      establish: >-
        = to prove beyond doubt, the opposite of indicating: the results indicate
        a trend, while only a large trial can establish it
    syn_nuance: >-
      All of them say a sign points to something. Indicate, show and demonstrate
      need hard evidence, so test, results and data can do all three, and
      demonstrate is the strongest. Suggest, signal and point to work with softer
      signs such as clouds or early symptoms, and suggest is the hedged one where
      the others are not.
