  - word: intricate
    ipa: /ˈɪn.trɪ.kət/
    pos: adjective
    tip: in-tri-cate — 'tri', then 'cate'
    spelling_hint: ""
    definition: Very complicated or detailed; made up of many interconnected parts.
    example: The watch has an intricate mechanism.
    synonyms:
      - complex
      - elaborate
      - complicated
      - detailed
      - convoluted
    syn_pos: adjective
    syn_example: An intricate / elaborate / complex design.
    syn_examples:
      - the: The watch has intricate machinery.
        syns:
          - complex
          - elaborate
          - complicated
        avoid:
          convoluted: >-
            = twisted and hard to unpick, and it normally takes an abstract noun: a
            process, an argument, a system; a mechanism or a pattern is intricate,
            not convoluted
      - the: She drew an intricate pattern.
        syns:
          - elaborate
          - detailed
          - complex
        avoid:
          convoluted: >-
            = twisted and hard to unpick, and it normally takes an abstract noun, a
            process or an argument; a pattern really does twist, so the word
            misleads here, and a drawing is praised, not faulted
    syn_notes:
      complex: with many parts
      elaborate: very detailed and involved
      complicated: hard to follow
      detailed: with many details
      convoluted: twisted, complex
    syn_near:
      - delicate
      - ornate
      - fine
      - fussy
    syn_avoid:
      complicated: >-
        = hard to follow or hard to do, so it reads as a criticism; machinery can
        be complicated, but calling a pattern complicated is a complaint rather
        than a compliment
      convoluted: >-
        = twisted and hard to unpick, and it normally takes an abstract noun: a
        process, an argument, a system; a mechanism or a pattern is intricate, not
        convoluted
      detailed: >-
        = full of fine points, a word for information, a report or a description;
        machinery has parts rather than details, so use "complex machinery" or
        "elaborate workings"
      delicate: >-
        = finely made and easily damaged, the frame of "a delicate mechanism,
        balance or instrument"; it warns about fragility, not about the number of
        interacting parts
      ornate: >-
        = heavily decorated, the frame of "ornate carving, an ornate facade"; it
        describes looks and workmanship, not complexity of working
      fine: >-
        = of high quality, or very small in "fine detail"; it is a word for
        workmanship and for scale, and it says nothing about how the parts
        interact
      fussy: >-
        = over-fussy about small details, and it is informal and negative; it
        criticises a person or a style, not the complexity of a mechanism
    syn_nuance: >-
      These all describe something with many working parts, but the judgement
      differs. Intricate and elaborate are approving and take "machinery, a
      pattern, a design". Complex is neutral and suits systems and processes,
      detailed counts the fine points and fits descriptions, and complicated and
      convoluted are critical, so avoid them in praise.
