    syn_examples:
      - the: The cargo survived the crash intact.
        syns:
          - whole
          - undamaged
          - unbroken
      - the: The evidence must remain intact.
        syns:
          - whole
          - complete
          - pristine
          - undamaged
    syn_notes:
      whole: all in one piece
      undamaged: not harmed
      complete: with all parts
      unbroken: not broken
      pristine: in perfectly original condition
    syn_near:
      - sound
      - safe
      - unharmed
      - unspoilt
    syn_avoid:
      complete: >-
        = having all its parts, so it says nothing about damage; "the cargo
        survived the crash complete" would mean the load was not split up, not
        that it was unmarked
      pristine: >-
        = in perfect original condition, a word for a new or barely used car, a
        room or a beach; a cargo that has been through a crash is not pristine,
        however unmarked it looks
      unbroken: >-
        = literally not broken, which fits the cargo but not documents; for
        evidence you mean that nothing has been altered or removed, so use
        "complete" or "undamaged"
      sound: >-
        = in good condition, as in "a sound argument or a sound structure"; it
        evaluates a judgement rather than reporting that damage did not occur
      safe: >-
        = out of danger, so it answers a question about risk rather than
        condition; "the cargo is safe" says nothing about scratches or broken
        crates
      unharmed: >-
        = used of people, animals and bodies, the frame "unharmed passengers"; for
        goods you say undamaged, and for files you say complete
      unspoilt: >-
        = not spoiled, polluted or ruined by use, the frame "unspoilt countryside,
        an unspoilt meal"; it implies natural quality rather than intact condition
    syn_nuance: >-
      All five mean nothing has been lost or spoiled, but each asks a different
      question. Intact is the neutral summary. Whole and complete concern the
      parts, so they suit cargo and files. Undamaged and unbroken are physical,
      and pristine adds the idea of never having been touched or used.
