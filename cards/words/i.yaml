  - word: imminent
    ipa: /ˈɪm.ɪ.nənt/
    pos: adjective
    tip: im-mi-nent — double m, then 'inent'
    spelling_hint: ""
    definition: About to happen very soon; impending.
    example: The company warned of imminent job losses.
    synonyms:
      - impending
      - approaching
      - looming
      - forthcoming
      - near
    syn_pos: adjective
    syn_example: Warn of imminent / impending / looming changes.
    syn_examples:
      - the: The company warned of imminent job losses.
        syns:
          - impending
          - looming
        avoid:
          near: >-
            = close in space, in time or in relationship, and its frames are "a near
            miss" and "in the near future"; rewritten as "job losses in the near
            future" it works, but near cannot sit before job losses
      - the: An imminent storm forced the evacuation.
        syns:
          - approaching
          - looming
          - forthcoming
        avoid:
          near: >-
            = close in space, in time or in relationship, and it needs a noun after
            it, as in "a near miss"; before storm it means nearby, so a near storm
            points at the place, not at the timing
    syn_notes:
      impending: about to happen (often bad)
      approaching: coming closer
      looming: visibly about to happen, worrying
      forthcoming: about to come
      near: close in time
    syn_near:
      - urgent
      - instant
      - insidious
      - due
    syn_avoid:
      approaching: >-
        = coming closer step by step, and it is neutral, as in "the approaching
        deadline"; job losses a firm has already decided are not drawing near,
        they are about to happen
      forthcoming: >-
        = about to be published, issued or announced, so it suits a report, an
        exam or a wedding; job losses are bad tidings rather than a scheduled
        publication
      impending: >-
        = about to happen and almost always unwelcome, as in "impending disaster";
        a storm that has not yet arrived is neutral news, so use approaching or
        looming
      near: >-
        = close in space, in time or in relationship, and it needs a noun, as in
        "a near miss" or "the near future"; it cannot stand directly before storm
        or job losses
      urgent: >-
        = needing attention now, a quality of a task or a request; it measures
        pressure on you, not how soon an event will happen
      instant: >-
        = happening immediately, the frame of "an instant response or result"; it
        describes the speed of an action rather than an event that is about to
        occur
      insidious: >-
        = working slowly and unseen, so the harm creeps up over months; an
        insidious threat is the opposite of imminent, which means the danger
        arrives now
      due: >-
        = expected or scheduled, the frame of "due on Friday, due to arrive"; it
        fixes a date and carries none of the alarm of an imminent event
    syn_nuance: >-
      All five place an event just ahead of us, but the tone and the topic differ.
      Imminent is neutral and strong, impending is almost always bad, looming adds
      something visible and threatening and often large in scale, and approaching
      and forthcoming are calm, with forthcoming fitting things published or
      announced.
    components:
      - spelling
      - definitions
      - synonyms
