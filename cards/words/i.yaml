  - word: inherent
    ipa: /ɪnˈher.ənt/
    pos: adjective
    tip: in-her-ent — "her" stuck in
    definition: Existing as an essential part of something, which cannot be removed without changing the thing.
    example: There are inherent risks in any investment.
    synonyms:
      - intrinsic
      - built-in
      - inbuilt
      - innate
      - natural
    syn_pos: adjective
    syn_example: Inherent flaws in the design.
    syn_examples:
      - the: Some of the risks are inherent in the design.
        syns:
          - built-in
          - inbuilt
        avoid:
          intrinsic: >-
            = worth that belongs to a thing by itself ("intrinsic value", "intrinsic
            to + noun"); a risk you cannot design out is an inseparable part, so it
            takes "inherent in + noun"
      - the: The delay is inherent in the nature of the problem.
        syns:
          - intrinsic
          - inbuilt
        avoid:
          built-in: >-
            = part of the original make of a machine or product ("built-in
            safeguards"); this delay comes from what the problem is, not from a
            feature someone installed
    syn_notes:
      intrinsic: worth that belongs to the thing itself
      built-in: part of the original design
      inbuilt: built-in, written as one word
      innate: present from birth
      natural: typical, not inseparable
    syn_near:
      - innate
      - integral
      - essential
    syn_avoid:
      natural: >-
        = typical or expected rather than inseparable: "natural risks" reads as the
        usual risks of an investment, not the ones no design can remove
      innate: >-
        = inborn, and English keeps it for people, animals and living things ("an
        innate sense of fear"); risks in a design are built in, not born
      integral: >-
        = necessary to complete something ("integral to the project"): it judges how
        important a part is, not that the part cannot be taken away
      essential: >-
        = absolutely necessary ("it is essential to reply"), so it ranks by importance
        rather than claiming the quality cannot be removed at all
    syn_nuance: >-
      Inherent and intrinsic both mean the quality cannot be taken out of the thing,
      so they overlap whenever the frame allows it; what differs is where each one
      sits. Inherent takes "in" and describes a part you cannot design out — risks,
      flaws, limitations. Intrinsic takes "to" and describes worth that belongs to the
      thing by itself — value, motivation, merit. Built-in and inbuilt are the plainer
      versions of inherent, and innate is the inborn version used for living things.
