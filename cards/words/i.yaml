  - word: interpret
    ipa: /ɪnˈtɜː.prɪt/
    pos: verb
    tip: in-ter-pret — 'ter', then 'pret'
    spelling_hint: ""
    definition: To explain the meaning of something; to translate.
    example: How should we interpret these findings?
    synonyms:
      - explain
      - read
      - decode
      - understand
      - translate
    syn_pos: verb
    syn_example: Interpret / read / explain the data carefully.
    syn_examples:
      - the: How should we interpret these findings?
        syns:
          - explain
          - read
          - understand
        avoid:
          decode: >-
            = to crack a cipher, code or unfamiliar system ("decode the message");
            findings state their meaning openly, so there is no code here to break
          translate: >-
            = to render words from one language into another, so it needs two
            languages; the findings are written in one, and "translate the findings"
            wants a second version in another tongue
      - the: He chose to interpret her silence as agreement.
        syns:
          - read
          - understand
        avoid:
          decode: >-
            = to crack a cipher or code; a silence is not encoded, and the frame
            "read X as Y" draws a meaning out of it rather than breaking anything
            open
          translate: >-
            = to render words from one language into another, so it needs two
            languages; a silence has no words in a second one, and "read X as Y" is
            the frame here
          explain: >-
            = to make something clear by giving reasons, so it needs an audience;
            here he is reading a meaning into her silence, and "explain X as Y" is
            not a frame
      - the: She will interpret the speech for the audience.
        syns:
          - translate
        avoid:
          decode: >-
            = to crack a cipher, code or unfamiliar system; a speech is already in
            plain words, so the frame for a talk rendered for listeners is
            "translate"
          explain: >-
            = to make something clear by giving reasons; "explain the speech for the
            audience" would be clarifying a text, not carrying its meaning across
            live
    syn_notes:
      explain: make clear
      read: derive a meaning
      decode: convert signs into meaning
      understand: grasp the meaning
      translate: convert from one language
    syn_near:
      - comprehend
      - convey
      - construe
      - elucidate
      - judge
    syn_avoid:
      decode: >-
        = to crack an encoded message, cipher or unfamiliar system: fine for a
        code, but findings and a speech carry meaning openly rather than in code
      explain: >-
        = to make something clear to others by giving reasons, so a person
        explains the findings: here the analyst draws meaning out of them instead
        of passing it on
      read: >-
        = to attach a meaning to a sign, as in read her silence as agreement, but
        a speaker does not read a speech, since that is rendering it in another
        language
      translate: >-
        = to render words from one language into another, so it needs two
        languages: right for the conference frame, wrong for findings or a silence
      understand: >-
        = to grasp meaning with no argument made about it, but the analyst does
        not only grasp the findings, he construes them, and a conference does not
        understand a speech
      comprehend: >-
        = a formal alternative to understand, and it works in abstract frames, but
        how should we comprehend these findings is stilted where interpret names
        the act of construing
      convey: >-
        = to carry a meaning from a speaker to a listener, as in the message
        conveys a warning: here the analyst takes meaning out of the findings, the
        other direction
      construe: >-
        = to read a meaning into words in a legal or literary register, as in
        construe an insult: too formal and too narrow for a plain research
        question
      elucidate: >-
        = a formal transitive verb, so you elucidate the findings, never how
        should we elucidate: it means clarifying something for others, not
        construing it
      judge: >-
        = to assess the worth or quality of something, as in judge the evidence:
        these sentences ask for a meaning to be read, not a verdict on quality
    syn_nuance: >-
      All concern meaning, but the direction differs. Interpret works out a
      meaning from findings, a silence or symbols, and it takes interpret as.
      Translate is the two-language sense, decode the cipher sense, and read and
      understand are plainer, less deliberate versions of construing. Explain runs
      the other way, giving reasons to others.
    components:
      - spelling
      - definitions
      - synonyms
