  - word: crucial
    ipa: /ˈkruː.ʃəl/
    pos: adjective
    tip: cru-cial — 'cru', then 'cial'
    spelling_hint: ""
    definition: Extremely important; critical to the success of something.
    example: Timing is crucial to the project.
    synonyms:
      - vital
      - essential
      - critical
      - key
      - necessary
    syn_pos: adjective
    syn_example: It is crucial / vital / essential to plan ahead.
    syn_examples:
      - the: Timing is crucial to the success of the project.
        syns:
          - critical
          - vital
          - essential
          - key
        avoid:
          necessary: >-
            = required, and it belongs with for, as in "necessary for success"; the
            frame here is "is crucial to + noun", where a plain adjective will not
            take necessary to
      - the: It is crucial that we act quickly.
        syns:
          - essential
          - necessary
          - vital
      - the: Trust plays a crucial role here.
        syns:
          - key
          - vital
          - essential
          - critical
        avoid:
          necessary: >-
            = required, and it belongs with for, as in "necessary for success"; the
            frame here is "play a crucial role", so the word would have to stand
            before role, not after to
    syn_notes:
      vital: absolutely needed for success
      essential: indispensable
      critical: decisive, make-or-break
      key: the most important factor
      necessary: needed
    syn_near:
      - important
      - major
      - prime
      - paramount
      - urgent
    syn_avoid:
      critical: >-
        = the decisive, make or break moment, and it wants a following noun, as in
        critical to the project or a critical stage: in the that + clause frame
        use essential, vital or necessary
      key: >-
        = the single most important of several, and it always names the thing it
        labels, as in a key role: it cannot stand alone before that + clause,
        where the noun is missing
      necessary: >-
        = required, and it belongs with to or for, as in necessary for success: it
        will not sit in the frames with to after a plain adjective or before role,
        though it is right in the that + clause
      important: >-
        = plain and of any degree, so it is far weaker: it loses the sense that
        the outcome depends on the timing, and it carries no frame of its own
      major: >-
        = big in size or importance, and it modifies a following noun, as in
        'a major role in'; the frames here are 'crucial to + noun', 'it is
        crucial that ...' and 'a crucial role', none of which it fills
      prime: >-
        = first in importance or the best example, and it lives in set phrases
        such as of prime importance and a prime example: it has no slot in any of
        these three frames
      paramount: >-
        = supreme, and it is usually followed by of with importance or concern, as
        in of paramount importance: the preposition is of, not to, and it will not
        modify role
      urgent: >-
        = needing immediate action, a different sense altogether from deciding the
        outcome: it fits tasks, requests and calls, so none of these three frames
        will take it
    syn_nuance: >-
      Crucial, vital and essential all take a following noun with to, for or in,
      as in timing is crucial to success, and all accept it is crucial that +
      clause. Crucial and critical also modify a noun, as in a crucial stage, and
      take part in, as in plays a crucial role. Key is the most important of
      several, and necessary is only required.
    components:
      - spelling
      - definitions
      - synonyms
