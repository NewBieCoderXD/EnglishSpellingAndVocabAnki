words:
  - word: habitat
    ipa: /ˈhæb.ɪ.tæt/
    pos: noun
    tip: hab-i-tat — "habit" of an animal
    definition: The natural place where a species lives.
    example: The forest is home to many rare habitats.
    synonyms:
      - environment
      - home
      - ecosystem
      - surroundings
    syn_pos: noun
    syn_example: A habitat / environment — the natural home of a species.
    components:
      - spelling
      - definitions
  - word: happy
    ipa: /ˈhæp.i/
    pos: adjective
    tip: hap-py — double p, two syllables
    spelling_hint: ""
    definition: Feeling or showing pleasure or contentment.
    example: The children look happy.
    synonyms:
      - glad
      - pleased
      - delighted
      - content
      - joyful
    syn_pos: adjective
    syn_example: '"Delighted" is stronger than "happy"; "content" is a calmer, lasting happiness.'
    syn_id: happy
    syn_examples:
      - the: I am happy to hear you got the job.
        syns:
          - glad
          - delighted
        avoid:
          joyful: >-
            = full of visible joy, the word for an occasion or a person (a joyful
            celebration); the frame is "happy to + verb", a quiet reaction to news,
            and "I am joyful to hear" is bookish
          pleased: >-
            = satisfied with a result, and "I am pleased to hear you got the job" is
            good English, but it is more formal and more about satisfaction than the
            plain feeling here
      - the: She was very happy with her exam results.
        syns:
          - pleased
          - delighted
          - content
        avoid:
          joyful: >-
            = full of visible joy, the word for an occasion or a person (a joyful
            celebration); the frame is "happy with + noun", a private feeling, and
            "joyful with" is not a pairing English uses
          glad: >-
            = pleased about one piece of news; it takes glad to + verb or glad that,
            and it never takes the preposition with, so very glad with her exam
            results is wrong
      - the: After years of stress, he finally felt happy.
        syns:
          - content
          - joyful
        avoid:
          pleased: >-
            = satisfied with a result, so it wants a with-phrase or a to + -ing
            (pleased with her results); "he finally felt pleased" has nothing to be
            satisfied about, and content fits that calm feeling
          glad: >-
            = pleased about one piece of news, and the frame is "glad to + verb" or
            "glad that + clause"; "he finally felt glad" has no news and no
            that-clause to be glad about, so use content
    syn_notes:
      glad: pleased about something
      pleased: satisfied, happy
      delighted: very happy
      content: calmly satisfied
      joyful: full of joy
    syn_near:
      - satisfied
      - cheerful
      - elated
      - merry
      - overjoyed
    syn_avoid:
      glad: >-
        = pleased about one piece of news; it takes glad to + verb or glad that,
        and it never takes the preposition with, so very glad with her exam
        results is wrong.
      pleased: >-
        = satisfied with a result, so pleased with her exam results works; it is
        good English in I am pleased to hear, but more formal and more about
        satisfaction than about feeling happy.
      content: >-
        = calmly satisfied, and it takes content with; it names a settled, quiet
        state, so it does not fit the warm reaction in I am happy to hear you got
        the job.
      delighted: >-
        = very pleased, and almost always about one specific good event, so it
        needs delighted with or delighted to + verb; the general wellbeing of felt
        happy after years of stress is too broad.
      joyful: >-
        = full of visible joy, and it usually describes an occasion or a person (a
        joyful celebration); it is bookish for I am joyful to hear and wrong for a
        private feeling.
      satisfied: >-
        = content with a result, and it needs satisfied with; it names contentment
        with an outcome, not the general wellbeing of after years of stress, he
        finally felt happy.
      cheerful: >-
        = habitually merry, a lasting trait of a person or a tone (a cheerful
        colleague); it does not describe a private reaction to news or to exam
        results.
      elated: >-
        = extremely happy, usually for a moment and rather literary; far too
        strong for the plain state of very happy with her exam results or of felt
        happy after stress.
      merry: >-
        = festive and jolly, and now literary or confined to set phrases like
        merry Christmas and a merry crowd; it cannot describe one person's private
        feeling.
      overjoyed: >-
        = wild with joy, stronger and more emotional than these frames allow; it
        wants a named cause and is too extreme for happy to hear or happy with a
        result.
    syn_nuance: >-
      All five name a positive feeling, but the frame decides. Glad and delighted
      attach to news (glad to hear, delighted with the result), pleased and
      content take with (pleased with your marks, content with what you have), and
      content and joyful are calm settled states, not reactions, so felt happy
      after stress takes those two.
    components:
      - synonyms
  - word: harmony
    ipa: /ˈhɑː.mə.ni/
    pos: noun
    tip: har-mo-ny — three syllables
