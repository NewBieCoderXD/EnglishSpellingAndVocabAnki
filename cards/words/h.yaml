      - spotlight
    syn_pos: verb
    syn_example: Highlight / emphasize / underline — to draw attention to.
    components:
      - spelling
      - definitions
  - word: holistic
    ipa: /həʊˈlɪs.tɪk/
    pos: adjective
    tip: ho-lis-tic — 'lis', then 'tic'
    spelling_hint: ""
    definition: Considering the whole of something rather than just its parts.
    example: We need a holistic approach to health.
    synonyms:
      - whole
      - comprehensive
      - integrated
      - all-round
      - overall
    syn_pos: adjective
    syn_example: A holistic / integrated / comprehensive approach.
    syn_examples:
      - the: We need a holistic approach to health.
        syns:
          - overall
          - comprehensive
        avoid:
          whole: >-
            = a complete thing in itself, and a count noun, so it cannot follow "a"
            here: the frame is "a holistic approach to health", where you would
            write the whole approach to health, not a whole approach
      - the: The plan adopts holistic measures.
        syns:
          - integrated
          - comprehensive
          - all-round
          - overall
        avoid:
          whole: >-
            = a complete thing in itself, and it stays singular, so the frame "the
            plan adopts holistic measures" wants a plural: write adopts the whole of
            the plan, never adopts whole measures
    syn_notes:
      whole: a complete entity
      comprehensive: covering everything
      integrated: parts joined together
      all-round: covering all aspects
      overall: general, total
    syn_near:
      - systematic
      - total
      - global
      - wholesale
    syn_avoid:
      whole: >-
        = a complete thing in itself, and it is a count noun: "the whole approach"
        is fine, but "a whole approach" or "whole measures" does not work here
      integrated: >-
        = physically or administratively joined into one system, as in an
        integrated network: it fits these measures, but a single approach has
        nothing to be joined to
      all-round: >-
        = good at many different things, a British word for a person ('an
        all-round player'); with a method or approach the usual words are
        comprehensive or integrated
      systematic: >-
        = following a fixed, orderly method, so it is about rigour rather than
        scope: "a systematic approach" is good English but means method, not the
        whole picture
      total: >-
        = the complete amount, and it belongs with numbers ("a total of 200") or
        with failure and collapse: it cannot modify "approach" or "measures"
      global: >-
        = concerning the whole world, as in global warming: in a holistic approach
        to health the scope is the whole person, not the planet
      wholesale: >-
        = sweeping and complete, and it normally modifies a change ("wholesale
        reforms", "wholesale closure"): it says how much is affected, not how many
        aspects are covered
    syn_nuance: >-
      All mean covering the whole subject instead of one part, but the noun after
      the adjective decides. An approach or a view takes holistic, comprehensive
      or overall, and measures or systems that merge fields take integrated.
      All-round is the British word for a person good at many things, and whole is
      a count noun.
    components:
      - spelling
      - definitions
      - synonyms
  - word: hypothesis
    ipa: /haɪˈpɒθ.ə.sɪs/
    pos: noun
    tip: hy-poth-e-sis — 'poth', then 'e-sis'
    spelling_hint: ""
    definition: A proposed explanation based on limited evidence, to be tested.
    example: The results support our hypothesis.
    synonyms:
      - theory
      - premise
      - supposition
      - assumption
      - proposition
    syn_pos: noun
    syn_example: Test a hypothesis / theory / assumption.
    syn_examples:
      - the: The results support our hypothesis.
        syns:
          - theory
          - assumption
          - supposition
          - proposition
      - the: Researchers tested the hypothesis with new data.
        syns:
          - proposition
          - theory
          - supposition
    syn_notes:
      theory: an explanation backed by evidence
      premise: a starting point
      supposition: a tentative case granted for the sake of argument
      assumption: taken for granted
      proposition: a claim put forward for debate
    syn_near:
      - thesis
      - conjecture
      - speculation
      - prediction
      - axiom
    syn_avoid:
      premise: >-
        = a starting point a whole argument rests on, as in the premise of an
        argument: data can support or refute a hypothesis, so 'our premise' is
        never the thing the results back
      assumption: >-
        = something taken for granted without being tested, so it takes "on the
        assumption that": testing settles a hypothesis and leaves an assumption
        standing
      thesis: >-
        = the central claim of a paper, argument or dissertation, argued over many
        pages rather than tested: it is not one testable statement
      conjecture: >-
        = a guess built on very little evidence, and the word itself marks low
        certainty: too weak for "tested the hypothesis with new data"
      speculation: >-
        = open-ended guessing with no evidence behind it, and it takes speculation
        about or over: it reads wrong after "support our" or "tested the"
      prediction: >-
        = what you expect to happen next, so the outcome confirms or fails a
        prediction: a hypothesis explains why something happens and is the one you
        test
      axiom: >-
        = a truth taken as self-evident and never proved, the opposite of a
        hypothesis, which is precisely what evidence tests
    syn_nuance: >-
      All mean a statement put forward, but only some are meant to be tested.
      Hypothesis and theory = an explanation that data can support or refute,
      premise = the starting point a whole argument rests on, assumption =
      something taken for granted to get work done, supposition = a tentative case
      granted for the sake of argument, and proposition = a claim put forward for
      debate, not a suggested plan.
    components:
      - spelling
      - definitions
      - synonyms
