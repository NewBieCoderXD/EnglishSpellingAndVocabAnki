words:
  - word: objective
    ipa: /əbˈdʒek.tɪv/
    pos: noun/adjective
    tip: ob-jec-tive — 'ject', then 'ive'
    spelling_hint: ""
    definition: A goal or aim; also, based on facts rather than feelings.
    example: Our main objective is to cut costs.
    synonyms:
      - goal
      - aim
      - target
      - purpose
      - intention
    syn_pos: noun
    syn_example: Set a clear objective / goal / target.
    syn_examples:
      - the: Our main objective is to cut costs.
        syns:
          - goal
          - aim
          - target
          - purpose
      - the: Set a clear objective before starting.
        syns:
          - goal
          - purpose
          - intention
    syn_notes:
      goal: a desired result
      aim: what one intends
      target: a measurable goal
      purpose: the reason for something
      intention: what one plans to do
    syn_near:
      - mission
      - task
      - milestone
      - ambition
    syn_avoid:
      aim: >-
        = a purpose one sets out to reach, usually with "at" plus a gerund ("an
        aim at reducing costs"); when you fix the destination before starting, the
        noun you want is goal or objective
      intention: >-
        = the private plan in someone's mind, so it wants a person as subject and
        often a gerund ("her intention of leaving"); in "our main objective is to
        cut costs" the aim belongs to a plan, not a person
      target: >-
        = a measurable figure or date to be hit, as in "a sales target of 20%";
        that is the standard word for a number, but "set a clear target before
        starting" asks for the destination, not a quota
      mission: >-
        = a broad assignment given to a person or team, often idealistic ("a
        mission to help the poor"); it overstates a practical end point like
        cutting costs and sounds informal in a plan
      task: >-
        = a piece of work to be carried out, normally with a verb ("a task of
        sorting files"); it names an action, not the state you are working
        towards, so it fails in "set a clear objective"
      milestone: >-
        = a dated checkpoint on a project timeline, as in "a milestone in the
        plan"; it marks progress along the way and can never stand for the end
        point itself
      ambition: >-
        = a long-term personal aspiration, often about status or achievement; too
        grand and self-focused for a clear operational destination like cutting
        costs
    syn_nuance: >-
      All of these name the end being worked towards, but the frame sorts them. An
      objective or goal is a defined destination, an aim takes "at" plus a gerund
      ("an aim at cutting costs"), a target is a number or date to be hit, an
      intention belongs to a person, and a purpose explains why something is done.
    components:
      - spelling
      - definitions
      - synonyms
  - word: obligation
    ipa: /ˌɒb.lɪˈɡeɪ.ʃən/
    pos: noun
    tip: ob-li-ga-tion — "lig" bind
    definition: Something that must be done because of duty or law.
    example: Citizens have a legal obligation to pay taxes.
    synonyms:
      - duty
      - responsibility
      - requirement
    syn_pos: noun
    syn_example: An obligation / duty / responsibility — a required action.
    components:
      - spelling
      - definitions
  - word: obsolete
    ipa: /ˈɒb.sə.liːt/
    pos: adjective
    tip: ob-so-lete — 'so', then 'lete'
    spelling_hint: ""
    definition: No longer used or needed; out of date.
    example: Many skills have become obsolete.
    synonyms:
      - outdated
      - outmoded
      - antiquated
      - archaic
      - superseded
    syn_pos: adjective
    syn_example: Outdated / obsolete / antiquated technology.
    syn_examples:
      - the: Many skills have become obsolete.
        syns:
          - outdated
          - outmoded
          - superseded
      - the: The old equipment is now obsolete.
        syns:
          - superseded
          - antiquated
          - archaic
    syn_notes:
      outdated: old-fashioned
      outmoded: no longer fashionable
      antiquated: old to the point of uselessness
      archaic: belonging to old times
      superseded: replaced by something new
    syn_near:
      - obsolescent
      - defunct
      - dated
      - antique
      - redundant
    syn_avoid:
      antiquated: >-
        = too old to be of any practical use, of methods, laws and ideas; it fits
        the old equipment frame, but skills that have merely been overtaken are
        outmoded, not antiquated
      archaic: >-
        = belonging to the distant past, used of language, spelling and custom, as
        in an archaic spelling; it labels a form that survives, not a skill that
        has been replaced
      outdated: >-
        = behind the times but still usable, the word for views, fashions and
        information; the equipment frame wants a machine that is out of action,
        not merely old
      outmoded: >-
        = no longer fashionable or current, of styles, methods and ideas; for a
        machine the deck wants superseded by a newer model, which points at a
        replacement
      obsolescent: >-
        = about to become obsolete, as in 'an obsolescent system'; it points
        at something still in use for now, whereas the target says put out of
        use entirely
      defunct: >-
        = no longer existing or functioning, the usual register for bodies,
        companies and systems, so defunct equipment is not the natural frame for a
        machine in a report
      dated: >-
        = old-fashioned but still in use, and milder, whereas the target says put
        out of use entirely, so a dated method can still be taught
      antique: >-
        = a collectable object of some age, or belonging to the trade in antiques;
        it names a thing you could own, not a skill that has died out of use
      redundant: >-
        = no longer needed because a person or a new system does the job, as in
        staff made redundant; fine English for jobs and IT systems, but it is a
        workplace term, not a label for skills or equipment
    syn_nuance: >-
      All mean dropped from current use, but the frame sorts them. Outdated and
      outmoded sit with skills, ideas and fashions, superseded needs a newer
      version, as in superseded by X, antiquated judges something too old to be of
      use, and archaic belongs to language, spelling and custom, as in an archaic
      spelling.
    components:
      - spelling
      - definitions
      - synonyms
