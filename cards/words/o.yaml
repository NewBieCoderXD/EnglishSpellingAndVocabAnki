  - word: opportunity
    ipa: /ˌɒp.əˈtjuː.nə.ti/
    pos: noun
    tip: op-<b>por</b>-tu-ni-ty — double <b>p</b>
    spelling_hint: ""
    definition: A favourable time or chance to do something.
    example: Studying abroad was the opportunity of a lifetime.
    synonyms:
      - chance
      - prospect
      - opening
      - possibility
    syn_pos: noun
    syn_example: '"Career opportunities" — prospects / openings fit employment essays.'
    syn_examples:
      - the: Studying abroad was the opportunity of a lifetime.
        syns:
          - chance
        avoid:
          possibility: >-
            = just something that can happen, with no luck in it ("a possibility of
            rain"); a once-in-a-lifetime chance is a rare good opening, not simply
            an outcome
          prospect: >-
            = something likely to happen later, and it likes "the prospect of +
            noun"; studying abroad here is already over and was the chance itself,
            not a future likelihood
      - the: The internet creates new opportunities for small businesses.
        syns:
          - prospect
          - chance
        types:
          - prospects
          - possibilities
          - chances
        avoid:
          possibility: >-
            = only an outcome, with nothing there to take up; "creates new X for
            small businesses" points at openings a firm can act on, so this frame
            wants the chance sense, not a bare outcome
      - the: She was given the opportunity to lead the project.
        syns:
          - chance
        avoid:
          possibility: >-
            = it names an outcome, and it prefers "the possibility of + -ing"; she
            was handed something she can use, so "the possibility to lead the
            project" is not the frame
          prospect: >-
            = a future likelihood that wants "of" ("the prospect of leading the
            project"); she has already been given it, so nothing is left ahead to
            look forward to
    syn_notes:
      chance: a favourable possibility
      prospect: a likely future opportunity
      opening: an available position or gap
      possibility: something that can happen
    syn_near:
      - occasion
      - window
      - option
      - break
      - privilege
    syn_avoid:
      possibility: >-
        = simply something that can happen, with no luck or favour in it ("a
        possibility of rain"); fine as a plural in "new possibilities", but a
        once-in-a-lifetime opening is not just an outcome
      prospect: >-
        = something likely to happen later, normally a plural ("job prospects", "the
        prospect of a rise"); it looks forward, so it cannot report an opening
        already handed to someone
      opening: >-
        = a vacant post, a gap in a diary or a slot for entry ("an opening in the
        team", "job openings"); it names a post, not a chance, and needs in / at
        / for
      occasion: >-
        = a particular time when an event happens ("on this occasion", "a formal
        occasion"); it dates an event rather than naming a favourable opening, and
        "the occasion of a lifetime" is a different idiom
      window: >-
        = it only works inside the fixed phrase "a window of opportunity"; on its
        own a window is glass or a gap in a wall, and the bare noun cannot fill
        "the ___ of a lifetime"
      option: >-
        = one choice from a list ("a cheaper option"); it is neutral, with no luck
        or favour involved, so it drops the sense of a good chance worth taking up
      break: >-
        = a lucky opening in a career, informal ("she got her big break"); the
        tone is journalistic and vague, and the phrase does not combine with "of a
        lifetime"
      privilege: >-
        = an honour or an advantage others do not get ("a privilege to work
        here"); it praises a social or moral advantage, which is not the same as a
        practical opening that came along
    syn_nuance: >-
      All name a chance that something good can happen, but chance adds luck,
      possibility is neutral and often plural ("new possibilities"), and prospect
      looks forward to what is likely ("job prospects"). Opportunity is the
      neutral one and the only member that takes "of a lifetime" or "an ___ to +
      verb"; opening needs "an opening in / at".
    components:
      - spelling
      - definitions
      - synonyms
