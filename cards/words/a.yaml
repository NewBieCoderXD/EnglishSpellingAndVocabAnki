  - word: alter
    ipa: /ˈɒl.tər/
    pos: verb
    tip: al-ter — one l
    definition: To change or make a change to something.
    example: The noise forced them to alter their plans.
    synonyms:
      - change
      - modify
      - adjust
    syn_pos: verb
    syn_example: Alter / modify / adjust — to make a change.
    components:
      - spelling
      - definitions
  - word: alternative
    ipa: /ɔːlˈtɜː.nə.tɪv/
    pos: adjective/noun
    tip: alt-ern-ative — keep the 'ern' in the middle
    spelling_hint: ""
    definition: One of two or more available possibilities; a different option.
    example: We considered an alternative plan.
    synonyms:
      - option
      - choice
      - substitute
      - fallback
    syn_pos: noun
    syn_example: Offer an alternative or an option when presenting solutions in an essay.
    syn_examples:
      - the: We need an alternative to the current plan.
        syns:
          - option
          - choice
          - substitute
          - fallback
      - the: They proposed a cheaper alternative.
        syns:
          - option
          - choice
          - substitute
    syn_notes:
      option: one among several selections
      choice: the result of deciding
      substitute: a replacement that takes the place
      fallback: a second-best backup plan
    syn_near:
      - replacement
      - rival
      - variant
      - equivalent
    syn_avoid:
      fallback: >-
        = the reserve you switch to when the first choice breaks down, as in 'a
        fallback option'; a cheaper candidate here is a plan on the table, not a
        breakdown plan
      replacement: >-
        = the item that takes the place of a used or missing one, like a spare
        tyre; an alternative is chosen from options, not worn out first
      rival: >-
        = a competitor trying to beat another, and it takes a firm or product
        after it, as in 'a cheaper rival'; a proposal is not a competitor
      variant: >-
        = a slightly different form of the same item, such as another size or
        model; an alternative is a different course of action, not a variant of
        one thing
      equivalent: >-
        = something equal in value or function, as in 'no equivalent word exists';
        it matches one thing against another, not one plan against a current one
    syn_nuance: >-
      All of these are a second course of action, but the pattern is 'an
      alternative to + noun' and 'a cheaper alternative': option and choice are
      neutral members of a list, substitute needs 'a substitute for + noun' and
      stands in for something, while fallback only names the plan you turn to once
      the first choice fails.
    components:
      - spelling
      - definitions
      - synonyms
  - word: ambiguous
    ipa: /æmˈbɪɡ.ju.əs/
    pos: adjective
    tip: am-bi-gu-ous — 'igu', then 'ous'
    spelling_hint: ""
    definition: Open to more than one interpretation; unclear in meaning.
    example: The wording was highly ambiguous.
    synonyms:
      - unclear
      - vague
      - equivocal
      - uncertain
      - indistinct
    syn_pos: adjective
    syn_example: Ambiguous / vague / unclear instructions.
    syn_examples:
      - the: The wording was highly ambiguous.
        syns:
          - unclear
          - vague
          - equivocal
        avoid:
          indistinct: >-
            = hard to see or hear, the word for outlines, shapes and sounds (an
            indistinct shape); the frame is "the wording was highly + ADJ", about
            meaning, and text is not something you look at
      - the: Her reply was deliberately ambiguous.
        syns:
          - equivocal
          - unclear
          - uncertain
        avoid:
          indistinct: >-
            = hard to see or hear, the word for outlines and sounds (an indistinct
            voice); the frame is "her reply was deliberately + ADJ", about the
            meaning she chose, not about how clearly she could be heard
    syn_notes:
      unclear: not clear
      vague: not specific
      equivocal: deliberately double-meaning
      uncertain: not known for sure
      indistinct: hard to see or hear
    syn_near:
      - ambivalent
      - duplicitous
      - ambiguity
    syn_avoid:
      indistinct: >-
        = hard to see or hear, a word for shapes, sounds and outlines: a word is
        either clear or not, and ambiguity is about meaning, not visibility
      uncertain: >-
        = not knowing for sure, a state of a person: it fits "I am uncertain" but
        not "wording", and a deliberate reply is a choice rather than doubt
      vague: >-
        = too general to be precise, the opposite problem to ambiguity: "highly
        vague" is fine, but a reply is ambiguous when two clear meanings are left
        open
      ambivalent: >-
        = holding two opposite feelings at once, a word for people ("she felt
        ambivalent about it"): a reply can be read two ways without its speaker
        being torn
      duplicitous: >-
        = deceitfully two-faced, which accuses the speaker of lying: a moral
        charge that ambiguous, which only describes the text, never makes
      ambiguity: >-
        = the noun form, and the frames here need the adjective after "was highly"
        or before a noun such as "an ambiguous reply"
    syn_nuance: >-
      All of these mean that one clear message does not come through, but the
      object decides which. A word or a rule takes ambiguous, unclear or
      equivocal, with equivocal adding a deliberate choice by a speaker. Vague
      means the opposite problem, lack of detail; indistinct is for shapes, and
      uncertain is for a person in doubt.
    components:
      - spelling
      - definitions
      - synonyms
  - word: ample
    ipa: /ˈæm.pəl/
