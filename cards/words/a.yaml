  - word: accurate
    ipa: /ˈæk.jər.ət/
    pos: adjective
    tip: ac-cu-rate — double c, then 'cu-rate'
    spelling_hint: ""
    definition: Correct in all details; exact and free from error.
    example: The figures were accurate.
    synonyms:
      - exact
      - precise
      - correct
      - faithful
      - "true"
    syn_pos: adjective
    syn_example: An accurate / precise / exact measurement.
    syn_examples:
      - the: The figures were accurate.
        syns:
          - exact
          - precise
          - correct
        avoid:
          "true": >-
            = factually right, and it works best with a that-clause or "true to +
            noun"; "the figures were true" is possible English, but exact or correct
            is the natural predicate for a check on data
      - the: She gave accurate details of the events.
        syns:
          - faithful
          - correct
          - precise
        avoid:
          "true": >-
            = factually right, and it works best with a that-clause or "true to +
            noun"; as an adjective before a bare noun it wants a count noun, so true
            details of the events is not idiomatic
    syn_notes:
      exact: exactly right
      precise: detailed and exact
      correct: without error
      faithful: true to the original
      "true": factually correct
    syn_near:
      - sound
      - reliable
      - valid
      - right
    syn_avoid:
      exact: >-
        = exactly right down to the last figure, which suits "the figures were
        exact"; for "accurate details of the events" it suggests a word-for-word
        copy rather than a clear account
      faithful: >-
        = true to an original, so it needs "a faithful copy, translation or
        summary"; the figures are data rather than a rendering, though "a faithful
        account of the events" is natural
      "true": >-
        = factually right, and it works best with a that-clause or "true to +
        noun"; as a bare adjective before figures or details it is clumsy
      sound: >-
        = in good condition, as in "a sound argument or a sound structure"; it
        evaluates a judgement rather than measuring a figure
      reliable: >-
        = dependable over time, the frame of "a reliable source or method"; a
        one-off figure can be accurate or wrong, but calling it reliable asks a
        different question
      valid: >-
        = legally or logically acceptable, the frame of "a valid argument, claim
        or permit"; it judges standing, not the correctness of a number
      right: >-
        = correct in everyday speech, as in "the right answer"; it is too informal
        for a technical or academic context such as a data report
    syn_nuance: >-
      All five mean free from error but they grade it: accurate and correct = no
      mistakes, exact = right to the last figure, precise = fine-grained detail,
      faithful = true to an original or a retelling, true = factually so, wanting
      a that-clause or "true to". Use exact for numbers, faithful for a version or
      translation.
    components:
      - spelling
      - definitions
      - synonyms
  - word: achieve
    ipa: /əˈtʃiːv/
    pos: verb
    tip: a-chieve — the common 'ie' after c is the trap
    spelling_hint: ""
    definition: To successfully reach a desired aim or result by effort.
    example: She worked hard to achieve her goals.
    synonyms:
      - attain
      - accomplish
      - reach
      - realize
      - fulfil
    syn_pos: verb
    syn_example: Achieve / attain / reach your goals — all are formal IELTS verbs.
    syn_examples:
      - the: She worked hard to achieve her goals.
        syns:
          - accomplish
          - attain
          - reach
          - realize
          - fulfil
      - the: The team managed to achieve the performance target.
        syns:
          - reach
          - attain
          - accomplish
      - the: He hoped to achieve his ambition of living abroad.
        syns:
          - realize
          - fulfil
    syn_notes:
      attain: by age, status, or position
      accomplish: by effort and completion
      reach: by progress toward a target
      realize: by making a long-held dream real
      fulfil: by satisfying an ambition or promise
    syn_near:
      - acquire
      - obtain
      - secure
      - execute
    syn_avoid:
      realize: >-
        = make a long-held dream real; it does not take a measurable target, and
        in US English it also means to become aware of something
      fulfil: >-
        = satisfy a promise, a role or a potential; the target here is a measured
        figure nobody promised, so the frame points elsewhere
      attain: >-
        = arrive at a level by age, status or slow progress; fine with a target,
        but the deck gives this lifelong-ambition frame to realize and fulfil
      accomplish: >-
        = finish a task that has actually been carried out; it fits a goal, though
        the deck reserves it for completed effort, not for a wish to live abroad
      reach: >-
        = get to a point by moving toward it step by step; natural with targets,
        but 'reach his ambition of living abroad' fights the sense of progress
      acquire: >-
        = get something you did not previously have, like a skill or a degree;
        goals are reached, not picked up, so the verb is wrong here
      obtain: >-
        = get a document, a permit or a post by asking for it; it takes something
        you can apply for, never a goal or a target
      secure: >-
        = lock in a job, a contract or a grant against rivals; a firm is offered a
        job, it does not secure one, so the collocation fails
      execute: >-
        = carry out a plan, a contract or an order; an ambition is achieved
        rather than carried out, and 'execute a goal' is not idiomatic English
    syn_nuance: >-
      All of these name reaching an intended result, but the object decides which
      is idiomatic: accomplish is a task finished by effort, attain is a level
      reached with time, reach is a target approached step by step, realize is a
      dream made real, fulfil is a promise satisfied. Only reach, attain and
      accomplish collocate with a measured target.
    components:
