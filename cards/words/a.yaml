  - word: analysis
    ipa: /əˈnæl.ə.sɪs/
    pos: noun
    tip: ana-lysis — note "sis" at the end
    definition: A careful examination of something to understand it.
    example: The analysis of the data took several weeks.
    synonyms:
      - examination
      - study
      - investigation
    syn_pos: noun
    syn_example: An analysis / study — a careful examination of data.
    components:
      - spelling
      - definitions
  - word: analyze
    ipa: /ˈæn.əl.aɪz/
    pos: verb
    tip: an-a-lyze — 'a-na-ly-ze', three syllables
    spelling_hint: ""
    definition: To examine something in detail in order to understand or explain it.
    example: We analyzed the data carefully.
    synonyms:
      - examine
      - inspect
      - study
      - evaluate
      - investigate
    syn_pos: verb
    syn_example: Analyze, examine or investigate a problem in your task 2 body.
    syn_examples:
      - the: We need to analyze the data before deciding.
        syns:
          - examine
          - inspect
          - study
          - evaluate
          - investigate
      - the: The report is designed to analyze the causes of the problem.
        syns:
          - study
          - investigate
          - examine
    syn_notes:
      examine: look closely at
      inspect: check for faults in detail
      study: examine in depth over time
      evaluate: judge value or worth
      investigate: probe systematically for facts or causes
    syn_near:
      - assess
      - review
      - interpret
      - diagnose
      - compare
    syn_avoid:
      evaluate: >-
        = judge the value or worth of something and pass a verdict on it; causes
        are looked into rather than rated, so keep it for 'evaluate the impact'
      inspect: >-
        = check a physical object or site closely for faults; it fits 'inspect the
        equipment' but not the abstract 'causes of the problem'
      assess: >-
        = judge how good, bad or costly something is; it answers a question of
        quality, while analyze takes a whole apart to see what is in it
      review: >-
        = look over again once it exists, as in a review meeting or an annual
        review; the deck wants a first look at data and at causes
      interpret: >-
        = give a meaning to something already grasped; analysis has to come first,
        so 'interpret the causes' puts the steps in the wrong order
      diagnose: >-
        = find the fault in a patient or a machine and name it; a report studies a
        whole field of causes, it does not diagnose them one by one
      compare: >-
        = set two items side by side to see the difference; nothing in the
        sentence invites a contrast, and the frame has no second term to set
        against the first
    syn_nuance: >-
      All of these mean looking at something carefully, but the object sets the
