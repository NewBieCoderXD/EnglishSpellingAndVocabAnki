      - definitions
  - word: endorse
    ipa: /ɪnˈdɔːs/
    pos: verb
    tip: en-dorse — "dors" back
    definition: To publicly approve or support a person, plan or product.
    example: The committee endorsed the new proposal.
    synonyms:
      - approve
      - support
      - back
      - sanction
    syn_pos: verb
    syn_example: Endorse / back / support — to approve publicly.
    components:
      - spelling
      - definitions
  - word: enforce
    ipa: /ɪnˈfɔːs/
    pos: verb
    tip: en-force — "force" make it happen
    definition: To make people obey a rule or law.
    example: The new law is hard to enforce.
    synonyms:
      - implement
      - apply
      - impose
      - uphold
    syn_pos: verb
    syn_example: Enforce / impose / uphold — to make rules apply.
    components:
      - spelling
      - definitions
  - word: enhance
    ipa: /ɪnˈhɑːns/
    pos: verb
    tip: en-hance — the 'h' is part of the word
    spelling_hint: ""
    definition: To improve the quality, value or extent of something.
    example: Technology can enhance the learning experience.
    synonyms:
      - improve
      - boost
      - strengthen
      - augment
      - heighten
    syn_pos: verb
    syn_example: Enhance / boost / improve performance at work.
    syn_examples:
      - the: Technology can enhance the learning experience.
        syns:
          - improve
          - boost
          - heighten
          - strengthen
      - the: The new feature aims to enhance productivity.
        syns:
          - boost
          - augment
          - heighten
          - improve
          - strengthen
    syn_notes:
      improve: make better
      boost: raise quickly
      strengthen: make stronger
      augment: increase in size or quantity
      heighten: make more intense
    syn_near:
      - increase
      - intensify
      - expand
      - enlarge
      - maximize
    syn_avoid:
      augment: >-
        = add to the size or number of a thing: it fits "augment productivity",
        where output grows, but "augment the learning experience" sounds like
        adding items to an experience
      increase: >-
        = a plain rise in a number or amount: too weak for "enhance the learning
        experience", which is about a better quality
      intensify: >-
        = to make something already forceful stronger, as in "intensify the heat":
        sound English, but it wants a force or a degree, not a neutral experience
      expand: >-
        = to widen the size or scope, as in "expand the business": it adds
        coverage, whereas enhance adds quality
      enlarge: >-
        = to make physically bigger, usual of photos and buildings: a change of
        size, with none of the sense of a better quality
      maximize: >-
        = to push something up to its maximum, common in US business English: far
        too strong for a feature designed to improve rather than to perfect
    syn_nuance: >-
      Improve and enhance are the neutral pair, and enhance is the more formal of
      the two; it suits abstract qualities such as reputation or the learning
      experience. Boost, strengthen and heighten each pick a scale, a structure or
      an intensity, and augment counts extra units, which fits productivity but
      not experience.
    components:
      - spelling
      - definitions
      - synonyms
  - word: entrepreneur
    ipa: /ˌɒn.trə.prəˈnɜːr/
    pos: noun
    tip: en-tre-pre-<b>neur</b> — the French-style ending is the tricky part
    spelling_hint: ""
    definition: A person who starts and runs a business, taking financial risks in the hope of profit.
    example: The young entrepreneur launched a successful app.
    synonyms:
      - businessperson
      - founder
      - innovator
      - pioneer
    syn_pos: noun
    syn_example: '"Budding entrepreneur" — founder / businessperson are the concrete IELTS words.'
    syn_examples:
      - the: The young entrepreneur launched a successful app.
        syns:
          - founder
          - innovator
          - pioneer
      - the: The programme gives every entrepreneur free business advice.
        syns:
          - businessperson
          - founder
      - the: It takes courage to become a successful entrepreneur.
        syns:
          - pioneer
          - businessperson
          - innovator
    syn_notes:
      businessperson: someone in business
      founder: started a company
      innovator: introduces new ideas
      pioneer: one of the first in a field
    syn_near:
      - businessman
      - freelancer
      - risk-taker
      - tycoon
      - entrepreneurial
    syn_avoid:
      businessperson: >-
        = anyone in business, including a salaried manager with no venture of
        their own; it is fine in "gives every entrepreneur free business advice"
        but loses the risk in "launched an app"
      founder: >-
        = the person who started the firm, so "it takes courage to become a
        successful founder" fails: an inherited chairmanship is not a foundation
      innovator: >-
        = someone who introduces a new method, and it needs a field or a practice,
        as in "a medical innovator", so it is rejected when advice goes to "every
        entrepreneur"
      pioneer: >-
        = the first person in a field, so late entrants named in a support
        programme are not pioneers; the word also belongs to exploration, sport
        and New World settlement
      businessman: >-
        = a gendered label that many style guides now avoid, and it also
        covers salaried managers; the sentence wants the neutral term for
        someone who starts or runs a business
      freelancer: >-
        = someone paid job by job, often working inside somebody else's company,
        whereas an entrepreneur usually owns the venture and risks their own money
        in it
      risk-taker: >-
        = a general description of bold behaviour rather than a job title, so
        "become a successful risk-taker" is loose where entrepreneur names an
        occupational role
      tycoon: >-
        = a very rich, powerful business figure, far more intense than
        entrepreneur, which covers everyone from a market trader to a small shop
        owner
      entrepreneurial: >-
        = the adjective, as in "an entrepreneurial spirit" or "an entrepreneurial
        culture"; the card needs a count noun for a person, and the slot already
        ends the sentence
    syn_nuance: >-
      All can describe someone who builds a business, but the frame sorts them:
      entrepreneur = the person who takes the financial risk, founder = the person
      who started the firm rather than inherited it, businessperson is the neutral
      gender-neutral term, and innovator and pioneer add novelty or being first.
    components:
      - spelling
      - definitions
      - synonyms
  - word: environment
    ipa: /ɪnˈvaɪ.rən.mənt/
    pos: noun
    tip: en-vi-<b>ron</b>-ment — keep the "r" after the "n"
    spelling_hint: ""
    definition: The natural world, or the surroundings and conditions in which someone or something lives.
    example: We must protect the environment for future generations.
    synonyms:
      - surroundings
      - ecosystem
      - habitat
      - setting
    syn_pos: noun
    syn_example: '"Protecting the environment" — habitat / ecosystem for nature essays, surroundings for people.'
    syn_examples:
      - the: We must protect the environment for future generations.
        syns:
          - ecosystem
          - surroundings
        avoid:
          habitat: >-
            = the natural home of a species or group, so it needs a creature
            attached, as in "a protected habitat"; nothing is named here, so
            "protect the habitat" has no referent
          setting: >-
            = the scene or context where something happens, as in "a rural setting"
            or "a calm learning setting"; "protect the setting" narrows it to a film
            or stage scene and loses the whole surroundings
      - the: Children learn best in a calm learning environment.
        syns:
          - surroundings
          - setting
        avoid:
          habitat: >-
            = the natural home of a species or group, so "a learning habitat" is a
            specialist early-years term; ordinary English here is "a calm learning
            environment" or "setting"
      - the: Coral reefs form a fragile marine environment.
        syns:
          - habitat
          - ecosystem
        avoid:
          setting: >-
            = the scene or context, standard for films, novels and locations; "a
            fragile marine setting" sounds like a painted backdrop, while the reefs
            are the living habitat itself
    syn_notes:
      surroundings: the things around you
      ecosystem: a community of living things
      habitat: the natural home of a species
      setting: a scene or context
    syn_near:
      - environmental
      - ambience
      - milieu
      - context
      - nature
    syn_avoid:
      surroundings: >-
        = the physical area and objects around a person, fine for "a calm learning
        environment" but not for coral reefs, where a whole living system is meant
        rather than what stands nearby
      ecosystem: >-
        = a community of living things plus the physical conditions around them,
        so "marine environment" reads oddly; the natural frames are "a fragile
        ecosystem" or "marine ecosystems"
      habitat: >-
        = the natural home of a species or group, so it is rejected in "protect
        the environment for future generations"; in early-years education "a
        learning habitat" is a specialist use
      setting: >-
        = the scene or context in which something happens, as in "a calm learning
        setting" or "a rural setting"; "protect the setting" and "marine setting"
        miss the wider sense
      environmental: >-
        = the adjective, as in "environmental protection" or "environmental
        conditions"; the sentence here needs the noun that can follow the definite
        article after protect
      ambience: >-
        = the mood or atmosphere of a place, felt rather than built up, so it can
        stand for "a calm learning environment" but never for coral reefs or the
        natural world
      milieu: >-
        = the social or cultural setting a person moves in, a word of sociology
        and arts criticism, far too narrow for a marine system or a stretch of
        countryside
      context: >-
        = the circumstances and background that give something meaning, abstract
        and countable, and it has no room for a physical or biological system
      nature: >-
        = the physical world with its plants and animals, the opposite of nurture;
        "protect nature" is good English, but the card wants the single countable
        noun
    syn_nuance: >-
      Environment is the broadest term, covering natural, social and learning
      contexts. Surroundings is the physical area around you, setting the scene in
      which something happens, ecosystem a community of living things plus its
      conditions, and habitat the natural home of a species, which is why it takes
      marine and wildlife contexts.
    components:
      - spelling
      - definitions
      - synonyms
  - word: equivocal
    ipa: /ɪˈkwɪv.ə.kəl/
    pos: adjective
    tip: equi-vocal — "equal" voices
    definition: Deliberately unclear and having more than one possible meaning.
    example: The minister gave an equivocal answer.
    synonyms:
      - ambiguous
      - vague
      - unclear
      - evasive
    syn_pos: adjective
    syn_example: Equivocal / ambiguous — with more than one possible meaning.
    components:
      - spelling
      - definitions
  - word: escalate
    ipa: /ˈes.kə.leɪt/
    pos: verb
    tip: es-ca-late — "escalator" goes up
    definition: To increase or become worse quickly in degree or intensity.
    example: The dispute quickly escalated into violence.
    synonyms:
      - intensify
      - increase
      - grow
      - mount
    syn_pos: verb
    syn_example: Escalate / intensify — to rise sharply, often for the worse.
    components:
      - spelling
      - definitions
  - word: essential
    ipa: /ɪˈsen.ʃəl/
    pos: adjective
    tip: es-sen-tial — double s, then 'en'
    spelling_hint: ""
    definition: Absolutely necessary; extremely important.
    example: Water is essential for life.
    synonyms:
      - vital
      - crucial
      - indispensable
      - necessary
      - required
    syn_pos: adjective
    syn_example: Essential / vital / indispensable skills for study.
    syn_examples:
      - the: Water is essential for life.
        syns:
          - vital
          - crucial
          - necessary
      - the: Good communication is an essential part of teamwork.
        syns:
          - indispensable
          - required
          - vital
          - necessary
    syn_notes:
      vital: needed for life
      crucial: make-or-break
      indispensable: cannot do without
      necessary: needed
      required: demanded by rules
    syn_near:
      - main
      - critical
      - pivotal
      - prime
      - compulsory
    syn_avoid:
      crucial: >-
        = make-or-break, so the outcome turns on it: a stronger and more dramatic
        word than the neutral "an essential part of teamwork", though fine in
        "crucial to the project"
      indispensable: >-
        = you cannot do without it, usual of a person, a tool or a quality: it
        fits "an indispensable part of teamwork", but with water and life it makes
        an absolute claim the sentence does not need
      required: >-
        = demanded by a rule, a contract or an employer: the frames here are
        natural necessity, as in "essential for life", and belonging, as in "an
        essential part of", not external demand
      main: >-
        = the chief or most important one, whose frame is "the main + noun": "the
        main part" is right, but it clashes with the article in "an ___ part of",
        and "main to any relationship" is not English
      critical: >-
        = of the greatest importance, as in 'a critical part' or 'critical to
        success'; it is stronger than the plain necessity these frames ask
        for, and 'critical for life' is not its frame
      pivotal: >-
        = acting as the turning point of a process: "a pivotal part" is good
        English elsewhere, but it points at a decisive moment, not at what simply
        cannot be missing
      prime: >-
        = first in importance, or the best of its kind, as in a prime example; it
        ranks rather than naming what is simply necessary, so "a prime part of
        teamwork" claims top billing
      compulsory: >-
        = required by a rule, a contract or the law: nobody compels you to drink
        water, and a team does not make communication compulsory
    syn_nuance: >-
      All five say nothing can be done without them, but the frame sets the
      register. Vital and indispensable carry life or total dependency, crucial
      pushes the stakes to make-or-break, and necessary and required stay neutral,
      with required imposed by a rule. Only essential and necessary pass both X is
      ___ for life and an ___ part of.
    components:
      - spelling
      - definitions
      - synonyms
  - word: establish
    ipa: /ɪˈstæb.lɪʃ/
    pos: verb
    tip: es-tab-lish — 'tab', then 'lish'
    spelling_hint: ""
    definition: To start or set up something lasting; to prove or confirm.
    example: The company was established in 1990.
    synonyms:
      - set up
      - found
      - create
      - institute
      - launch
      - prove
      - confirm
    syn_pos: verb
    syn_example: Establish / set up / found an organization.
    syn_examples:
      - the: They plan to establish a new company.
        syns:
          - set up
          - found
          - create
          - launch
        avoid:
          confirm: >-
            = to state or check that a doubt is settled, so it needs something
            already believed; a new company does not exist yet, and no doubt is
            being settled. It is accepted for the finding
          institute: >-
            = to put a rule or a system into force, and it takes a policy or a
            procedure; a company is an organisation to be built, not a rule in
            force. It is accepted for clear rules
          prove: >-
            = to show that a claim is true, so its object is a claim, as in "prove
            that the company is viable"; a company is founded, not proved. It is
            accepted for the cause
      - the: We need to establish clear rules.
        syns:
          - institute
          - set up
          - create
        avoid:
          confirm: >-
            = to check that something already believed is true, so it needs a prior
            claim; the rules do not exist yet, so the frame is "set up" or
            "institute". It is accepted for the finding
          prove: >-
            = to show that a claim is true; rules are drafted here, not tested, so
            "prove clear rules" is not a frame you use. It is accepted for the cause
          found: >-
            = to create an institution and put it on a lasting footing; clear rules
            are drawn up, and a rule is not an institution, so the frame is "set up"
            or "institute"
          launch: >-
            = to start with publicity and energy, usual of a product, a campaign or
            a ship; drawing up clear rules is quiet work, so "launch rules" is too
            showy. It is right for a company
      - the: The study failed to establish a clear cause.
        syns:
          - prove
          - confirm
        avoid:
          institute: >-
            = to put a rule or a system into force, so it takes a policy or a
            procedure; nobody institutes a cause, and this frame is "prove a cause"
            or "confirm a cause"
          found: >-
            = to create an institution and put it on a lasting footing; a cause is
            not an institution, and this sentence is about evidence, not about
            founding anything
          launch: >-
            = to start with publicity and energy, of a product or a campaign; a
            cause is neither launched nor founded, it is proved or confirmed. It is
            right for a new company
    syn_notes:
      set up: arrange or organize
      found: create an institution
      create: make new
      institute: introduce a system or rule
      launch: start in a big way
      prove: show to be true
      confirm: verify something
    syn_near:
      - initiate
      - demonstrate
      - verify
      - determine
      - construct
    syn_avoid:
      set up: >-
        = arrange or organize, usual of a company, a meeting or a system: it is
        the everyday match for "establish a new company", but a cause is found,
        not arranged
      found: >-
        = create an institution and put it on a lasting footing: it fits "found a
        new company", but it does not govern draft rules and it has nothing to do
        with evidence
      create: >-
        = to make something new that did not exist before: right for a company or
        a set of rules, but a cause is discovered rather than created
      institute: >-
        = put a rule or a system into force, and it takes a policy, a procedure or
        a practice: it cannot start a company, and nobody institutes a cause
      launch: >-
        = to start with publicity and energy, usual of a product, a campaign or a
        ship: too showy for drawing up clear rules, and impossible for a cause
      prove: >-
        = show that something is true, and the frame is "prove that ..." or "prove
        a claim": it fits the study, but a company or a set of rules cannot be
        proved
      confirm: >-
        = state or check that a doubt is settled, so it needs something already
        reported or believed: it matches the study's finding, but not setting up a
        company or drawing up rules
      initiate: >-
        = to start a process, as in "initiate talks": standard with an activity,
        but "initiate a new company" would mean opening an application, and
        "initiate clear rules" reverses the sense
      demonstrate: >-
        = to show clearly by example or evidence, and the frame is "demonstrate
        that ...": it fits the study, but it cannot start a company or draw up
        rules
      verify: >-
        = to check that something is true, and it needs a concrete claim: "verify
        a cause" is right, but it can neither set up a company nor institute rules
      determine: >-
        = to find out or to decide, which is the frame for the study: "failed to
        determine a cause" is correct, but it cannot create a company or put rules
        in force
      construct: >-
        = to build a physical or abstract thing, as in "construct an argument":
        "construct a new company" and "construct clear rules" are not idiomatic
    syn_nuance: >-
      Establish splits into two senses. With people and bodies it means bring into
      lasting existence, so set up, found, create and launch work, with found for
      a charity and launch for a public product. With facts it means settle by
      evidence, so prove and confirm work, while institute means put a rule into
      force.
