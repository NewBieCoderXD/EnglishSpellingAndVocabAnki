  - word: evident
    ipa: /ˈev.ɪ.dənt/
    pos: adjective
    tip: e-vi-dent — 'vi', then 'dent'
    spelling_hint: ""
    definition: Clearly seen or understood; obvious.
    example: It was evident that she was tired.
    synonyms:
      - obvious
      - apparent
      - clear
      - plain
      - noticeable
    syn_pos: adjective
    syn_example: It was evident / apparent / obvious from the data.
    syn_examples:
      - the: It was evident that she was tired.
        syns:
          - obvious
          - apparent
          - clear
          - plain
      - the: The improvement was evident in the latest figures.
        syns:
          - noticeable
          - plain
          - clear
          - apparent
    syn_notes:
      obvious: impossible to miss
      apparent: clearly visible
      clear: free from doubt
      plain: obviously simple to see
      noticeable: attracting attention
    syn_near:
      - visible
      - manifest
      - conspicuous
      - undeniable
      - transparent
    syn_avoid:
      noticeable: >-
        = large enough to catch the eye, and it modifies a thing such as "a
        noticeable improvement": it does not take the clause frame "it was
        noticeable that ..."
      obvious: >-
        = impossible to miss, the loudest word in this family: it clashes with the
        measured claim in "the improvement was obvious in the latest figures",
        which only says the change shows
      visible: >-
        = able to be seen, a physical and visual word: it modifies a thing, as in
        "visible in the figures", and it will not carry "it was visible that ..."
      manifest: >-
        = plainly visible, in a formal or literary register, as in 'it was
        manifest that she was tired'; that is correct English, but too formal
        for this neutral sentence, where evident is plainer
      conspicuous: >-
        = very noticeable because it is deliberately unusual, as in "a conspicuous
        absence": the figures here show a change, not something put on display
      undeniable: >-
        = impossible to deny, an absolute: it suits a moral or legal claim, but
        "the improvement was undeniable in the figures" overstates what the data
        can support
      transparent: >-
        = see-through, or open and easy to inspect: right for "a transparent
        process", but a tired person is not transparent, so it reads oddly after
        "it was"
    syn_nuance: >-
      All five describe something a reader can see for themselves, but they differ
      in volume. Clear, plain and apparent stay quiet and suit a clause, obvious
      announces that nothing could be missed, and noticeable points to the size of
      a change, as in "a noticeable improvement in the figures".
