words:
  - word: ecosystem
    ipa: /ˈiː.kəʊˌsɪs.təm/
    pos: noun
    tip: eco-system — a "system" of the environment
    definition: All the living things in an area and their environment together.
    example: Pollution threatens the fragile coastal ecosystem.
    synonyms:
      - environment
      - habitat
      - biome
    syn_pos: noun
    syn_example: An ecosystem / habitat — the living environment of a region.
    components:
      - spelling
      - definitions
  - word: elaborate
    ipa: /ɪˈlæb.ər.ət/
    pos: adjective
    tip: e-lab-or-ate — "labor" built with care
    definition: Very detailed, complex and carefully planned.
    example: The castle had elaborate stone carvings.
    synonyms:
      - detailed
      - intricate
      - ornate
      - complex
    syn_pos: adjective
    syn_example: Elaborate / intricate / detailed — very finely worked.
    components:
      - spelling
      - definitions
  - word: eloquent
    ipa: /ˈel.ə.kwənt/
    pos: adjective
    tip: el-o-quent — 'o', then 'quent'
    spelling_hint: ""
    definition: Fluent, forceful and persuasive in speaking or writing.
    example: She gave an eloquent speech.
    synonyms:
      - articulate
      - expressive
      - persuasive
      - fluent
      - forceful
    syn_pos: adjective
    syn_example: An eloquent / articulate / persuasive argument.
    syn_examples:
      - the: She gave an eloquent speech.
        syns:
          - articulate
          - persuasive
          - fluent
          - expressive
      - the: The book is an eloquent defence of freedom.
        syns:
          - expressive
          - forceful
          - persuasive
    syn_notes:
      articulate: speaks clearly and well
      expressive: conveying meaning well
      persuasive: convincing
      fluent: speaks smoothly
      forceful: powerful
    syn_near:
      - rhetorical
      - moving
      - inspiring
      - flowery
      - grandiloquent
    syn_avoid:
      articulate: >-
        = able to express ideas clearly, a word for a person, as in an articulate
        speaker or an articulate student; a book or a written case is expressive
        or forceful instead
      fluent: >-
        = speaking a language easily and without pauses, so it takes a speaker or
        a language, as in a fluent speaker and fluent Russian; a written defence
        cannot be fluent
      forceful: >-
        = powerful and hard-hitting, and it fits a forceful defence or argument,
        but after a speech it only says there was impact, not that the language
        was finely handled
      rhetorical: >-
        = relating to persuasion as a technique, as in a rhetorical device or a
        rhetorical question; it names the strategy and hints at effect rather than
        skill
      moving: >-
        = touching the emotions, as in a moving tribute or a moving speech; good
        English, but it describes the effect on the audience, not the speaker's
        command of language
      inspiring: >-
        = filling people with enthusiasm and hope; again the effect on others,
        where the target praises the writing or the speech itself
      flowery: >-
        = crowded with fancy, over-ornamented words, and it is always faintly
        critical; it insults a speech that the target praises
      grandiloquent: >-
        = inflated and pompous, as in grandiloquent phrasing; a near-spelling
        trap, and far too strong and far too dismissive
    syn_nuance: >-
      All describe the power of language, but the frame picks the word. An
      eloquent speech, address or witness praises control of expression, and an
      eloquent defence of X is a written case. Articulate and fluent belong to a
      person and to spoken delivery, expressive and forceful describe the impact
      of a text.
    components:
      - spelling
      - definitions
      - synonyms
  - word: emphasize
    ipa: /ˈem.fə.saɪz/
    pos: verb
    tip: em-pha-size — the 'pha' after 'em'
    spelling_hint: ""
    definition: To give special importance or attention to something.
    example: The report emphasizes the need for change.
    synonyms:
      - stress
      - highlight
      - underline
      - accentuate
      - spotlight
    syn_pos: verb
    syn_example: Emphasize / stress / highlight the main point.
    syn_examples:
      - the: The report goes on to emphasize the need for reform.
        syns:
          - stress
          - highlight
          - underline
      - the: She will emphasize the importance of preparation.
        syns:
          - stress
          - highlight
          - underline
          - accentuate
          - spotlight
    syn_notes:
      stress: give importance to
      highlight: draw attention to
      underline: show the importance of
      accentuate: make stand out
      spotlight: pull into focus
    syn_near:
      - mention
      - insist
      - exaggerate
      - advertise
      - amplify
    syn_avoid:
      accentuate: >-
        = to make a contrast sharper, usually between two things: it needs a
        difference or a feature, so "accentuate the need for reform" points at
        nothing to contrast
      spotlight: >-
        = to put something in the public eye, a word of campaigns and media: "to
        spotlight the need for reform" suggests publicity, while the report simply
        gives the point weight
      mention: >-
        = to say briefly and without weight: fine in "she mentioned the need for
        reform", but that reports a remark instead of insisting on the point
      insist: >-
        = to demand firmly, and its frames are "insist on + noun" and "insist that
        ...": the patterns here are emphasize plus a noun or a that-clause
      exaggerate: >-
        = to overstate something beyond the truth: too strong for stressing a
        claim the writer believes to be accurate
      advertise: >-
        = to promote a product or service to the public: wrong register for a
        report that simply gives a point importance
      amplify: >-
        = to increase the strength of a sound or an electrical signal: it belongs
        to voices, radio and feedback, not to the force of an argument
    syn_nuance: >-
      All five single out one point as important, and they differ in force.
      Stress, highlight and underline are the neutral report words and take
      emphasize plus a noun; accentuate adds a contrast, as in "accentuate the
      difference", and spotlight suggests deliberate exposure to public view.
    components:
      - spelling
      - definitions
      - synonyms
  - word: empirical
    ipa: /ɪmˈpɪr.ɪ.kəl/
    pos: adjective
    tip: em-pir-i-cal — the 'pir' in the middle
    spelling_hint: ""
    definition: Based on evidence, observation or experience rather than theory.
    example: The theory lacks empirical support.
    synonyms:
      - evidence-based
      - observed
      - experimental
      - factual
    syn_pos: adjective
    syn_example: Back a claim with empirical / observed / factual evidence.
    syn_examples:
      - the: The theory lacks empirical support.
        syns:
          - evidence-based
          - factual
        avoid:
          observed: >-
            = seen or measured, so it belongs to data, evidence or behaviour ('observed
            data'); backing of that kind is 'observational support', since 'observed
            support' is not a phrase
      - the: The claim is based on empirical data.
        syns:
          - observed
          - experimental
          - factual
    syn_notes:
      evidence-based: based on evidence
      observed: seen or measured
      experimental: based on experiments
      factual: dealing with facts
    syn_near:
      - scientific
      - proven
      - objective
      - data-driven
      - statistical
    syn_avoid:
      evidence-based: >-
        = resting on tested evidence, the usual frame being an evidence-based
        approach, policy or treatment; with data it turns circular, since data is
        the evidence itself
      experimental: >-
        = of a designed trial, so with support it means support from experiments;
        narrower than empirical, which also covers observation and measurement.
        Prefer 'experimental evidence' for trial output
      scientific: >-
        = connected with science as a field, so it is far wider and says nothing
        about the source of the knowledge; it suits the standing of a discipline
        rather than a claim
      proven: >-
        = shown to be true, of a result, a cure or a method, so it directly
        contradicts lacks support; the frames here are about the kind of backing,
        not about proof
      objective: >-
        = free of personal bias and fair, a word for a judgement, a report or a
        decision; it does not say how the knowledge was obtained
      data-driven: >-
        = decided by analysing numbers, business jargon for a decision, a strategy
        or a team; it normally sits before an action, and saying data is
        data-driven is circular
      statistical: >-
        = resting on numbers from a sample, so it is narrower, and it excludes
        plain observation, case work and designed experiments
    syn_nuance: >-
      All say the knowledge comes from observation and measurement rather than
      theory, and the noun after them shows which. Empirical takes support,
      evidence, research and data. Experimental says the work came from a designed
      trial, evidence-based modifies an approach or a policy, and factual is the
      looser, everyday member.
    components:
      - spelling
      - definitions
      - synonyms
  - word: enable
    ipa: /ɪˈneɪ.bəl/
    pos: verb
    tip: en-able — makes something "able"
    definition: To make something possible or to give someone the ability to do it.
    example: The grant will enable more students to study.
    synonyms:
      - allow
      - make possible
      - facilitate
      - empower
    syn_pos: verb
    syn_example: Enable / facilitate — to make something possible.
    components:
