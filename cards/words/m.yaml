  - word: mediate
    ipa: /ˈmiː.di.eɪt/
    pos: verb
    tip: me-di-ate — "medi" in the middle
    definition: To settle a disagreement between two parties.
    example: An expert was hired to mediate between the two sides.
    synonyms:
      - negotiate
      - arbitrate
      - resolve
      - intervene
    syn_pos: verb
    syn_example: Mediate / arbitrate — to step in and settle a dispute.
    components:
      - spelling
      - definitions
  - word: meticulous
    ipa: /məˈtɪk.jə.ləs/
    pos: adjective
    tip: me-tic-u-lous — 'tic', then 'u-lous'
    spelling_hint: ""
    definition: Extremely careful and precise about details.
    example: He kept meticulous records of the project.
    synonyms:
      - careful
      - thorough
      - precise
      - painstaking
      - scrupulous
    syn_pos: adjective
    syn_example: A meticulous / thorough / scrupulous examination.
    syn_examples:
      - the: He kept meticulous records.
        syns:
          - careful
          - precise
          - thorough
      - the: She was meticulous about every detail.
        syns:
          - painstaking
          - scrupulous
          - careful
          - thorough
    syn_notes:
      careful: taking care
      thorough: complete and detailed
      precise: exact
      painstaking: taking great trouble
      scrupulous: extremely attentive to correctness
    syn_near:
      - exhaustive
      - rigorous
      - obsessive
      - fussy
      - pedantic
    syn_avoid:
      painstaking: >-
        = taking great trouble over a long task, so it belongs to the work itself,
        as in painstaking research; it cannot modify a set of records, which is
        why it fails here
      precise: >-
        = exact and accurate, and precise records is good English; in the about +
        noun frame the deck wants the word for complete attention, while precise
        about detail points at one exact value
      scrupulous: >-
        = careful about what is right or honest, a moral word for a person, as in
        scrupulous about fairness; it cannot describe a set of records, hence the
        gap in the first frame
      exhaustive: >-
        = covering every case, so it judges scope rather than care, and the frames
        are an exhaustive study, an exhaustive search or exhaustive coverage
      rigorous: >-
        = strict about standards and method, as in rigorous training or a rigorous
        study; it names the strictness of a system or a course, not the care of
        the person keeping records
      obsessive: >-
        = taken over by anxious, neurotic attention; too strong and too
        psychological, since a compliment on someone's working method in formal
        prose is not that
      fussy: >-
        = informal and faintly critical, as in a fussy eater or a fussy typist;
        the register is wrong for a neutral description in a report
      pedantic: >-
        = over-precise about small rules and detail, and always a criticism of
        another person; it says fault-finding where the target says good practice
    syn_nuance: >-
      All describe care over detail, but they attach to different things. A person
      is meticulous, scrupulous or careful, a job is thorough or painstaking, as
      in painstaking research, and a value is precise. Exhaustive and rigorous
      judge coverage and method, so the to + verb frame is meticulous about every
      detail.
    components:
      - spelling
      - definitions
      - synonyms
  - word: mitigate
    ipa: /ˈmɪt.ɪ.ɡeɪt/
    pos: verb
    tip: mit-i-<b>gate</b> — three syllables, no double letters
    spelling_hint: ""
    definition: To make something bad or harmful less severe, serious or painful.
    example: New laws were introduced to mitigate the effects of pollution.
    synonyms:
      - reduce
      - alleviate
      - lessen
      - ease
    syn_pos: verb
    syn_example: '"Mitigate the risks" — reduce / alleviate are the plain IELTS verbs.'
    syn_examples:
      - the: Trees help mitigate the effects of flooding.
        syns:
          - reduce
          - lessen
          - alleviate
        avoid:
          ease: >-
            = to make a burden or a pain gentler ("ease the burden", "ease the
            pain"); with "the effects of flooding" there is no load to lift, so
            reduce, lessen or alleviate fit instead
      - the: New laws aim to mitigate pollution in cities.
        syns:
          - alleviate
          - reduce
          - lessen
        avoid:
          ease: >-
            = it goes with burdens, pressure and pain ("ease the pressure on
            hospitals"); "ease pollution" is wrong, since pollution is a condition
            to cut, not a weight to carry
      - the: We must mitigate the financial risks involved.
        syns:
          - lessen
          - ease
          - reduce
    syn_notes:
      reduce: make smaller
      alleviate: relieve suffering or pain
      lessen: make less
      ease: make less painful
    syn_near:
      - prevent
      - eradicate
      - combat
      - offset
      - cushion
    syn_avoid:
      alleviate: >-
        = relief for pain, poverty or hardship ("alleviate poverty"); fine in the
        pollution sentence, but a financial risk is a chance of loss rather than
        suffering, so it will not take risks
      ease: >-
        = to make a burden, a pressure or a pain gentler ("ease the burden"); it
        is accepted with risks, but "ease the effects of flooding" is wrong, since
        nothing physical is lifted here
      prevent: >-
        = to stop something from happening at all, so it is the exact opposite of
        mitigate, which only lowers the force of an effect that still occurs
      eradicate: >-
        = to destroy something completely, usually a disease or a practice
        ("eradicate poverty"); nothing here is wiped out, only weakened, so it
        promises far too much
      combat: >-
        = to fight against a person, a disease or a problem ("combat crime"); the
        martial image is wrong for the neutral, technical tone of the pollution
        and risk frames
      offset: >-
        = to cancel out a bad effect with a good one ("higher costs offset by
        savings"); it implies two sides of a balance, whereas mitigate only
        weakens the damage and names no credit
      cushion: >-
        = to soften an impact or absorb a blow ("cushion the shock of the cuts");
        it wants a sudden knock after it, not a gradual effect, so it cannot stand
        with the effects of flooding
    syn_nuance: >-
      Mitigate only weakens something that still happens, so it takes the effects
      of, the risks of or the impact of. Reduce and lessen are neutral and fit any
      quantity, alleviate is reserved for suffering, pain and hardship, and ease
      is used for a burden, a pressure or a credit crunch.
    components:
      - spelling
      - definitions
      - synonyms
  - word: monitor
    ipa: /ˈmɒn.ɪ.tər/
    pos: verb
    tip: mon-i-tor — "mon" warn
    definition: To watch and check something over a period of time.
    example: Staff monitor the machines around the clock.
    synonyms:
      - observe
      - track
      - oversee
      - watch
    syn_pos: verb
    syn_example: Monitor / track / observe — to watch over time.
    components:
      - spelling
      - definitions
