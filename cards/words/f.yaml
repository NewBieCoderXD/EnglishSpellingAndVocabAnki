  - word: formidable
    ipa: /fəˈmɪd.ə.bəl/
    pos: adjective
    tip: for-mi-da-ble — 'mid', then 'able'
    spelling_hint: ""
    definition: Inspiring respect or fear through size, strength or ability; difficult to deal with.
    example: They face a formidable challenge.
    synonyms:
      - intimidating
      - daunting
      - awe-inspiring
      - imposing
      - challenging
    syn_pos: adjective
    syn_example: A formidable / daunting / imposing obstacle.
    syn_examples:
      - the: They face a formidable challenge.
        syns:
          - daunting
          - challenging
          - intimidating
      - the: The fortress proved formidable.
        syns:
          - imposing
          - awe-inspiring
          - intimidating
    syn_notes:
      intimidating: frightening
      daunting: discouraging to face
      awe-inspiring: amazingly impressive
      imposing: impressive in size or dignity
      challenging: demanding
    syn_near:
      - terrifying
      - overwhelming
      - alarming
      - fearsome
    syn_avoid:
      awe-inspiring: >-
        = filling you with wonder, a compliment about beauty or scale: it suits
        the fortress, but a challenge is something to be met, not admired
      challenging: >-
        = demanding enough to test you, so it describes a task, an opponent or a
        course: a fortress is not something you take on as a task
      daunting: >-
        = alarming because it looks hard ahead, always seen by the person facing
        it: it wants "they face" or "we found it ___", not a fortress proving it
      imposing: >-
        = stately or impressive in size, as in an imposing castle: it fits how a
        fortress looks, but a challenge is met rather than looked at
      terrifying: >-
        = making a person feel terror, so it names a reaction in a person: neither
        a challenge nor a wall is felt to be terrifying in these frames
      overwhelming: >-
        = so great that it defeats you, and it wants a countable dose ("an
        overwhelming amount", "an overwhelming defeat"): you are not swamped by a
        crowd of people
      alarming: >-
        = raising concern, and it describes the effect on people ("an alarming
        trend"): the word points at public worry, not at the size of the obstacle
      fearsome: >-
        = old-fashioned and now comic in films and games ("a fearsome beast"): too
        whimsical for an argument's challenge or an exam-style obstacle
    syn_nuance: >-
      All of these make you hesitate, but the frame sorts them. A task you have to
      face takes daunting, challenging or intimidating, while a structure or an
      opponent you look at takes imposing or awe-inspiring. Formidable is the
      strongest member and fits both, as in a formidable challenge and a
      formidable rival.
    components:
      - spelling
      - definitions
      - synonyms
