      - definitions
  - word: facilitate
    ipa: /fəˈsɪl.ɪ.teɪt/
    pos: verb
    tip: fa-cil-i-tate — 'cil', then 'i-tate'
    spelling_hint: ""
    definition: To make an action or process easier.
    example: The new software facilitates communication.
    synonyms:
      - ease
      - enable
      - assist
      - help
      - streamline
    syn_pos: verb
    syn_example: This facilitates / eases / enables faster decision-making.
    syn_examples:
      - the: The new system is designed to facilitate communication.
        syns:
          - ease
          - enable
          - help
        avoid:
          assist: >-
            = to give help to a person, and it wants a helper, as in "assist in the
            talks"; the subject here is a system, so "a system assists
            communication" reads like a machine helping
          streamline: >-
            = to cut waste out of a workflow so it runs faster; communication is not
            a chain of steps to trim, and the frame is "ease communication". It is
            accepted for the whole process
      - the: A mediator was brought in to facilitate the talks.
        syns:
          - help
          - assist
        avoid:
          streamline: >-
            = to cut waste out of a workflow so it runs faster; a mediator's task in
            the talks is not a workflow, and the frame is "help with the talks". It
            is accepted for the whole process
          enable: >-
            = to make something possible, and the usual frame gives an infinitive,
            "enable the parties to talk"; after "brought in to" it wants one, and
            "to enable the talks" is a headline abbreviation
      - the: The software is designed to facilitate the whole process.
        syns:
          - ease
          - streamline
          - help
        avoid:
          assist: >-
            = to give help to a person, so it needs someone who gives it; the
            subject here is the software and the object a process, and a process
            cannot be assisted. It is accepted for the mediator
          enable: >-
            = to make something possible, and it usually takes an infinitive,
            "enable staff to work faster"; with the software as subject, "enable the
            process" reads as a headline abbreviation
    syn_notes:
      ease: make less difficult
      enable: make possible
      assist: help
      help: make easier
      streamline: make more efficient
    syn_near:
      - expedite
      - implement
      - support
      - simplify
      - foster
    syn_avoid:
      assist: >-
        = give help to a person, and it wants a helper, as in "assist in the
        talks": it is the right word for a mediator, but a system that assists
        communication reads like a machine helping
      ease: >-
        = to make less difficult, and its object is a task, a burden or a pain: it
        fits "ease the whole process", but a mediator does not ease talks
      enable: >-
        = to make something possible, and the usual frame gives an infinitive,
        "enable users to share": here the subject is a system, so "enable
        communication" reads as a headline abbreviation
      streamline: >-
        = to cut waste out of a workflow so it runs faster: it needs a process, so
        it fits "streamline the whole process" but not a mediator's task or
        communication itself
      expedite: >-
        = to speed something up, a formal business word: "expedite the process" is
        good English, but it changes speed, not the ease with which people talk
      implement: >-
        = to put a plan, a policy or a system into force: it needs a written
        scheme, so "implement the talks" is wrong and a mediator implements no
        plan here
      support: >-
        = to give backing that a person or a system provides: "the system supports
        communication" is fine, but support does not make the talks easier to hold
      simplify: >-
        = to make something less complex, so it takes a method, a rule or a
        process: it fits "simplify the whole process", but it removes steps rather
        than clearing obstacles
      foster: >-
        = to encourage growth or good feeling, so it takes a culture, a spirit or
        a relationship: "foster communication" is good English, but it develops
        links instead of removing difficulties
    syn_nuance: >-
      All five remove an obstacle, but the object shows what kind. Ease, enable
      and help take an activity, a task or a person, and facilitate suits all
      three in formal report English. Assist needs a human helper, so it fits a
      mediator, and streamline implies cutting waste from a workflow.
    components:
      - spelling
      - definitions
      - synonyms
