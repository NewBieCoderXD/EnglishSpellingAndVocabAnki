  - word: demonstrate
    ipa: /ˈdem.ən.streɪt/
    pos: verb
    tip: de-mon-strate — 'mon', then 'strate'
    spelling_hint: ""
    definition: To show clearly; to prove by giving evidence or examples.
    example: The study demonstrates a clear link.
    synonyms:
      - show
      - prove
      - illustrate
      - evidence
      - exhibit
    syn_pos: verb
    syn_example: Demonstrate / show / illustrate a point with examples.
    syn_examples:
      - the: The study aims to demonstrate a clear link between the two.
        syns:
          - show
          - prove
          - evidence
          - illustrate
        avoid:
          exhibit: >-
            = to display goods or a specimen in public, so it wants a physical
            object; a clear link is an abstract finding, and the frame takes show.
            Exhibit is right for the machine in sentence three
      - the: She used several examples to demonstrate her point.
        syns:
          - illustrate
          - show
        avoid:
          exhibit: >-
            = to put goods or a specimen on public display, so it needs a physical
            thing; the object here is her point, an argument, and a point is shown,
            not exhibited
          evidence: >-
            = intransitive, meaning to serve as proof, and it suits a figure or a
            finding as the subject; here it would have to take "her point" as its
            object. It is accepted in the study frame
          prove: >-
            = to establish that a claim is true, and the frame is "prove that ...";
            examples back a point, they do not prove one, and the point is the claim
            already being argued
      - the: He will demonstrate how the machine works.
        syns:
          - show
          - exhibit
        avoid:
          evidence: >-
            = intransitive, meaning to serve as proof, and a how + clause is not a
            figure or a finding; it cannot take one as its object, though the study
            frame takes it
          prove: >-
            = to establish that a claim is true; it never takes a how + clause, so
            the frame would have to be "prove that the machine works". It is
            accepted for the link in the study frame
    syn_notes:
      show: make visible
      prove: establish the truth
      illustrate: explain with examples
      evidence: serve as evidence
      exhibit: display publicly
    syn_near:
      - reveal
      - display
      - confirm
      - showcase
    syn_avoid:
      evidence: >-
        = intransitive, meaning to serve as proof, and it suits a figure or a
        finding as the subject: accepted in the study frame, but it cannot take a
        point or a how + clause as its object
      exhibit: >-
        = to display goods or a specimen in public, so it wants a physical
        product: a link and a point cannot be exhibited, though it does fit
        showing the machine in the third sentence
      illustrate: >-
        = to explain a point with examples, and it takes a noun object such as a
        report, a sentence or an argument: it does not take a how + clause, so the
        machine frame fails
      prove: >-
        = to establish that a claim is true, and it needs a claim as its object:
        examples do not prove a point and prove never takes a how + clause, though
        it fits the link in the study frame
      reveal: >-
        = to disclose something previously hidden, which is a different act from
        showing: a link is not secret, a point is not disclosed, and reveal takes
        no how + clause
      display: >-
        = to put a visible object before people, and it wants a thing or a figure
        on a screen, as in display a chart: a point and a how + clause are not
        displayable in this verb sense
      confirm: >-
        = to verify something already believed, so it is stronger than demonstrate
        and needs a prior claim: it will not take a point to illustrate or a how +
        clause
      showcase: >-
        = to display a product or an achievement in order to impress, and it is
        marketing English, fine in a launch report: too promotional for a study,
        and it takes neither a point nor a how + clause
    syn_nuance: >-
      Demonstrate is the formal report verb for making a fact or a link clear, and
      it takes a noun, a that + clause or a how + clause. Show is the neutral
      everyday equivalent. Prove goes further and establishes that a claim is
      true, illustrate explains a point with examples, exhibit displays goods in
      public, and evidence is intransitive.
    components:
