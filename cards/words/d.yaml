  - word: disparity
    ipa: /dɪˈspær.ə.ti/
    pos: noun
    tip: dis-par-ity — 'par', then 'ity'
    spelling_hint: ""
    definition: A great difference or inequality between things.
    example: There is a wide disparity in income.
    synonyms:
      - inequality
      - gap
      - difference
      - imbalance
      - discrepancy
    syn_pos: noun
    syn_example: Highlight the disparity / gap / imbalance between groups.
    syn_examples:
      - the: There is a wide disparity in income.
        syns:
          - inequality
          - gap
          - imbalance
      - the: The study highlights a disparity between regions.
        syns:
          - difference
          - gap
          - discrepancy
    syn_notes:
      inequality: an unfair difference
      gap: a difference between two
      difference: unlikeness
      imbalance: an unbalanced distribution
      discrepancy: an inconsistency
    syn_near:
      - gulf
      - divergence
      - contrast
      - mismatch
      - asymmetry
    syn_avoid:
      difference: >-
        = plain unlikeness, too neutral for the wide gap frame, though a
        difference between regions is fine; income and other measures want a noun
        that flags the size or the unfairness
      discrepancy: >-
        = a mismatch between figures that should agree, as in a discrepancy
        between two sets of data; an income gap is a real difference between
        groups, not an error to be explained
      imbalance: >-
        = a distribution tipped off balance, so it wants the in + noun form, as in
        an imbalance in income; it pushes a judgement, which the neutral between
        frame does not
      inequality: >-
        = unfairness, a moral and political judgement, so it fits income and pay;
        it is too loaded for the measured gap a study reports between two regions
      gulf: >-
        = a very wide difference between two groups, and the frame is a gulf
        between A and B, as in the gulf between rich and poor, never a gulf in
        income
      divergence: >-
        = two trends moving apart over time, a standard economics word such as
        economic divergence; it reads as a process, not a single measured gap
      contrast: >-
        = a striking difference between comparable things, taking between or with,
        as in a contrast between the two styles; it is not used of a measured
        spread in a quantity
      mismatch: >-
        = a bad fit between things that ought to correspond, as in a mismatch
        between supply and demand; it reports a fault rather than mere inequality
      asymmetry: >-
        = a lack of symmetry, a technical word for shapes, systems or tax rules,
        as in fiscal asymmetry; it is too specialist for a general gap between
        groups
    syn_nuance: >-
      A disparity is a large, measurable gap between two groups or figures, and it
      takes a wide disparity in + noun or a disparity between + A and + B.
      Inequality adds the judgement that it is unfair, imbalance suggests a
      distribution tipped off balance, discrepancy means two figures that should
      match do not.
