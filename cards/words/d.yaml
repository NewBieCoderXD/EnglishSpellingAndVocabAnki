  - word: diminish
    ipa: /dɪˈmɪn.ɪʃ/
    pos: verb
    tip: di-min-ish — 'min', then 'ish'
    spelling_hint: ""
    definition: To make or become smaller or weaker.
    example: Demand for the product is diminishing.
    synonyms:
      - decrease
      - reduce
      - decline
      - lessen
      - weaken
    syn_pos: verb
    syn_example: Costs diminish / decline / decrease over time.
    syn_examples:
      - the: Demand for the product continues to diminish.
        syns:
          - decrease
          - decline
          - lessen
      - the: The new policy could diminish workers' rights.
        syns:
          - reduce
          - weaken
    syn_notes:
      decrease: become smaller
      reduce: make smaller
      decline: go downwards
      lessen: become less
      weaken: become weaker
    syn_near:
      - lower
      - drop
      - dwindle
      - curb
      - erode
    syn_avoid:
      decrease: >-
        = a smaller number or quantity, and it sits with falling figures such as
        demand, costs or output: it is flat and mechanical, so it does not fit the
        abstract rights a policy can spoil
      decline: >-
        = intransitive, a downward movement in a trend, as in sales or standards
        declined: it cannot take workers' rights as its object, though a decline
        in pay is a fine noun phrase
      lessen: >-
        = to make or become less, and it is right with risk, harm or pain, as in
        lessen the risk: for what a policy does to a right the natural verb is
        reduce, weaken or undermine
      reduce: >-
        = transitive, to bring a number or a level down by deliberate action:
        demand is not doing that, so demand continues to reduce fails and an
        intransitive verb is needed
      weaken: >-
        = to make or become weaker, and it fits a force, a link, a control or an
        argument: weakening evidence is good English, but demand falling is a drop
        in quantity, not a loss of strength
      lower: >-
        = transitive and numerical, as in lower prices or lower the risk: it has
        no intransitive use, so demand continues to lower is ungrammatical
      drop: >-
        = intransitive by default and it wants a figure after by, as in demand
        dropped by 5%: it will not take workers' rights as an object in this use
      dwindle: >-
        = intransitive and literary, a steady shrinking of something already
        small, such as funds or interest: a policy cannot dwindle anyone's rights
      curb: >-
        = to restrain and hold back, a transitive verb for spending, emissions or
        speeds: it has no intransitive use, so the frame with demand as subject
        fails
      erode: >-
        = to wear away gradually, and it usually takes confidence, support or
        rights: it is transitive and slow, so demand continues to erode is not
        idiomatic
    syn_nuance: >-
      Diminish covers both directions, being intransitive with a shrinking
      quantity, as in demand continues to diminish, and transitive with something
      a policy can spoil, as in diminish workers' rights. Reduce is transitive
      only, decrease and decline are intransitive, lessen goes with risk and harm,
      and weaken is about strength, not size.
