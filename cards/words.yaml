  - word: arbitrary
    ipa: /ˈɑː.bɪ.trər.i/
    pos: adjective
    tip: ar-bi-trary — 'bi', then 'trary'
    spelling_hint: ""
    definition: Based on random choice rather than reason or system.
    example: The decision seemed completely arbitrary.
    synonyms:
      - random
      - capricious
      - whimsical
      - unreasonable
      - subjective
    syn_pos: adjective
    syn_example: An arbitrary / random / capricious decision.
    syn_examples:
      - the: The decision seemed completely arbitrary.
        syns:
          - random
          - whimsical
      - the: The rule is arbitrary and hard to justify.
        syns:
          - unreasonable
          - subjective
          - capricious
    syn_notes:
      random: without pattern
      capricious: changing suddenly, impulsive
      whimsical: playfully unpredictable
      unreasonable: not justified
      subjective: based on personal opinion
    syn_near:
      - autocratic
      - discretionary
      - erratic
      - unfounded
      - despotic
    syn_avoid:
      capricious: >-
        = changing suddenly and unpredictably, of a person or a process over time;
        it fits a capricious rule, but a single decision cannot be capricious
      random: >-
        = with no pattern or cause, as if by chance, and at random or a random
        choice; a written rule can be unreasoned without being chance, so the deck
        keeps it for a decision
      whimsical: >-
        = playful and charmingly unpredictable, as in a whimsical remark or a
        whimsical gesture; the light ironic tone does not fit a serious criticism
        of a rule
      unreasonable: >-
        = badly judged, when a better reason existed; it fits a rule that is hard
        to justify, but a decision can have no reason at all and still not be
        called that
      subjective: >-
        = based on personal feeling, usual in a subjective judgement or decision;
        it names bias rather than the absence of any reason, which is the gap in
        the first frame
      autocratic: >-
        = ruling without listening, of a ruler or regime; it is a near-spelling
        trap, and it is about power, not about whether a decision has any basis
      discretionary: >-
        = decided at the official's own choice, as in discretionary spending or a
        discretionary award; an economics and policy term, and it implies a
        permitted choice to exercise
      erratic: >-
        = moving or working in an irregular pattern over time, as in erratic
        weather or erratic behaviour; it describes variation, not a decision that
        lacks a basis
      unfounded: >-
        = built on nothing at all, the usual frames being an unfounded claim,
        rumour or accusation; a decision can lack a reason without anyone accusing
        anyone of anything
      despotic: >-
        = cruel and dictatorial, of a ruler or regime; far too strong, and it is
        about power, so it says nothing about whether the reasoning held
    syn_nuance: >-
      All mean not based on reason, but the frame and the degree differ. An
      arbitrary decision, rule, limit or boundary is simply unreasoned, at random
      points to chance, capricious to sudden unpredictable change, whimsical to
      playful unpredictability, unreasonable to a bad judgement, and subjective to
      personal bias.
