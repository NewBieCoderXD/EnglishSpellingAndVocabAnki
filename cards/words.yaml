  - word: accurate
    ipa: /ˈæk.jər.ət/
    pos: adjective
    tip: ac-cu-rate — double c, then 'cu-rate'
    spelling_hint: ""
    definition: Correct in all details; exact and free from error.
    example: The figures were accurate.
    synonyms:
      - exact
      - precise
      - correct
      - faithful
      - "true"
    syn_pos: adjective
    syn_example: An accurate / precise / exact measurement.
    syn_examples:
      - the: The figures were accurate.
        syns:
          - exact
          - precise
          - correct
        avoid:
          "true": >-
            = factually right, and it works best with a that-clause or "true to +
            noun"; "the figures were true" is possible English, but exact or correct
            is the natural predicate for a check on data
      - the: She gave accurate details of the events.
        syns:
          - faithful
          - correct
          - precise
        avoid:
          "true": >-
            = factually right, and it works best with a that-clause or "true to +
            noun"; as an adjective before a bare noun it wants a count noun, so true
            details of the events is not idiomatic
    syn_notes:
      exact: exactly right
      precise: detailed and exact
      correct: without error
      faithful: true to the original
      "true": factually correct
    syn_near:
      - sound
      - reliable
      - valid
      - right
    syn_avoid:
      exact: >-
        = exactly right down to the last figure, which suits "the figures were
        exact"; for "accurate details of the events" it suggests a word-for-word
        copy rather than a clear account
      faithful: >-
        = true to an original, so it needs "a faithful copy, translation or
        summary"; the figures are data rather than a rendering, though "a faithful
        account of the events" is natural
      "true": >-
        = factually right, and it works best with a that-clause or "true to +
        noun"; as a bare adjective before figures or details it is clumsy
      sound: >-
        = in good condition, as in "a sound argument or a sound structure"; it
        evaluates a judgement rather than measuring a figure
      reliable: >-
        = dependable over time, the frame of "a reliable source or method"; a
        one-off figure can be accurate or wrong, but calling it reliable asks a
        different question
      valid: >-
        = legally or logically acceptable, the frame of "a valid argument, claim
        or permit"; it judges standing, not the correctness of a number
      right: >-
        = correct in everyday speech, as in "the right answer"; it is too informal
        for a technical or academic context such as a data report
    syn_nuance: >-
      All five mean free from error but they grade it: accurate and correct = no
      mistakes, exact = right to the last figure, precise = fine-grained detail,
      faithful = true to an original or a retelling, true = factually so, wanting
      a that-clause or "true to". Use exact for numbers, faithful for a version or
      translation.
