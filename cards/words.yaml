  - word: supposition
    ipa: /ˌsʌp.əˈzɪʃ.ən/
    pos: noun
    tip: suppose + -ition — something you suppose
    definition: A tentative idea put forward for the sake of argument and held with doubt.
    example: For the sake of argument, grant the supposition that costs will not rise.
    synonyms:
      - assumption
      - hypothesis
      - premise
      - belief
      - guess
      - theory
    syn_pos: noun
    syn_example: On the supposition that … — granted for the sake of argument.
    syn_examples:
      - the: For the sake of argument, grant the supposition that costs will not rise.
        syns:
          - assumption
          - hypothesis
        avoid:
          premise: >-
            = the base an argument rests on; what you grant for the sake of an
            argument is an assumption or a supposition, never the premise
      - the: On the supposition that the sample is representative, the results apply to the whole population.
        syns:
          - assumption
          - hypothesis
          - premise
    syn_notes:
      assumption: the everyday word for the same thing
      hypothesis: a tentative idea too, but a hypothesis is what you put to the test
      premise: the base an argument rests on, and it also takes 'that'
    syn_near:
      - conjecture
      - speculation
      - presumption
    syn_avoid:
      belief: >-
        = a conviction the person holds; you grant a supposition for an argument,
        but 'grant the belief that' is not English
      guess: >-
        = hit on by chance with nothing behind it; a supposition is introduced
        deliberately, with a reason, even where it is doubted
      theory: >-
        = a developed system of explanation tested against data; a supposition is a
        single doubtful case, never a system
      conjecture: >-
        = a guess built on very little evidence, and the word itself marks low
        certainty, so nothing so shaky can be granted for an argument
      speculation: >-
        = open-ended guessing about what may happen, and it takes speculation
        about or over; a supposition is introduced for an argument
      presumption: >-
        = held true by default, by law or convention, until disproved: that is the
        confident member of the family, while a supposition is granted and doubted
    syn_nuance: >-
      All three are 'taken as true for now', but a supposition is the one you
      introduce on purpose for an argument: 'on the supposition that X', 'for the
      sake of argument'. Assumption is the everyday word, hypothesis is the one
      you test, and a guess has no reason behind it. Supposition belongs to
      logic, so in IELTS writing reach for assumption.
    components:
      - spelling
      - definitions
