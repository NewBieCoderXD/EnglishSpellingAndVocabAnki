  - word: obsolete
    ipa: /ˈɒb.sə.liːt/
    pos: adjective
    tip: ob-so-lete — 'so', then 'lete'
    spelling_hint: ""
    definition: No longer used or needed; out of date.
    example: Many skills have become obsolete.
    synonyms:
      - outdated
      - outmoded
      - antiquated
      - archaic
      - superseded
    syn_pos: adjective
    syn_example: Outdated / obsolete / antiquated technology.
    syn_examples:
      - the: Many skills have become obsolete.
        syns:
          - outdated
          - outmoded
          - superseded
      - the: The old equipment is now obsolete.
        syns:
          - superseded
          - antiquated
          - archaic
    syn_notes:
      outdated: old-fashioned
      outmoded: no longer fashionable
      antiquated: old to the point of uselessness
      archaic: belonging to old times
      superseded: replaced by something new
    syn_near:
      - obsolescent
      - defunct
      - dated
      - antique
      - redundant
    syn_avoid:
      antiquated: >-
        = too old to be of any practical use, of methods, laws and ideas; it fits
        the old equipment frame, but skills that have merely been overtaken are
        outmoded, not antiquated
      archaic: >-
        = belonging to the distant past, used of language, spelling and custom, as
        in an archaic spelling; it labels a form that survives, not a skill that
        has been replaced
      outdated: >-
        = behind the times but still usable, the word for views, fashions and
        information; the equipment frame wants a machine that is out of action,
        not merely old
      outmoded: >-
        = no longer fashionable or current, of styles, methods and ideas; for a
        machine the deck wants superseded by a newer model, which points at a
        replacement
      obsolescent: >-
        = about to become obsolete, as in 'an obsolescent system'; it points
        at something still in use for now, whereas the target says put out of
        use entirely
      defunct: >-
        = no longer existing or functioning, the usual register for bodies,
        companies and systems, so defunct equipment is not the natural frame for a
        machine in a report
      dated: >-
        = old-fashioned but still in use, and milder, whereas the target says put
        out of use entirely, so a dated method can still be taught
      antique: >-
        = a collectable object of some age, or belonging to the trade in antiques;
        it names a thing you could own, not a skill that has died out of use
      redundant: >-
        = no longer needed because a person or a new system does the job, as in
        staff made redundant; fine English for jobs and IT systems, but it is a
        workplace term, not a label for skills or equipment
    syn_nuance: >-
      All mean dropped from current use, but the frame sorts them. Outdated and
      outmoded sit with skills, ideas and fashions, superseded needs a newer
      version, as in superseded by X, antiquated judges something too old to be of
      use, and archaic belongs to language, spelling and custom, as in an archaic
      spelling.
