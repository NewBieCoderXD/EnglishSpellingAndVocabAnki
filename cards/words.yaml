  - word: controversial
    ipa: /ˌkɒn.trəˈvɜː.ʃəl/
    pos: adjective
    tip: con-tro-vers-ial — the 'ro' then 'vers'
    spelling_hint: ""
    definition: Causing disagreement or discussion.
    example: The policy proved highly controversial.
    synonyms:
      - debatable
      - disputed
      - contentious
      - arguable
      - divisive
    syn_pos: adjective
    syn_example: A controversial / contentious / debated topic in the news.
    syn_examples:
      - the: The new policy is highly controversial.
        syns:
          - contentious
          - divisive
          - disputed
          - debatable
      - the: It remains a controversial decision.
        syns:
          - disputed
          - arguable
          - debatable
          - contentious
    syn_notes:
      debatable: open to debate
      disputed: challenged as false
      contentious: causing argument
      arguable: can be argued
      divisive: causing disagreement between people
    syn_near:
      - controversy
      - problematic
      - polarizing
      - sensitive
    syn_avoid:
      arguable: >-
        = open to argument in principle, and it usually governs a clause, as in it
        is arguable that: placed before a noun it does not describe the decision
        itself, so a controversial decision is the frame
      divisive: >-
        = it splits people into opposing camps, and its subject is a group: it
        works for the policy, but a decision cannot be divisive on its own, since
        the reaction is what divides
      controversy: >-
        = a noun for the public argument itself, and it takes over, as in a
        controversy over: the copula needs an adjective here, so is highly
        controversy fails
      problematic: >-
        = full of practical faults or difficulties, which is a criticism of
        quality: it fits a decision or a design, but it says nothing about the
        argument the public is having
      polarizing: >-
        = an American, journalistic word for driving people into opposite camps:
        natural after a policy or an issue, but too informal and too narrow before
        a decision in IELTS prose
      sensitive: >-
        = delicate or painful to handle, as in a sensitive issue or a sensitive
        subject: it marks tact rather than disagreement, so the highly + decision
        frame fails
    syn_nuance: >-
      All say a matter is open to argument. Controversial and contentious mark
      public conflict, disputed implies a formal challenge, as in disputed
      figures, debatable and arguable mean open to debate, and arguable often
      takes it is arguable that, while divisive means a subject that splits people
      into camps. All take a copula, never an adverb.
    components:
      - spelling
      - definitions
      - synonyms
  - word: crucial
    ipa: /ˈkruː.ʃəl/
    pos: adjective
    tip: cru-cial — 'cru', then 'cial'
    spelling_hint: ""
    definition: Extremely important; critical to the success of something.
    example: Timing is crucial to the project.
    synonyms:
      - vital
      - essential
      - critical
      - key
      - necessary
    syn_pos: adjective
    syn_example: It is crucial / vital / essential to plan ahead.
    syn_examples:
      - the: Timing is crucial to the success of the project.
        syns:
          - critical
          - vital
          - essential
          - key
        avoid:
          necessary: >-
            = required, and it belongs with for, as in "necessary for success"; the
            frame here is "is crucial to + noun", where a plain adjective will not
            take necessary to
      - the: It is crucial that we act quickly.
        syns:
          - essential
          - necessary
          - vital
      - the: Trust plays a crucial role here.
        syns:
          - key
          - vital
          - essential
          - critical
        avoid:
          necessary: >-
            = required, and it belongs with for, as in "necessary for success"; the
            frame here is "play a crucial role", so the word would have to stand
            before role, not after to
    syn_notes:
      vital: absolutely needed for success
      essential: indispensable
      critical: decisive, make-or-break
      key: the most important factor
      necessary: needed
    syn_near:
      - important
      - major
      - prime
      - paramount
      - urgent
    syn_avoid:
      critical: >-
        = the decisive, make or break moment, and it wants a following noun, as in
        critical to the project or a critical stage: in the that + clause frame
        use essential, vital or necessary
      key: >-
        = the single most important of several, and it always names the thing it
        labels, as in a key role: it cannot stand alone before that + clause,
        where the noun is missing
      necessary: >-
        = required, and it belongs with to or for, as in necessary for success: it
        will not sit in the frames with to after a plain adjective or before role,
        though it is right in the that + clause
      important: >-
        = plain and of any degree, so it is far weaker: it loses the sense that
        the outcome depends on the timing, and it carries no frame of its own
      major: >-
        = big in size or importance, and it modifies a following noun, as in
        'a major role in'; the frames here are 'crucial to + noun', 'it is
        crucial that ...' and 'a crucial role', none of which it fills
      prime: >-
        = first in importance or the best example, and it lives in set phrases
        such as of prime importance and a prime example: it has no slot in any of
        these three frames
      paramount: >-
        = supreme, and it is usually followed by of with importance or concern, as
        in of paramount importance: the preposition is of, not to, and it will not
        modify role
      urgent: >-
        = needing immediate action, a different sense altogether from deciding the
        outcome: it fits tasks, requests and calls, so none of these three frames
        will take it
    syn_nuance: >-
      Crucial, vital and essential all take a following noun with to, for or in,
      as in timing is crucial to success, and all accept it is crucial that +
      clause. Crucial and critical also modify a noun, as in a crucial stage, and
      take part in, as in plays a crucial role. Key is the most important of
      several, and necessary is only required.
