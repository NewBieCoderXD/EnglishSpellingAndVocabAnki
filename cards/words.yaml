  - word: imperative
    ipa: /ɪmˈper.ə.tɪv/
    pos: adjective/noun
    tip: im-per-a-tive — 'per', then 'a-tive'
    spelling_hint: ""
    definition: Absolutely necessary; vitally important.
    example: It is imperative that we act now.
    synonyms:
      - essential
      - vital
      - crucial
      - mandatory
      - required
    syn_pos: adjective
    syn_example: It is imperative / essential / crucial to respond.
    syn_examples:
      - the: It is imperative that we act now.
        syns:
          - essential
          - crucial
          - vital
      - the: Pollution control is imperative.
        syns:
          - essential
          - mandatory
          - required
    syn_notes:
      essential: absolutely necessary
      vital: critically important
      crucial: make-or-break
      mandatory: compulsory by rule
      required: needed or demanded
    syn_near:
      - compulsory
      - indispensable
      - urgent
      - paramount
    syn_avoid:
      vital: >-
        = needed to keep someone or something alive, so it takes "vital to + noun"
        or names an organ: it suits "it is vital that we act", but pollution
        control is only essential
      crucial: >-
        = the whole outcome turns on it, a decision-level word ("a crucial
        moment", "crucial to the result"): the register is too high for a whole
        field of policy
      mandatory: >-
        = laid down by a rule, statute or contract, so it needs an enforceable
        source: it can pass with pollution control, but nobody is forcing our
        decision to act
      required: >-
        = needed or formally asked for, with no sense of a near duty: "it is
        required that we act now" merely states a need, where the frame demands
        what must not wait
      compulsory: >-
        = imposed by a rule or law and enforceable, so it always has an authority
        behind it: "it is compulsory that we act now" implies a statute, not a
        judgement
      indispensable: >-
        = you cannot function without it, and it takes a person or a tool ("water
        is indispensable to life"): it cannot describe a field of policy at all
      urgent: >-
        = needing to happen now, so it is about timing: an urgent case or an
        urgent problem fits, but pollution control as a whole is essential, not
        urgent
      paramount: >-
        = the single most important thing, a superlative that wants "a paramount
        concern": with nothing to compare it to, "pollution control is paramount"
        says nothing
    syn_nuance: >-
      All insist that something must be done, but the source of the duty separates
      them. Imperative, essential, vital and crucial argue from importance, so
      they fit "it is imperative that", while mandatory, compulsory and required
      argue from rules someone enforces. Vital and indispensable are
      life-or-death, too strong for pollution control.
