      uncertain: >-
        = not knowing for sure, a state of a person: it fits "I am uncertain" but
        not "wording", and a deliberate reply is a choice rather than doubt
      vague: >-
        = too general to be precise, the opposite problem to ambiguity: "highly
        vague" is fine, but a reply is ambiguous when two clear meanings are left
