        syns:
          - direct
          - instant
        avoid:
          pressing: >-
            = demanding attention before anything else, used of a matter, a need
            or a priority; 'a pressing response' is not a phrase in general use,
            and the frame is 'a prompt or instant response'
          prompt: >-
            = quick to act, and it describes a person or a firm, as in a prompt
            reply; the storm caused damage, it did not act, so nothing here can be
            quick
          swift: >-
            = fast in movement or in finishing a task, as in swift action or a swift
            reply; damage is a result, not a fast task, so there is nothing to move
      - the: The safety of the crew is our immediate priority.
        syns:
          - urgent
          - pressing
        avoid:
          direct: >-
            = straight to the point, with no step in between, as in a direct result;
            a priority is a matter of order, not a link in a chain, so the frame is
            "an urgent priority"
          prompt: >-
            = quick to act, and it describes a person or a firm, as in a prompt
            decision; a priority is a matter, not a responder, so nothing here can
            act
          swift: >-
            = fast in movement or in finishing a task, as in swift action; a
            priority is a matter of order, not a task that can be done quickly,
            so 'a swift priority' is not a natural pairing
    syn_notes:
      instant: with no delay
      prompt: quick to act
      swift: fast
      direct: straight, with no step in between
      urgent: needing action now
      pressing: demanding attention now
    syn_near:
      - emergency
      - imminent
      - instantaneous
      - hasty
      - speedy
    syn_avoid:
      direct: >-
        = straight to the point with no step in between, as in a direct result or
        a direct answer: it fits damage, but a response is a reply, not a link in
        a chain
      instant: >-
        = with no delay at all, even between cause and effect: it fits damage and
        a response, but a priority is judged by urgency, not by zero time
      pressing: >-
        = demanding attention before anything else, used of a matter, a need
        or a priority, as in 'a pressing need'; it points at urgency rather
        than speed
      prompt: >-
        = quick to act, and it usually describes a person or a firm, as in a
        prompt reply: the storm is not prompt, and a priority cannot answer
      swift: >-
        = fast in movement or in finishing a task, as in swift action or a
        swift reply; it measures how fast something is done, so an abstract
        quality such as urgency wants another word
      urgent: >-
        = needing action now, a claim about importance rather than speed: it fits
        an urgent priority but not the damage a storm caused
      emergency: >-
        = a noun, so an emergency response is one given during a crisis, not one
        given at once: the word for speed here is immediate or instant
      imminent: >-
        = about a danger or event about to happen, as in imminent collapse: it
        cannot describe a response, damage or a priority
      instantaneous: >-
        = a technical or scientific adjective for time of zero length, as in
        instantaneous velocity: far too clinical for a plain request for a reply
      hasty: >-
        = done with too little care because of speed, and it criticises the work:
        here the speed is a virtue, so hasty reverses the meaning
      speedy: >-
        = a light, journalistic form of fast, as in a speedy service: it reads
        informal in a formal report and fits services better than damage
    syn_nuance: >-
      All point to no delay, but they split by what is fast. Immediate is the
      neutral adjective for a response, an effect and a priority, with no agent.
      Instant claims zero time between cause and result, direct marks a link in a
      chain, prompt and swift describe how fast a person acts, and urgent and
      pressing fit a problem needing attention now.
