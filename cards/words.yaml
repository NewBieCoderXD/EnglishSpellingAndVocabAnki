  - word: presumption
    ipa: /prɪˈzʌmp.ʃən/
    pos: noun
    tip: pre-sump-tion — "sump" take
    definition: Something held to be true by default — by law, past evidence or convention — until proven otherwise.
    example: The defendant was released on the presumption of innocence.
    synonyms:
      - assumption
      - supposition
      - belief
      - guess
      - hypothesis
      - opinion
    syn_pos: noun
    syn_example: On the presumption / assumption that … — taken as true by default.
    syn_examples:
      - the: The defendant was released on the presumption of innocence.
        syns:
          - assumption
        avoid:
          belief: >-
            = a conviction the speaker holds; the phrase here is fixed — 'on the
            presumption of innocence' — because the law presumes, not the speaker
      - the: The scheme was approved on the presumption that the risk was negligible.
        syns:
          - assumption
          - supposition
          - belief
    syn_notes:
      assumption: the everyday word for the same idea
      supposition: a tentative case granted for the sake of argument
      belief: a conviction the person holds, not one law or custom sets up
    syn_near:
      - theory
      - expectation
    syn_avoid:
      supposition: >-
        = a tentative case granted for the sake of argument, so it needs 'that':
        'on the supposition of innocence' is not English, and the word never
        carries the legal sense of a presumption
      guess: >-
        = hit on by chance with nothing behind it; a presumption is held until
        disproved, which is the opposite of a guess
      hypothesis: >-
        = an explanation you put to the test; a presumption is taken as true with
        no test at all, which is how law and convention keep it in place
      opinion: >-
        = a view the speaker owns and argues for; a presumption goes unstated and
        unargued, held by law or by custom
      theory: >-
        = a developed system of explanation tested against data, so 'on the theory
        that' changes the meaning: a theory has to earn the truth
      expectation: >-
        = what you expect to happen next; a presumption is about something already
        taken as true, not about a future outcome
    syn_nuance: >-
      Presumption is the confident, by-default member of the family: law or
      convention holds it true until disproved, as in 'on the presumption of
      innocence'. Assumption is the neutral everyday word, supposition is the same
      idea framed as an argument, and a guess has nothing behind it at all.
