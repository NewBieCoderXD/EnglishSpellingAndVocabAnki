  - word: hypothesis
    ipa: /haɪˈpɒθ.ə.sɪs/
    pos: noun
    tip: hy-poth-e-sis — 'poth', then 'e-sis'
    spelling_hint: ""
    definition: A proposed explanation based on limited evidence, to be tested.
    example: The results support our hypothesis.
    synonyms:
      - theory
      - premise
      - supposition
      - assumption
      - proposition
    syn_pos: noun
    syn_example: Test a hypothesis / theory / assumption.
    syn_examples:
      - the: The results support our hypothesis.
        syns:
          - theory
          - assumption
          - supposition
          - proposition
      - the: Researchers tested the hypothesis with new data.
        syns:
          - proposition
          - theory
          - supposition
    syn_notes:
      theory: an explanation backed by evidence
      premise: a starting point
      supposition: a tentative case granted for the sake of argument
      assumption: taken for granted
      proposition: a claim put forward for debate
    syn_near:
      - thesis
      - conjecture
      - speculation
      - prediction
      - axiom
    syn_avoid:
      premise: >-
        = a starting point a whole argument rests on, as in the premise of an
        argument: data can support or refute a hypothesis, so 'our premise' is
        never the thing the results back
      assumption: >-
        = something taken for granted without being tested, so it takes "on the
        assumption that": testing settles a hypothesis and leaves an assumption
        standing
      thesis: >-
        = the central claim of a paper, argument or dissertation, argued over many
        pages rather than tested: it is not one testable statement
      conjecture: >-
        = a guess built on very little evidence, and the word itself marks low
        certainty: too weak for "tested the hypothesis with new data"
      speculation: >-
        = open-ended guessing with no evidence behind it, and it takes speculation
        about or over: it reads wrong after "support our" or "tested the"
      prediction: >-
        = what you expect to happen next, so the outcome confirms or fails a
        prediction: a hypothesis explains why something happens and is the one you
        test
      axiom: >-
        = a truth taken as self-evident and never proved, the opposite of a
        hypothesis, which is precisely what evidence tests
    syn_nuance: >-
      All mean a statement put forward, but only some are meant to be tested.
      Hypothesis and theory = an explanation that data can support or refute,
      premise = the starting point a whole argument rests on, assumption =
      something taken for granted to get work done, supposition = a tentative case
      granted for the sake of argument, and proposition = a claim put forward for
      debate, not a suggested plan.
    components:
      - spelling
      - definitions
      - synonyms
  - word: immediate
