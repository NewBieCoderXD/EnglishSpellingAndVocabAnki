  - word: investigate
    ipa: /ɪnˈves.tɪ.ɡeɪt/
    pos: verb
    tip: in-ves-ti-gate — 'ves', then 'ti-gate'
    spelling_hint: ""
    definition: To carry out a systematic inquiry into something.
    example: Police are investigating the incident.
    synonyms:
      - examine
      - probe
      - explore
      - study
      - look into
    syn_pos: verb
    syn_example: Investigate / examine / probe the causes.
    syn_examples:
      - the: Police plan to investigate the incident.
        syns:
          - probe
          - look into
          - examine
      - the: Scientists investigate the causes of the disease.
        syns:
          - study
          - explore
          - examine
          - probe
    syn_notes:
      examine: look closely at
      probe: investigate deeply
      explore: investigate widely
      study: examine over time
      look into: check into (informal)
    syn_near:
      - uncover
      - inspect
      - research
      - audit
      - solve
    syn_avoid:
      explore: >-
        = to look round a field in a broad, open way, as in explore space: it does
        not fit one past incident and it drops the search for an explanation
      look into: >-
        = an informal phrasal verb for checking up, which suits police work but
        clashes with the formal register of scientific research into a disease
      study: >-
        = to give a subject sustained academic attention, so it belongs with
        scientists and a disease: police study a scene over weeks, but an inquiry
        into a single incident is narrower
      uncover: >-
        = to discover what was hidden, so you uncover a fact, a corruption or the
        truth: the incident is already known, so uncover takes the wrong object
        here
      inspect: >-
        = to check an object or site officially for faults or safety, as in
        inspect a factory: police do not inspect an incident, they investigate it
      research: >-
        = to work systematically on a subject or field, as in research a disease:
        it takes a topic rather than a past event such as an incident
      audit: >-
        = an official review of money, accounts or a procedure, as in an audit of
        the system: no criminal or scientific inquiry takes that frame
      solve: >-
        = to find the answer to a puzzle, so you solve a case or a murder: an
        inquiry is only just starting in this frame, which solve assumes is
        finished
    syn_nuance: >-
      All mean looking into something to find out what happened. Investigate is
      the formal, neutral verb and takes a case, an incident, a cause or a
      complaint. Probe and look into add pressure or informality, examine is the
      closest plain alternative, while explore and study are broader and belong to
      research into a field or a cause over time.
