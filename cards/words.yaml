  - word: premise
    ipa: /ˈprem.ɪs/
    pos: noun
    tip: pre-mise — the "pre-" idea set before the argument
    definition: The starting statement or idea on which an argument is built.
    example: The whole plan rests on a false premise.
    synonyms:
      - assumption
      - supposition
      - starting point
    syn_pos: noun
    syn_example: A premise / assumption — the starting belief of an argument.
