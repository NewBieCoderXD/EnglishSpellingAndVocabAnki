        syns:
          - stress
          - highlight
          - underline
      - the: She will emphasize the importance of preparation.
        syns:
          - stress
          - highlight
          - underline
          - accentuate
          - spotlight
    syn_notes:
      stress: give importance to
      highlight: draw attention to
      underline: show the importance of
      accentuate: make stand out
      spotlight: pull into focus
    syn_near:
      - mention
      - insist
      - exaggerate
      - advertise
      - amplify
    syn_avoid:
      accentuate: >-
        = to make a contrast sharper, usually between two things: it needs a
        difference or a feature, so "accentuate the need for reform" points at
        nothing to contrast
      spotlight: >-
        = to put something in the public eye, a word of campaigns and media: "to
        spotlight the need for reform" suggests publicity, while the report simply
        gives the point weight
      mention: >-
        = to say briefly and without weight: fine in "she mentioned the need for
