      - definitions
      - synonyms
  - word: objective
    ipa: /əbˈdʒek.tɪv/
    pos: noun/adjective
    tip: ob-jec-tive — 'ject', then 'ive'
    spelling_hint: ""
    definition: A goal or aim; also, based on facts rather than feelings.
    example: Our main objective is to cut costs.
    synonyms:
      - goal
      - aim
      - target
      - purpose
      - intention
    syn_pos: noun
    syn_example: Set a clear objective / goal / target.
    syn_examples:
      - the: Our main objective is to cut costs.
        syns:
          - goal
          - aim
          - target
          - purpose
      - the: Set a clear objective before starting.
        syns:
          - goal
          - purpose
          - intention
    syn_notes:
      goal: a desired result
      aim: what one intends
      target: a measurable goal
      purpose: the reason for something
      intention: what one plans to do
    syn_near:
      - mission
      - task
      - milestone
      - ambition
    syn_avoid:
      aim: >-
        = a purpose one sets out to reach, usually with "at" plus a gerund ("an
        aim at reducing costs"); when you fix the destination before starting, the
        noun you want is goal or objective
      intention: >-
        = the private plan in someone's mind, so it wants a person as subject and
        often a gerund ("her intention of leaving"); in "our main objective is to
        cut costs" the aim belongs to a plan, not a person
      target: >-
        = a measurable figure or date to be hit, as in "a sales target of 20%";
        that is the standard word for a number, but "set a clear target before
        starting" asks for the destination, not a quota
      mission: >-
        = a broad assignment given to a person or team, often idealistic ("a
        mission to help the poor"); it overstates a practical end point like
        cutting costs and sounds informal in a plan
      task: >-
        = a piece of work to be carried out, normally with a verb ("a task of
        sorting files"); it names an action, not the state you are working
        towards, so it fails in "set a clear objective"
      milestone: >-
        = a dated checkpoint on a project timeline, as in "a milestone in the
        plan"; it marks progress along the way and can never stand for the end
        point itself
      ambition: >-
        = a long-term personal aspiration, often about status or achievement; too
        grand and self-focused for a clear operational destination like cutting
        costs
    syn_nuance: >-
      All of these name the end being worked towards, but the frame sorts them. An
      objective or goal is a defined destination, an aim takes "at" plus a gerund
      ("an aim at cutting costs"), a target is a number or date to be hit, an
      intention belongs to a person, and a purpose explains why something is done.
    components:
      - spelling
      - definitions
      - synonyms
  - word: prioritize
    ipa: /praɪˈɒr.ɪ.taɪz/
    pos: verb
    tip: pri-or-i-tize — 'or', then 'i-tize'
    spelling_hint: ""
    definition: To treat something as more important than others.
    example: We must prioritize safety.
    synonyms:
      - rank
      - favour
      - emphasize
      - put first
      - prefer
    syn_pos: verb
    syn_example: Prioritize / rank / put first the key tasks.
    syn_examples:
      - the: We must prioritize safety above all.
        syns:
          - rank
          - put first
          - emphasize
        avoid:
          favour: >-
            = to prefer one option as a matter of taste, so the frame is a person
            plus a noun ("she favours her studies"); liking safety first is not
            ranking it against the rest
          prefer: >-
            = to like A more than B, and it needs both options, as in "prefer A to
            B"; "prefer safety above all" names no rival, and "above all" is a
            priority
      - the: She tends to prioritize her studies over socialising.
        syns:
          - prefer
          - favour
          - put first
      - the: The plan is designed to prioritize the most urgent tasks.
        syns:
          - emphasize
          - rank
          - put first
        avoid:
          favour: >-
            = to treat one option as preferable, a matter of taste; a plan has no
            tastes, and what it does here is order the tasks, which needs "rank" or
            "put first"
          prefer: >-
            = to like A more than B, and it needs both options; a plan likes
            nothing, and the urgent tasks are set against no rival, only placed
            first
    syn_notes:
      rank: order by importance
      favour: treat with preference
      emphasize: focus attention on
      put first: make the top priority
      prefer: like better
    syn_near:
      - focus on
      - value
      - promote
      - speed up
    syn_avoid:
      rank: >-
        = to order several items on a scale ("rank them by importance"); with only
        one thing named, as when she prioritizes her studies, there is nothing to
        order, so use put first or prefer
      emphasize: >-
        = to give extra weight to a point in speech or text ("emphasized the
        risks"); it stresses a message instead of choosing between two things, so
        it has no slot for studies over socialising
      favour: >-
        = to prefer one option as a matter of taste, and the frame is a person
        plus a noun ("she favours her studies"); it ranks nothing, so it cannot
        express a plan in which something comes first
      prefer: >-
        = to like A more than B, and it needs both options, as in "prefer A to B"
        or "prefer A over B"; "we must prefer safety above all" is wrong, as no
        rival option and no ranking are given
      focus on: >-
        = a phrasal verb that must take "on" ("focus on the urgent tasks"), so it
        is fine English here, but it narrows attention to one topic instead of
        deciding what comes first in a plan
      value: >-
        = to hold something in high esteem ("we value safety"); it states a
        standing attitude, not a decision to do one thing before another, so
        "value safety above all" praises rather than sequences
      promote: >-
        = to advance someone in rank, or to advertise a product ("promote a new
        line"); it changes status or publicity, whereas here the tasks are only
        being ordered, so nothing is promoted
      speed up: >-
        = to make a process happen faster; nothing here is accelerated, only
        rearranged, and the supervisor who keeps work moving would speed it up
        only in a rush
    syn_nuance: >-
      All of these decide what comes first, but the object differs. Prioritize,
      put first and rank work on a list of jobs and take the item itself
      ("prioritize the urgent tasks"), whereas prefer and favour compare two named
      options ("prefer studies to socialising"), and emphasize only adds weight to
      what you say.
    components:
      - spelling
      - definitions
      - synonyms
  - word: pursue
    ipa: /pəˈsjuː/
    pos: verb
    tip: pur-sue — the 'ue' at the end
    spelling_hint: ""
    definition: To follow or chase; to aim to achieve something.
    example: She decided to pursue a career in science.
    synonyms:
      - chase
      - seek
      - follow
      - strive for
      - aim for
    syn_pos: verb
    syn_example: Pursue / seek / strive for excellence.
    syn_examples:
      - the: She decided to pursue a career in science.
        syns:
          - seek
          - strive for
          - aim for
        avoid:
          chase: >-
            = to run after something in order to catch it ("chase the thief"); a
            career is not run down, so "chase a career" is not English, though
            "chase the suspect" is
      - the: The police decided to pursue the suspect on foot.
        syns:
          - chase
          - follow
        avoid:
          seek: >-
            = to search for something not yet known, and it takes a plain noun
            ("seek advice"); the suspect is already in sight, so the frame is
            "chase" or "follow"
          strive for: >-
            = to strain continuously towards a goal ("strive for excellence"); it
            names the effort, not the tracking here, and "strive for the suspect"
            means trying to catch him
      - the: We will pursue every possible option.
        syns:
          - follow
          - aim for
        avoid:
          chase: >-
            = to run after something in order to catch it; nothing runs here and
            options cannot be caught, though "chase the suspect on foot" is exactly
            right
          seek: >-
            = to search for something not yet known ("seek advice", "seek
            permission"); the options are already listed, so none is being sought,
            and effort is not a hunt
          strive for: >-
            = to strain towards a goal, so it takes "for + noun/gerund"; what is
            meant here is following up each option, not one straining effort at a
            single goal
    syn_notes:
      chase: go after actively
      seek: look for
      follow: go along or after
      strive for: make a strong effort for
      aim for: intend to reach
    syn_near:
      - explore
      - hunt
      - continue
      - proceed with
    syn_avoid:
      chase: >-
        = to run after something in order to catch it ("chase the thief"); it
        needs a physical runner, so "chase a career" is not English, though "chase
        the suspect on foot" is exactly right
      seek: >-
        = to search for something not yet known, and it takes a plain noun ("seek
        advice", "seek permission"); nothing is being searched for in "pursue
        every possible option", and effort is not a hunt
      follow: >-
        = to go after someone ahead of you, or to obey a rule ("follow the
        guidelines"); it presupposes a leader or an instruction, and a career is
        neither, so "follow a career" does not work
      strive for: >-
        = to make a continuous, often strained effort towards a goal ("strive for
        excellence"); it names the effort, not the course of action, and "strive
        for the suspect" would mean aiming to catch him
      aim for: >-
        = to intend to reach a goal, so it stays on the planning side; "the police
        aim for the suspect" means they intend to catch him, while pursuing him
        means actually closing in on him
      explore: >-
        = to look into a subject or travel round a place ("explore the options");
        fine English in the third sentence, but it describes the search itself,
        not a course of action followed through to the end
      hunt: >-
        = to search hard for something hidden or wanted, in the frames "hunt for"
        and "hunt down"; it cannot take a bare career or option, and it adds a
        secretive, aggressive tone
      continue: >-
        = to keep on with an activity already begun ("continue her career");
        pursuing a career means starting one and working towards it, and it fits
        neither the suspect nor a list of options
      proceed with: >-
        = a formal phrasal verb that needs "with" plus a noun or "to" plus a verb;
        it means to go ahead, not to follow something through, and "proceed with
        the suspect" is not English
    syn_nuance: >-
      Pursue means following something through in order to reach or obtain it, and
      it takes that object directly, as in a career, an option or a clue. Seek and
      strive for search or strain towards the goal, aim for states the intention
      only, and follow and chase need someone or something ahead of you.
    components:
      - spelling
      - definitions
      - synonyms
  - word: quarantine
    ipa: /ˈkwɒr.ən.tiːn/
    pos: noun/verb
    tip: quar-an-tine — 'quar', then 'an-tine'
    spelling_hint: ""
    definition: A period of isolation to prevent the spread of disease.
    example: The patient was placed in quarantine.
    synonyms:
      - isolation
      - seclusion
      - lockdown
      - detention
      - confinement
    syn_pos: noun
    syn_example: A period of quarantine / isolation / lockdown.
    syn_examples:
      - the: Travelers were kept in quarantine.
        syns:
          - isolation
          - seclusion
          - confinement
        avoid:
          detention: >-
            = punishment for a minor offence, in the fixed frames "in detention" and
            "a detention centre"; travellers are held to protect public health, so
            the register fails
      - the: The city was placed under quarantine.
        syns:
          - lockdown
          - isolation
          - confinement
        avoid:
          detention: >-
            = punishment for an offence, and it takes a person, so the frame is "in
            detention", never "under detention"; a city is held under "lockdown" or
            "isolation"
    syn_notes:
      isolation: separation from others
      seclusion: being alone or withdrawn
      lockdown: movement restricted for everyone
      detention: held as punishment
      confinement: restricted to a space
    syn_near:
      - curfew
      - embargo
      - blockade
      - custody
    syn_avoid:
      detention: >-
        = punishment for a minor offence, in the fixed frames "in detention" and
        "a detention centre"; holding travellers or a whole city is a
        public-health measure, not a penalty, so the register fails
      lockdown: >-
        = a total restriction on movement for everyone in a place, and it takes
        "under" ("under lockdown"); individual travellers kept apart are being
        isolated, not a population shut in
      seclusion: >-
        = the deliberate privacy of someone who wants to be alone, often religious
        or literary; residents under a citywide order are not secluded by choice,
        and the frame is not "placed under seclusion"
      curfew: >-
        = a rule to be indoors or off the streets by a set hour ("a night curfew",
        "under curfew"); it limits the time of day, not contact between people, so
        it cannot hold travellers apart for infection
      embargo: >-
        = a legal ban on trade or shipping that one state imposes on another ("an
        embargo on trade"); the point of quarantine is stopping transmission
        between people, not stopping goods crossing a border
      blockade: >-
        = a physical or military barrier stopping people or goods entering a
        place; it is a stronger, political act than a health precaution, and
        travellers held at a border are not the blocked party
      custody: >-
        = the legal holding of a person, in the frames "in police custody" and
        "taken into custody"; it implies arrest or a dispute over a child, so
        "kept in custody" loses the health risk entirely
    syn_nuance: >-
      All of these mean being kept apart, but quarantine names the health
      precaution and takes "in" for a person or "under" for a place. Lockdown
      shuts a whole population in, isolation separates a case or group,
      confinement stresses the restricted space, seclusion is a chosen retreat and
      detention is a punishment.
