            to a team is not a broadcast
    syn_notes:
      send: make something go to someone
      pass on: hand along
      convey: communicate or carry
      transfer: move from one to another
      broadcast: send out to many
    syn_near:
      - communicate
      - spread
      - relay
      - forward
      - deliver
    syn_avoid:
      broadcast: >-
        = a mass medium act, sending the same item to a wide audience, with the
        frames broadcast on a station and broadcast to the public; one message to
        a team is not a broadcast
      convey: >-
        = to carry an idea, a feeling or a message in words, so its object must be
        a meaning; it will not carry a signal over a distance or a disease in
        water
      pass on: >-
        = to hand something to the next person, and it is natural for humans
        passing a message; the subject here is a signal or water, which needs a
        more direct verb
      send: >-
        = the plainest verb, and it wants a recipient in a to or for phrase or a
        destination; water does not send anything, and a signal sends itself only
        by a strained metaphor
      transfer: >-
        = to move money, a person or ownership from one holder to another, so it
        needs a from or to pair; a message or a signal has no owner to hand it
        over
      communicate: >-
        = a two-way human act with the frames communicate something to someone and
        communicate with someone; a disease passing through water is not a person
        telling a person
      spread: >-
        = to extend over an area or from person to person, and spread the disease
        is perfectly good English, so it works, but it names the spread rather
        than the carrying
      relay: >-
        = to pass a signal or a message along a chain, at once technical and
        broadcast, and it likes a relay station or a relay from A to B rather than
        a plain subject
      forward: >-
        = the office and email word, and it needs a to addressee; forwarding a
        disease, or a signal across a distance, is not idiomatic English
      deliver: >-
        = to carry and hand over goods, a parcel or a message to a place or a
        person; a signal designed to deliver over long distances loses the sense
        of carrying
    syn_nuance: >-
      Transmit is the general verb for sending a signal, a disease or a message
      along a route, and it accepts all three. Send wants a recipient, broadcast
      an audience, convey a meaning and transfer an owner, while pass on belongs
      to people handing something along. The subject and the object decide, so a
      signal transmits and a team receives.
