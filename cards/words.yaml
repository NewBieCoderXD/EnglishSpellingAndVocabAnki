        syns:
          - send
          - transfer
          - broadcast
        avoid:
          convey: >-
            = to carry an idea, a feeling or a message in words, so its object must
            be a meaning; here the verb takes no object at all, only over long
            distances, and a signal carries no sense
      - the: Water can transmit the disease.
        syns:
          - pass on
          - transfer
        avoid:
          convey: >-
            = to carry an idea, a feeling or a message in words, so its object must
            be a meaning; a disease is a physical agent, not a sense, and what water
            does here is move a germ
          broadcast: >-
            = a mass medium act, sending the same item to a wide audience
            ("broadcast on a station"); water is not a station and nobody chooses to
