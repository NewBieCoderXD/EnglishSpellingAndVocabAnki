  - word: good
    ipa: /ɡʊd/
    pos: adjective
    tip: good — short oo /ʊ/; one word you can spell
    spelling_hint: ""
    definition: Of high quality; beneficial; satisfactory.
    example: She gave a good answer.
    synonyms:
      - beneficial
      - advantageous
      - favourable
      - positive
      - effective
    syn_pos: adjective
    syn_example: '"Beneficial" is perfect for argumentative essays.'
    syn_id: good
    syn_examples:
      - the: The medicine is good at treating the infection.
        syns:
          - effective
          - beneficial
        avoid:
          advantageous: >-
            = giving you a better position than an alternative, so the frame is
            "advantageous to + -ing" or "advantageous for + noun"; a medicine has no
            rival to beat here, it simply works, so use effective
          favourable: >-
            = showing approval, or giving someone an advantage, so it describes a
            response or a set of terms (a favourable reaction); a medicine that
            cures is effective, not favourable
      - the: The feedback from my manager was very good.
        syns:
          - positive
          - favourable
        avoid:
          advantageous: >-
            = giving you a better position than an alternative, so the frame is
            "advantageous to + -ing" or "advantageous for + noun"; feedback is an
            opinion on your work, not a better position
          effective: >-
            = producing the result you want, so it describes a method, a medicine or
            a policy (an effective treatment); feedback is an opinion on your work,
            not a result that comes out of a method
      - the: Regular exercise is good for your health.
        syns:
          - beneficial
          - advantageous
          - positive
        avoid:
          favourable: >-
            = showing approval, or giving someone an advantage (a favourable
            reaction, favourable terms); the frame is "good for + your health", and
            exercise is not a response or a set of terms
          effective: >-
            = producing the result you want (an effective treatment), and good
            English; but the frame here is "good for + your health", which credits a
            benefit, and only "effective in + -ing" would fit it
    syn_notes:
      beneficial: has a good effect
      advantageous: helps your advantage
      favourable: supportive, giving an advantage
      positive: good, welcome
      effective: works well
    syn_near:
      - healthy
      - useful
      - great
      - superior
      - satisfactory
    syn_avoid:
      beneficial: >-
        = producing a good result for someone, and it needs a beneficiary
        ("beneficial to health"): feedback is not a thing that benefits, so it has
        nobody to benefit
      advantageous: >-
        = giving you a better position than an alternative, so it takes
        "advantageous to + -ing" or "advantageous for + noun": a medicine or a
        habit has no rival to beat
      favourable: >-
        = showing approval, or giving someone an advantage ("a favourable
        reaction", "favourable terms"): it describes a response or a deal, so it
        fits the feedback but not the medicine
      positive: >-
        = showing approval or a gain, and it wants a sign, a trend or a result ("a
        positive response"): a medicine working well is a matter of effectiveness,
        not positivity
      effective: >-
        = producing the result you want, so it describes a method, medicine or
        policy ("an effective treatment"): feedback is not something a result can
        come out of
      healthy: >-
        = in good condition itself, as in a healthy diet or healthy children: it
        names the subject's own state, so "healthy for your health" doubles the
        frame
      useful: >-
        = able to be used, and it takes "useful for + noun" or "useful to + noun":
        "useful at + -ing" is the trap here, because the set phrase is "good at"
      great: >-
        = informal and emphatic, and it resists the double marking of "very": say
        really great, since "very great feedback" sounds odd in a formal report
      superior: >-
        = better than something else, so it needs "superior to + noun": the
        medicine cannot be superior at treating when no second medicine is named
      satisfactory: >-
        = only good enough to pass a test ("a satisfactory result"): it sets a low
        bar and belongs in reports about a product, not in praise of feedback
    syn_nuance: >-
      Good is the plain word, and the family says which kind of good is meant.
      Beneficial needs a beneficiary, so it is good for or good to; effective
      needs a result, so it describes a method, medicine or policy; favourable and
      positive belong to reactions and reviews; advantageous compares you with an
      alternative.
    components:
      - synonyms
  - word: big
    ipa: /bɪɡ/
    pos: adjective
    tip: big — three letters, no trap
    spelling_hint: ""
    definition: Large in size, amount, degree or importance.
    example: They live in a big house.
    synonyms:
      - large
      - huge
      - massive
      - substantial
      - considerable
      - enormous
      - significant
      - tremendous
    syn_pos: adjective
    syn_example: '"A substantial rise" / "tremendous growth" read far better than "A big rise".'
    syn_id: big
    syn_examples:
      - the: A big crowd gathered outside the stadium.
        syns:
          - large
          - huge
          - massive
          - enormous
        avoid:
          considerable: >-
            = fairly large in degree, the word for gaps and amounts (a considerable
            difference); a crowd is counted with large, huge or enormous, not with a
            word about degree
          substantial: >-
            = large in amount, weight or value, and it wants a countable sum (a
            substantial increase); a crowd of unnamed people is not substantial, it
            is simply large or huge
          tremendous: >-
            = extremely good or extremely big, with a strong charge of excitement (a
            tremendous success); a crowd outside a stadium is described by size, and
            that excitement does not belong here
      - the: There is a big difference between the two plans.
        syns:
          - substantial
          - considerable
          - significant
        avoid:
          tremendous: >-
            = extremely good or extremely big, with a strong charge of excitement (a
            tremendous success); the frame is "a big difference between + two
            nouns", a measured gap, so the excitement does not fit
          enormous: >-
            = extremely big, and it is at home with physical scale, as in an
            enormous hall; it sounds clumsy before the abstract noun difference, so
            use substantial, considerable or significant
          large: >-
            = the neutral size word, and it takes a countable noun (a large crowd);
            a difference has no physical size, so "a big difference between + X and
            Y" needs substantial or significant
          massive: >-
            = huge and solid, often of weight or structure (a massive wall, massive
            data); the frame is "a big difference between + two plans", and massive
            wrongly suggests something physically heavy
      - the: This is a big opportunity for our company.
        syns:
          - significant
          - tremendous
          - huge
        avoid:
          considerable: >-
            = fairly large in degree, and the frame is "a considerable difference";
            an opportunity has no measurable degree, so the word here is significant
            or huge
          substantial: >-
            = large in amount, weight or value, and it wants a countable sum (a
            substantial increase); an opportunity has no measurable amount, so
            the word here is significant or huge
          enormous: >-
            = extremely big, and it is at home with physical scale, as in an
            enormous hall; the frame is "a big opportunity for + noun", and enormous
            sounds clumsy before that abstract noun
          large: >-
            = the neutral size word, and it takes a countable noun (a large crowd);
            an opportunity has no physical size either, and the word for one here is
            significant or huge
          massive: >-
            = huge and solid, often of weight or structure (a massive wall, massive
            data); the frame is "a big opportunity for + noun", and massive wrongly
            suggests something physically heavy or solid
    syn_notes:
      large: big in size
      huge: very big
      massive: very big and solid
      substantial: large in amount or value
      considerable: quite large
      enormous: extremely big
      significant: notably big
      tremendous: amazingly big
    syn_near:
      - great
      - grand
      - broad
      - overwhelming
      - gigantic
    syn_avoid:
      large: >-
        = the neutral size word, and it takes a countable noun ("a large crowd"):
        a difference or an opportunity has no physical size, so use substantial or
        significant there
      huge: >-
        = a simple intensifier meaning extremely big, natural before a countable
        object: it suits the crowd and even "a huge opportunity", but not the gap
        between two plans
      massive: >-
        = huge and solid, often of weight or structure ("a massive wall", "massive
        data"): it wrongly suggests something physically heavy where a gap is
        measured
      enormous: >-
        = extremely big, and it is at home with physical scale, as in an enormous
        hall: it sounds clumsy before an abstract noun like opportunity or
        difference
      substantial: >-
        = large in amount, weight or value, and it wants a countable sum ("a
        substantial increase"): a crowd of unnamed people is not substantial, but
        a substantial difference is
      considerable: >-
        = fairly large in degree, the word for gaps and amounts ("a considerable
        difference"): a crowd is sized with large or huge, not with a word about
        degree
      significant: >-
        = large enough to matter, so it is a word about importance ('a
        significant opportunity'); it carries no physical size, so a crowd
        here is large, huge or massive
      tremendous: >-
        = extremely good or extremely big, with a strong charge of excitement ("a
        tremendous success"): that emotion does not belong in a description of a
        crowd or a gap
      great: >-
        = an informal intensifier fixed in the patterns a great + noun and a great
        deal of: it works for an opportunity, but a gap or a counted crowd needs a
        size or degree word
      grand: >-
        = splendid and majestic, the register of ceremonies ("a grand entrance",
        "a grand occasion"): it praises style rather than quantity, so it never
        measures a crowd
      broad: >-
        = wide, and it describes outline, range or scope ("a broad outline",
        "broad agreement"): it cannot measure a countable crowd or the size of a
        gap between two plans
      overwhelming: >-
        = so great that you are swamped by it, and it takes an uncountable amount
        ("an overwhelming amount of work"): nobody is swamped by a crowd or by a
        gap
      gigantic: >-
        = a plain intensifier for very large, and it wants a concrete countable
        noun ("a gigantic machine"): it is too bulky before an abstract noun like
        opportunity or difference
    syn_nuance: >-
      Big is the everyday word and covers size and importance alike, while the
      family sorts by what is measured. Physical size takes large, huge, massive
      and enormous with count nouns such as a crowd. Amount takes substantial and
      considerable with a difference or a sum, importance takes significant, and
      tremendous adds excitement.
    components:
      - synonyms
  - word: happy
    ipa: /ˈhæp.i/
    pos: adjective
    tip: hap-py — double p, two syllables
    spelling_hint: ""
    definition: Feeling or showing pleasure or contentment.
    example: The children look happy.
    synonyms:
      - glad
      - pleased
      - delighted
      - content
      - joyful
    syn_pos: adjective
    syn_example: '"Delighted" is stronger than "happy"; "content" is a calmer, lasting happiness.'
    syn_id: happy
    syn_examples:
      - the: I am happy to hear you got the job.
        syns:
          - glad
          - delighted
        avoid:
          joyful: >-
            = full of visible joy, the word for an occasion or a person (a joyful
            celebration); the frame is "happy to + verb", a quiet reaction to news,
            and "I am joyful to hear" is bookish
          pleased: >-
            = satisfied with a result, and "I am pleased to hear you got the job" is
            good English, but it is more formal and more about satisfaction than the
            plain feeling here
      - the: She was very happy with her exam results.
        syns:
          - pleased
          - delighted
          - content
        avoid:
          joyful: >-
            = full of visible joy, the word for an occasion or a person (a joyful
            celebration); the frame is "happy with + noun", a private feeling, and
            "joyful with" is not a pairing English uses
          glad: >-
            = pleased about one piece of news; it takes glad to + verb or glad that,
            and it never takes the preposition with, so very glad with her exam
            results is wrong
      - the: After years of stress, he finally felt happy.
        syns:
          - content
          - joyful
        avoid:
          pleased: >-
            = satisfied with a result, so it wants a with-phrase or a to + -ing
            (pleased with her results); "he finally felt pleased" has nothing to be
            satisfied about, and content fits that calm feeling
          glad: >-
            = pleased about one piece of news, and the frame is "glad to + verb" or
            "glad that + clause"; "he finally felt glad" has no news and no
            that-clause to be glad about, so use content
    syn_notes:
      glad: pleased about something
      pleased: satisfied, happy
      delighted: very happy
      content: calmly satisfied
      joyful: full of joy
    syn_near:
      - satisfied
      - cheerful
      - elated
      - merry
      - overjoyed
    syn_avoid:
      glad: >-
        = pleased about one piece of news; it takes glad to + verb or glad that,
        and it never takes the preposition with, so very glad with her exam
        results is wrong.
      pleased: >-
        = satisfied with a result, so pleased with her exam results works; it is
        good English in I am pleased to hear, but more formal and more about
        satisfaction than about feeling happy.
      content: >-
        = calmly satisfied, and it takes content with; it names a settled, quiet
        state, so it does not fit the warm reaction in I am happy to hear you got
        the job.
      delighted: >-
        = very pleased, and almost always about one specific good event, so it
        needs delighted with or delighted to + verb; the general wellbeing of felt
        happy after years of stress is too broad.
      joyful: >-
        = full of visible joy, and it usually describes an occasion or a person (a
        joyful celebration); it is bookish for I am joyful to hear and wrong for a
        private feeling.
      satisfied: >-
        = content with a result, and it needs satisfied with; it names contentment
        with an outcome, not the general wellbeing of after years of stress, he
        finally felt happy.
      cheerful: >-
        = habitually merry, a lasting trait of a person or a tone (a cheerful
        colleague); it does not describe a private reaction to news or to exam
        results.
      elated: >-
        = extremely happy, usually for a moment and rather literary; far too
        strong for the plain state of very happy with her exam results or of felt
        happy after stress.
      merry: >-
        = festive and jolly, and now literary or confined to set phrases like
        merry Christmas and a merry crowd; it cannot describe one person's private
        feeling.
      overjoyed: >-
        = wild with joy, stronger and more emotional than these frames allow; it
        wants a named cause and is too extreme for happy to hear or happy with a
        result.
    syn_nuance: >-
      All five name a positive feeling, but the frame decides. Glad and delighted
      attach to news (glad to hear, delighted with the result), pleased and
      content take with (pleased with your marks, content with what you have), and
      content and joyful are calm settled states, not reactions, so felt happy
      after stress takes those two.
    components:
      - synonyms
  - word: important
    ipa: /ɪmˈpɔː.tənt/
    pos: adjective
    tip: im-por-tant — 'por', then 'tant'
    spelling_hint: ""
    definition: Of great significance or value; mattering a lot.
    example: This is an important decision.
    synonyms:
      - significant
      - crucial
      - vital
      - essential
      - key
    syn_pos: adjective
    syn_example: Instead of "very important", write "crucial" / "vital" in essays.
    syn_id: important
    syn_examples:
      - the: It is important that we reach a decision today.
        syns:
          - crucial
          - vital
          - essential
      - the: Diet is important in heart disease.
        syns:
          - significant
          - key
          - crucial
    syn_notes:
      significant: notably important
      crucial: make-or-break
      vital: essential for life
      essential: absolutely necessary
      key: central, most important
    syn_near:
      - major
      - notable
      - central
      - prime
      - serious
    syn_avoid:
      vital: >-
        = needed to keep something alive or working, so it takes vital to or vital
        for (vital to recovery); too absolute and too biological for the general
        frame Diet is important in heart disease.
      essential: >-
        = absolutely necessary, pointing at something you cannot do without; too
        strong for important in heart disease, which reports a contribution, not a
        requirement.
      significant: >-
        = large enough to matter, and it wants a measurable result (a significant
        increase, significant differences), so it says nothing about importance,
        and the frame significant that we decide is wrong.
      key: >-
        = the single most important of a set, so it usually needs a countable noun
        (a key factor) or key to; it ranks items and cannot fill the plain
        predicate before that ...
      major: >-
        = big in size, scope or amount, so it needs a countable noun (a major
        factor); it measures scale, not importance, and major in heart disease is
        not English.
      notable: >-
        = worth noticing, clearly weaker than important, and it needs notable for
        or a countable noun (a notable change); too faint for the it is ___ that
        frame.
      central: >-
        = at the centre of something, so its frame is central to the argument; it
        does not work as a plain predicate before that or in the topic frame
        important in heart disease.
      prime: >-
        = the single main one of its kind, and it needs a countable noun (prime
        example, prime target); it cannot stand before that, so it is prime that
        we decide today is not English.
      serious: >-
        = not trivial or not joking, and it takes serious about or a countable
        noun (a serious illness); it is serious that we decide today is not
        idiomatic English.
    syn_nuance: >-
      Importance is a scale. Crucial, vital and essential say the outcome depends
      on it, with vital and essential adding that you cannot do without it, so
      they take it is ___ that we decide. Significant reports a large effect and
      key names the single most important of a set, which is why both are taken in
      Diet is ___ in heart disease.
    components:
      - synonyms
  - word: problem
    ipa: /ˈprɒb.ləm/
    pos: noun
    tip: prob-lem — 'prob', then 'lem'
    spelling_hint: ""
    definition: A matter or situation regarded as unwelcome or harmful.
    example: We need to solve this problem.
    synonyms:
      - issue
      - challenge
      - difficulty
      - obstacle
      - drawback
    syn_pos: noun
    syn_example: '"Drawback" suits essays: "The main drawback is the cost."'
    syn_id: problem
    syn_examples:
      - the: Traffic is a serious problem in most big cities.
        syns:
          - issue
          - challenge
          - difficulty
        avoid:
          drawback: >-
            = a disadvantage attached to a plan or product, so the frame is "the
            main drawback of + -ing"; traffic as a problem has no alternative or
            advantage to weigh it against
      - the: The main problem is a lack of funding.
        syns:
          - difficulty
          - obstacle
          - drawback
        avoid:
          issue: >-
            = a topic or matter under discussion, the neutral word in business
            English; too bland for the main problem is a lack of funding, which
            names a fault, though "funding is an issue" fits elsewhere
      - the: Finding affordable housing can be a problem.
        syns:
          - challenge
          - difficulty
          - obstacle
        avoid:
          drawback: >-
            = a disadvantage attached to a plan or product, so the frame is "the
            main drawback of + -ing"; "can be a problem" is used on its own here,
            with no other option to set the drawback against
          issue: >-
            = a topic or matter under discussion, the neutral word in business
            English; the frame is "can be a + noun" about finding housing, and an
            issue is a topic, not a fault or a piece of trouble
    syn_notes:
      issue: a topic or problem
      challenge: a task that tests ability
      difficulty: trouble
      obstacle: a barrier
      drawback: a disadvantage
    syn_near:
      - trouble
      - flaw
      - dilemma
      - worry
      - snag
    syn_avoid:
      issue: >-
        = a topic or matter under discussion, the neutral word in business
        English; too bland for the main problem is a lack of funding, which names
        a fault, and housing can be an issue in other writing.
      challenge: >-
        = a task that tests your ability, usually positive; it needs a challenge
        of doing something, and it cannot name the main fault here, where the
        point is what is broken, not what tests you.
      obstacle: >-
        = a barrier that blocks progress, so it needs a noun of movement (an
        obstacle to progress); too narrow for traffic in general or for a shortage
        of money, which is not something you must get past.
      drawback: >-
        = a disadvantage attached to a plan or product, so the frame is the main
        drawback of X is ...; the sentences contain no option or advantage to set
        the disadvantage against.
      trouble: >-
        = difficulty in general, and it is uncountable (have trouble finding); too
        vague for a serious problem in most big cities, which names a named fault
        of a system.
      flaw: >-
        = a defect in how something is made, so it needs a flaw in the design;
        traffic and a lack of funding are not defects in an object, and a problem
        can be a shortage rather than a fault.
      dilemma: >-
        = a hard choice between two options, and it needs a dilemma about or a
        dilemma for; the three sentences describe a fault, not a decision to be
        made.
      worry: >-
        = something that causes anxiety, and it takes a worry about or a worry
        for; it frames the trouble as a person's unease, while these sentences
        state an objective fault.
      snag: >-
        = a small unexpected obstacle, and it is informal; far too minor for a
        serious problem in most big cities, where the fault is large and
        structural.
    syn_nuance: >-
      Problem is the general word and the others narrow it. Difficulty is trouble
      in doing something, obstacle is a barrier to progress, issue is the neutral
      topic word, challenge frames a task as a test, and drawback is a
      disadvantage of a choice, so a lack of funding takes obstacle or drawback,
      while traffic takes issue or difficulty.
    components:
      - synonyms
  - word: many
    ipa: /ˈmen.i/
    pos: determiner
    tip: many — the 'a' sounds like an 'e'
    spelling_hint: ""
    definition: A large number of; numerous.
    example: Many people agreed.
    synonyms:
      - numerous
      - countless
      - plenty of
      - a wide range of
      - a variety of
    syn_pos: determiner
    syn_example: '"Numerous studies show..." is more formal than "Many studies show...".'
    syn_id: many
    syn_examples:
      - the: Many studies support this conclusion.
        syns:
          - numerous
          - countless
        avoid:
          a wide range of: >-
            = a broad, varied selection, and it needs a countable plural (a wide
            range of activities); the frame is "Many studies support + noun", where
            only the number matters, not how varied they are
      - the: The town offers many activities for visitors.
        syns:
          - a wide range of
          - a variety of
          - numerous
          - plenty of
        avoid:
          countless: >-
            = too many to count, which is emphatic and not always literally
            true; 'countless activities' is grammatical, but it overstates the
            plain count of 'many activities' or 'many studies'
      - the: There are many reasons to be optimistic.
        syns:
          - plenty of
          - numerous
          - a variety of
        avoid:
          a wide range of: >-
            = a broad, varied selection, and it needs a countable plural (a wide
            range of activities); the frame is "There are many reasons to + verb",
            which counts reasons and stresses no kinds
          countless: >-
            = too many to count, which is dramatic and not always true; the frame is
            "There are many reasons to + verb", a neutral count, so countless
            oversells what may be only a handful of good reasons
    syn_notes:
      numerous: very many
      countless: too many to count
      plenty of: abundant
      a wide range of: a broad set of
      a variety of: different kinds of
    syn_near:
      - several
      - a few
      - much
      - lots of
      - various
    syn_avoid:
      countless: >-
        = too many to count, which is emphatic and not always literally true;
        'countless activities' is grammatical, but it overstates the plain
        count of 'many activities' or 'many studies'
      plenty of: >-
        = a large amount, informal for study English; plenty of studies is
        grammatical but too chatty for Many studies support this conclusion, where
        a formal determiner is wanted.
      a wide range of: >-
        = a broad, varied selection, and it needs a countable plural (a wide range
        of activities); it stresses how different the items are, so it is wrong
        for Many studies, where only the number matters.
      a variety of: >-
        = several different kinds, so it stresses variety, not a large number; it
        is good English for many activities, but a variety of studies would
        suggest mixed kinds rather than a large number of them.
      several: >-
        = more than two or three but not many, and it takes a countable plural
        noun (several studies); too small for Many studies support this conclusion
        and for many activities.
      a few: >-
        = a small number, and it takes a countable plural noun; sometimes it means
        almost none, so it is the opposite of many and can never stand in for it
        in many reasons to be optimistic.
      much: >-
        = a large amount, and it takes only uncountable nouns; many activities and
        many reasons are countable plurals, so much fails both of those frames.
      lots of: >-
        = informal, and in the main it goes with uncountables (lots of time); it
        is too chatty for the formal Many studies and it hides the countable
        plural that many needs before activities.
      various: >-
        = different from one another, so it stresses variety and takes a countable
        plural noun (various activities); it says nothing about how many there
        are, which is all that many does.
    syn_nuance: >-
      Many counts countable plurals. Numerous and countless are adjectives;
      countless adds drama. Plenty of, a wide range of and a variety of are
      phrases that can go with uncountables but bring amount or variety, so many
      activities takes them, while Many studies stresses quantity and does not.
    components:
      - synonyms
  - word: increase
    ipa: /ɪnˈkriːs/
    pos: verb
    tip: in-crease — the 'ea' = /iː/
    spelling_hint: ""
    definition: To become or make something greater in size, amount or degree.
    example: Prices continue to increase.
    synonyms:
      - rise
      - grow
      - surge
      - climb
      - escalate
      - rocket
    syn_pos: verb
    syn_example: '"Sales surged in 2024" or "prices rocketed" — vivid verbs for IELTS task 1.'
    syn_id: increase
    syn_examples:
      - the: Prices tend to increase during the winter.
        syns:
          - rise
          - climb
          - surge
          - rocket
        avoid:
          escalate: >-
            = get steadily worse, the word for conflict, crime or prices someone has
            deliberately raised; "prices tend to escalate" blames a decision and is
            far too strong for a seasonal drift
      - the: Demand for clean energy continues to increase.
        syns:
          - grow
          - rise
          - surge
          - climb
        avoid:
          escalate: >-
            = get steadily worse, normally conflict, crime or prices a supplier has
            raised; "demand continues to escalate" reads as a hostile build-up, not
            growth in a market report
          rocket: >-
            = shoot up in a sudden leap, far too big for a trend that simply
            continues; "demand continues to rocket" also fights the plain present
            perfect of "continues to increase"
      - the: Tensions between the two nations may increase.
        syns:
          - escalate
          - rise
          - grow
        avoid:
          rocket: >-
            = shoot up in a sudden leap, and it wants an agent doing the shooting;
            "tensions may rocket" has nobody to fire them up and the modal may makes
            the leap impossible
    syn_notes:
      rise: go up
      grow: become larger
      surge: jump suddenly and strongly
      climb: rise gradually
      escalate: increase steadily (often bad)
      rocket: increase very fast
    syn_near:
      - raise
      - boost
      - soar
      - expand
      - improve
    syn_avoid:
      grow: >-
        = become larger or more numerous, the word for output or demand; after
        prices it needs a countable or mass noun, and the general term for figures
        going up is rise.
      escalate: >-
        = get steadily worse, usually conflict, crime or prices someone has
        raised; too negative and too transitive in business for prices tend to
        escalate or demand continues to escalate.
      surge: >-
        = jump up suddenly and sharply, so it needs a one-off event; it cannot
        describe the winter pattern that repeats in Prices tend to increase, and
        it is too violent for tensions may increase.
      climb: >-
        = go up gradually, and it wants a hill, a ladder or a line of figures;
        prices tend to climb and tensions may climb are not the natural verb
        choices here, and it is too physical for demand.
      rocket: >-
        = shoot up extremely fast in a sudden leap; far too strong for the gentle
        seasonal rise in prices, and rocket cannot sit with the modal may in
        tensions may increase.
      raise: >-
        = transitive, so a subject has to raise something (raise prices, the city
        raised prices); the three frames need an intransitive verb after prices,
        demand and tensions.
      boost: >-
        = lift a figure, transitive and businessy (boost sales); it needs an
        object, so it cannot stand after prices tend to or after tensions may
        increase.
      soar: >-
        = rise very steeply, and it is stronger than increase; prices tend to soar
        says the opposite of a steady, moderate winter rise, and soar suits a
        sudden jump in a figure.
      expand: >-
        = grow in size or spread into new areas, and it usually needs an object or
        expand into; it measures extent, not the level of a figure, so it cannot
        replace increase here.
      improve: >-
        = get better in quality, and it takes improve on or an object; more demand
        is not the same as better demand, so demand continues to improve would
        mean something else entirely.
    syn_nuance: >-
      All are intransitive verbs of going up, differing by speed and subject.
      Prices and demand take rise or climb for a gradual trend and surge or rocket
      for a sudden jump; grow fits a quantity that becomes more numerous; escalate
      is reserved for a worsening situation, so tensions take escalate, rise or
      grow, not the others.
    components:
      - synonyms
  - word: increase
    ipa: /ˈɪn.kriːs/
    pos: noun
    tip: IN-crease — noun stress on the first syllable
    spelling_hint: ""
    definition: An act of becoming greater in size, amount or degree.
    example: There was an increase in sales.
    synonyms:
      - rise
      - growth
      - surge
      - upsurge
      - uptick
    syn_pos: noun
    syn_example: '"There was a sharp rise in sales" — noun usage: the + rise/surge/uptick.'
    syn_id: increase-noun
    syn_examples:
      - the: There has been a sharp increase in prices.
        syns:
          - rise
          - surge
          - uptick
        avoid:
          growth: >-
            = a continuous rise in size, the word for population or the economy's
            long trend, so it takes "growth in population"; "a sharp growth in
            prices" implies a slow build-up, not one recent jump
          upsurge: >-
            = a sudden upward jump in a level, usually "an upsurge in demand"; it is
            wordy beside "a sharp increase in prices" and the sentence already
            carries "sharp"
      - the: The city saw a steady increase in population.
        syns:
          - growth
          - upsurge
          - rise
      - the: We noted an increase in sales this quarter.
        syns:
          - uptick
          - rise
          - surge
        avoid:
          growth: >-
            = a continuous rise in size over years, so it collocates with "growth in
            population" or a sector's growth, not one quarter's figure; "a growth in
            sales this quarter" is not how a report speaks
          upsurge: >-
            = a sudden jump in a level, formally "an upsurge in demand"; too wordy
            for the plain "an increase in sales", and a quarter's result is not a
            sudden leap
    syn_notes:
      rise: the act of rising
      growth: a continuous increase
      surge: a sudden big increase
      upsurge: a sudden jump in level
      uptick: a small improvement in a trend
    syn_near:
      - improvement
      - expansion
      - jump
      - inflation
      - hike
    syn_avoid:
      growth: >-
        = a continuous rise in size or amount, which takes growth in population
        and fits the steady frame; it means the scale is increasing, not that a
        particular value has risen in a short report.
      surge: >-
        = a sudden large jump, so it cannot carry the steady in a steady increase
        in population; an increase in sales this quarter is a neutral report, not
        a spike, although a surge in sales is good English.
      upsurge: >-
        = a sudden upward movement in a level, and it takes an upsurge in demand;
        too dramatic and too wordy for the neutral an increase in sales, and the
        steadiness of the population frame rules it out.
      uptick: >-
        = a small positive turn in a trend, and it needs an uptick in sales; the
        sharp in a sharp increase in prices is the wrong size, and an uptick does
        not suit a long population series.
      improvement: >-
        = a change for the better in quality, and it needs an adjective or an
        improvement in; it names a better state, not simply a higher number, so an
        increase in sales is not an improvement.
      expansion: >-
        = a growth in size or scope, and it takes an expansion of or a plural (an
        expansion of the market); it measures extent, so it cannot fill an
        increase in sales or in prices.
      jump: >-
        = a move from one value to another, and it needs a from ... to ... frame
        with numbers (a jump from 5% to 8%); an increase in sales names no
        starting point, so jump is wrong there.
      inflation: >-
        = a sustained general rise in the price level of a whole economy, and it
        is uncountable with no number or adjective before it; far too specific for
        an increase in population or in sales.
      hike: >-
        = an informal word for a sudden rise in price (a price hike), and it is
        countable; too chatty and too narrow for the report style of We noted an
        increase in sales this quarter.
    syn_nuance: >-
      All are countables for a higher level, differing in size and speed. Rise is
      neutral, growth suits a long process in size or number, surge and upsurge
      need a sudden jump, and uptick is a small positive turn, so a sharp increase
      takes rise, surge or uptick, a steady increase takes growth.
    components:
      - synonyms
  - word: decrease
    ipa: /dɪˈkriːs/
    pos: verb
    tip: de-crease — the 'ea' = /iː/
    spelling_hint: ""
    definition: To become or make something smaller in size, amount or degree.
    example: Costs should decrease next year.
    synonyms:
      - decline
      - drop
      - fall
      - reduce
      - diminish
    syn_pos: verb
    syn_example: '"Unemployment fell steadily" — verb usage; "plummet" adds emphasis.'
    syn_id: decrease
    syn_examples:
      - the: Sales continue to decrease every quarter.
        syns:
          - decline
          - fall
          - drop
      - the: We must decrease our use of plastic.
        syns:
          - reduce
          - diminish
    syn_notes:
      decline: go down gradually
      drop: go down suddenly
      fall: go down
      reduce: make less
      diminish: become less
    syn_near:
      - lower
      - cut
      - lessen
      - slump
      - ease
    syn_avoid:
      decline: >-
        = go down gradually on its own, which fits the sales series; but it cannot
        act on an object, so it fails the deliberate policy act of we must
        decrease our use of plastic.
      reduce: >-
        = make less, and it is transitive, so it needs an object (reduce plastic
        use); sales cannot reduce themselves, so it fails the intransitive frame
        Sales continue to decrease every quarter.
      diminish: >-
        = become or make less, mainly of quality, importance or numbers, and it is
        formal; too vague and too high-register for our use of plastic, which
        names a measurable quantity.
      drop: >-
        = go down suddenly, and it needs a number or a scale; sales drop every
        quarter is possible but too abrupt for a steady series, and it is
        intransitive, so it cannot take our use of plastic.
      fall: >-
        = go down, intransitive, and it fits the sales series; it cannot act on
        the object in we must decrease our use of plastic, and a fall in prices is
        good English but needs a subject, not an object.
      lower: >-
        = transitive, so a subject lowers a figure (lower our use of plastic);
        that is fine in the policy frame, but sales continue to lower is
        impossible, since it needs an object.
      cut: >-
        = transitive and blunt, and it mainly goes with costs, prices or jobs (cut
        our use of plastic); it is too casual and too much about a decision for a
        neutral policy report.
      lessen: >-
        = make smaller, transitive and formal, and it usually takes risks or
        effects (lessen the risk); it cannot stand after sales continue to and it
        is too high-register for plastic use.
      slump: >-
        = fall steeply and suddenly, intransitive and dramatic; a slump suggests a
        collapse, far stronger than the gradual quarterly fall in Sales continue
        to decrease every quarter.
      ease: >-
        = become less intense, and it needs ease off or a noun (ease the
        pressure); decrease our use of plastic needs a verb with a direct object,
        and ease does not take one in that frame.
    syn_nuance: >-
      The family splits by transitivity as much as by speed. Decline, drop and
      fall are intransitive and take sales or prices as their subject, while
      reduce and diminish are transitive and need an object, which is why we must
      decrease our use of plastic takes reduce, not fall. Drop is sudden, decline
      steady, and diminish is formal.
    components:
      - synonyms
  - word: decrease
    ipa: /ˈdiː.kriːs/
    pos: noun
    tip: DE-crease — noun stress on the first syllable
    spelling_hint: ""
    definition: An act of becoming smaller in size, amount or degree.
    example: There was a decrease in output.
    synonyms:
      - decline
      - drop
      - fall
      - reduction
      - dip
    syn_pos: noun
    syn_example: '"A steady decline in unemployment" — noun usage; "dip" is temporary and slight.'
    syn_id: decrease-noun
    syn_examples:
      - the: There was a 5% decrease in sales.
        syns:
          - decline
          - drop
          - fall
          - reduction
          - dip
      - the: A decrease in funding would harm research.
        syns:
          - reduction
          - decline
          - drop
      - the: The chart shows a slight decrease in demand.
        syns:
          - dip
          - decline
          - fall
    syn_notes:
      decline: a gradual downward move
      drop: a sudden decrease
      fall: a decrease
      reduction: making less
      dip: a small, slight decrease
    syn_near:
      - cut
      - loss
      - shortfall
      - slump
    syn_avoid:
      drop: >-
        = a sudden, often large fall, and it wants a figure or a scale (a 5% drop
        in sales); that clashes with the small size of a slight decrease in
        demand, though a sharp drop in demand is good English.
      dip: >-
        = a small, short fall in a trend, and it collocates with prices, demand
        and confidence; a dip in funding is possible but suggests a blip, whereas
        the sentence means a lasting cut in money.
      fall: >-
        = a plain word for a lower level, and it takes a fall in demand, which
        fits the chart frame; in the funding frame the sentence describes a
        deliberate cut, and a fall in funding sounds like a collapse.
      reduction: >-
        = the act of making something less, so it takes a reduction in funding,
        which fits the money frame; in the chart frame the noun names the smaller
        quantity itself, not the act, so slight clashes.
      cut: >-
        = an informal countable reduction, and it needs a following in or of (a
        cut in funding); it is too chatty and too much about a decision for the
        neutral frame A decrease in funding would harm research.
      loss: >-
        = the fact of losing something, and it takes a loss in sales; it suggests
        something is gone for good, so a 5% decrease is not a loss, and a slight
        decrease is far too small for it.
      shortfall: >-
        = the gap between an actual figure and a target, so it needs a number or a
        mention of the target (a shortfall of 3 million); a slight decrease in
        demand says nothing about any target.
      slump: >-
        = a steep, dramatic fall, and it takes a slump in sales or in demand; it
        is far too strong for a 5% decrease in sales and for the slight decrease
        shown on a chart.
    syn_nuance: >-
      All these countables name a lower level, and the frame fixes the size.
      Decline is the neutral or gradual one, drop is sudden, fall is a plain word
      that also takes figures and slight, reduction names the act of making less
      so it wants a funding frame, and dip is a small blip, so the chart frame
      takes dip, decline or fall, not drop.
    components:
      - synonyms
  - word: accommodation
    ipa: /əˌkɒm.əˈdeɪ.ʃən/
    pos: noun
    tip: two <b>c</b>'s, two <b>m</b>'s — ac<b>co</b>-mmo-dation
    spelling_hint: ""
    definition: A place to live, work or stay in; a room or building used as temporary residence.
    example: Accommodation in the city centre is expensive.
    synonyms:
      - housing
      - lodging
      - quarters
      - shelter
      - residence
    syn_pos: noun
    syn_example: '"Affordable accommodation" — housing / lodging / shelter read well in task 1 reports and city essays.'
    syn_examples:
      - the: Accommodation in the city centre is expensive.
        syns:
          - housing
          - lodging
          - residence
        avoid:
          quarters: >-
            = space allotted to a group such as staff or soldiers, and the set
            phrase is "living quarters"; "quarters in the city centre" names a
            group's base, not the cost of a bed
          shelter: >-
            = a safe covered place, which adds protection; prices here measure where
            you sleep, so "shelter in the city centre" wrongly suggests rough
            housing
      - the: The charity provides accommodation for the homeless.
        syns:
          - shelter
          - lodging
          - housing
        avoid:
          quarters: >-
            = space allotted to a group such as staff or soldiers, usually in
            "living quarters"; the homeless are individuals, so "provides quarters"
            sounds like a barrack block
      - the: Staff accommodation is available near the campus.
        syns:
          - quarters
          - residence
          - housing
        avoid:
          shelter: >-
            = a safe covered place offering protection, the right word for the
            homeless, but employer housing is not a refuge; "shelter is available"
            promises emergency cover, not a job's bed
    syn_notes:
      housing: houses or homes collectively
      lodging: a temporary rented place
      quarters: living space (staff, military)
      shelter: protective housing
      residence: a place of living
    syn_near:
      - accommodate
      - reside
      - amenities
      - hospitality
      - apartment
    syn_avoid:
      lodging: >-
        = rented rooms taken for a short stay, so it fits "accommodation for the
        homeless" and the city centre, but not the British institutional frame
        "staff accommodation"
      quarters: >-
        = space allotted to a group such as staff or soldiers, and the usual set
        phrase is "living quarters"; the uncountable noun reads better in "Staff
        accommodation is available"
      residence: >-
        = the permanent home of a named person or group, which points at status
        and address rather than beds provided, so it is rejected in "accommodation
        for the homeless"
      shelter: >-
        = a safe covered place, which adds protection rather than simply somewhere
        to live, so it serves "shelter for the homeless" but not the price of
        "accommodation in the city centre"
      accommodate: >-
        = the verb behind the noun, as in "hotels accommodate 500 guests"; the
        card needs the noun naming the beds or rooms provided, not the act of
        providing them
      reside: >-
        = to live in a place, a verb about the person, so it goes in "she resides
        in Rome"; here the slots want the housing itself, not its occupant
      amenities: >-
        = the services and facilities of a place, such as a gym or a shop, so it
        says nothing about how many beds or rooms exist for rent
      hospitality: >-
        = a friendly welcome and food offered to guests, an attitude rather than a
        supply of rooms, and the opposite of accommodation priced by the night
      apartment: >-
        = one self-contained flat, a single countable unit in American English
        (flat in British), where accommodation is the housing available in general
        and is uncountable
    syn_nuance: >-
      All of these name somewhere to live, but the frame decides which fits:
      accommodation is the general uncountable word for the beds and rooms
      available, housing is the stock of homes, quarters is space allotted to
      staff or soldiers, lodging is rented rooms for visitors, shelter adds
      protection, and residence marks a permanent home.
    components:
      - spelling
      - definitions
      - synonyms
  - word: adverse
    ipa: /ˈæd.vɜːs/
    pos: adjective
    tip: ad-<b>verse</b> — ends with "verse", not "vurse"
    spelling_hint: ""
    definition: Harmful or unfavourable; having a negative effect.
    example: The drug has few adverse side effects.
    synonyms:
      - harmful
      - detrimental
      - damaging
      - unfavourable
    syn_pos: adjective
    syn_example: '"Adverse weather" — harmful / detrimental are the precise formal adjectives for essays.'
    syn_examples:
      - the: The drug has few adverse side effects.
        syns:
          - harmful
          - detrimental
        avoid:
          unfavourable: >-
            = merely not to one's advantage, the word for conditions, odds and
            the weather; it only rates the deal, while 'few ... side effects'
            must mean harm, so the frames here want damaging or harmful
      - the: Tourism can have an adverse effect on fragile ecosystems.
        syns:
          - damaging
          - detrimental
        avoid:
          unfavourable: >-
            = merely not to one's advantage, the word for conditions, odds and
            the weather; it only rates the deal, while 'few ... side effects'
            must mean harm, so the frames here want damaging or harmful
      - the: Adverse economic conditions slowed the recovery.
        syns:
          - unfavourable
          - harmful
          - damaging
    syn_notes:
      harmful: causing harm
      detrimental: harmful (formal)
      damaging: causing damage
      unfavourable: not good for something
    syn_near:
      - harm
      - deteriorate
      - undesirable
      - negative
      - unhealthy
    syn_avoid:
      harmful: >-
        = capable of causing harm, a broad verdict on any person, food or product;
        the set phrase here is "adverse side effects", and "an harmful effect" is
        ungrammatical
      detrimental: >-
        = formal, and it always needs "to": "detrimental to health"; no "to" slot
        exists in "Adverse economic conditions slowed the recovery"
      damaging: >-
        = actively harmful, and the frame is "damaging to ecosystems"; with a
        countable slot such as "side effects" or "conditions" it does not fit
      unfavourable: >-
        = merely not to one's advantage, the usual word for conditions, odds or
        weather, so it is rejected with "side effects" and with "an effect on the
        environment"
      harm: >-
        = the noun, as in "there is little harm in", or the verb "the drug harms
        patients"; the slot here sits between "few" and "side effects" and wants
        an adjective
      deteriorate: >-
        = to get worse, intransitive and about the condition itself, as in "her
        health deteriorated"; it cannot modify "side effects" or "conditions"
      undesirable: >-
        = unwanted but not necessarily harmful, so it is too weak for drug
        reactions that damage the patient or for economic conditions that slow a
        recovery
      negative: >-
        = simply below zero, of results, figures or emotions, far too vague and
        too weak to be a formal medical or economic judgement about harm
      unhealthy: >-
        = damaging to health, a plain description of diet, air or lifestyle, which
        says nothing about conditions that hold back an economic recovery
    syn_nuance: >-
      All signal a bad outcome, but only adverse is neutral enough to sit in front
      of a countable noun with no preposition: adverse side effects, adverse
      conditions, adverse weather. Detrimental and damaging need "to" plus its
      object, harmful is general and unfavourable only means not advantageous.
    components:
      - spelling
      - definitions
      - synonyms
