      - the: Her reply was deliberately ambiguous.
        syns:
          - equivocal
          - unclear
          - uncertain
        avoid:
          indistinct: >-
            = hard to see or hear, the word for outlines and sounds (an indistinct
            voice); the frame is "her reply was deliberately + ADJ", about the
            meaning she chose, not about how clearly she could be heard
    syn_notes:
      unclear: not clear
      vague: not specific
      equivocal: deliberately double-meaning
      uncertain: not known for sure
      indistinct: hard to see or hear
    syn_near:
      - ambivalent
      - duplicitous
      - ambiguity
    syn_avoid:
      indistinct: >-
        = hard to see or hear, a word for shapes, sounds and outlines: a word is
