  - word: fundamental
    ipa: /ˌfʌn.dəˈmen.təl/
    pos: adjective
    tip: fun-da-men-tal — 'da', then 'mental'
    spelling_hint: ""
    definition: Forming a necessary base or core; of central importance.
    example: Trust is fundamental to any relationship.
    synonyms:
      - basic
      - essential
      - core
      - primary
      - foundational
      - underlying
    syn_pos: adjective
    syn_example: A fundamental / basic / core issue to address.
    syn_examples:
      - the: Trust is fundamental to any relationship.
        syns:
          - basic
          - essential
          - core
          - foundational
        avoid:
          underlying: >-
            = lying beneath, so it takes a cause, a motive or a structure;
            "fundamental to a relationship" speaks of a basis or a necessity, and
            trust is not hidden under one
      - the: There is a fundamental difference between the two views.
        syns:
          - basic
          - primary
          - core
        avoid:
          underlying: >-
            = lying beneath, so it takes a cause, a motive or a structure; the frame
            here is "a + adjective + difference", a contrast on the surface, not a
            hidden layer
          essential: >-
            = absolutely necessary, and it takes "to + noun" or "an essential part
            of"; "an essential difference" claims necessity, not a base, so the
            frame is "a basic difference"
      - the: We must address the fundamental causes.
        syns:
          - underlying
          - foundational
          - primary
          - basic
        avoid:
          essential: >-
            = absolutely necessary, and it takes "to + noun" or "an essential part
            of"; the frame here is "a + adjective + causes", naming the deepest
            layer, not the part of a whole
    syn_notes:
      basic: forming the base
      essential: absolutely necessary
      core: central, most important
      primary: first in importance
      foundational: forming the foundation
      underlying: laying beneath, a deeper cause
    syn_near:
      - principal
      - major
      - radical
      - chief
      - elementary
    syn_avoid:
      core: >-
        = central and most important, usual as "a core + noun" or "at the core
        of": it fits "a core difference", but "the core causes" would mean the
        main effects rather than the deep ones
      essential: >-
        = necessary without qualification, taking "to + noun" or "an essential
        part of": it fits "essential to any relationship", but "an essential
        difference" claims necessity, not a base
      foundational: >-
        = forming the foundation, common in formal reports and syllabuses: it
        fits 'the foundational causes', but the frame compares two views, and
        'a foundational difference' reads as jargon
      primary: >-
        = first in importance or in order, so it fits the comparison and the
        causes: but it never takes "to + noun", and "primary to any relationship"
        is wrong English
      underlying: >-
        = lying beneath, so it takes a cause, a motive or a structure: "the
        underlying causes" is the natural phrase, but it cannot describe a
        difference between two views
      principal: >-
        = first in importance, so it ranks where the frame wants a shared base,
        and exam prose avoids it because it is so easily confused with "principle";
        "principal to" is not a frame either
      major: >-
        = large in scale or importance: "a major difference" is correct, but "the
        major causes" picks out the biggest effects, not the base the problem
        stands on
      radical: >-
        = going to the root, so its frame is "a radical change" or "radical
        reform": "radical causes" reverses it, since the radical thing is the
        change, not the cause
      chief: >-
        = main, as in "the chief cause" or "a chief concern", but it ranks and
        sounds institutional in a report, where the frame wants the base both views
        share, and "chief to" is not a frame
      elementary: >-
        = basic in the technical sense of a first course, as in "elementary
        mathematics": "the elementary causes" suggests crude or simple causes
        rather than basic ones
    syn_nuance: >-
      All six point to what lies at the base, but the frame decides which.
      Fundamental, basic, core and foundational work with to + noun or a ___
      difference, where essential and crucial are the pair meaning necessary.
      Primary ranks first in importance, and underlying is reserved for a cause or
      motive lying beneath.
