  - word: generate
    ipa: /ˈdʒen.ər.eɪt/
    pos: verb
    tip: gen-er-ate — 'er' in the middle
    spelling_hint: ""
    definition: To produce or create something, such as energy or ideas.
    example: Solar panels generate electricity.
    synonyms:
      - produce
      - create
      - yield
      - cause
      - give rise to
    syn_pos: verb
    syn_example: The scheme generates / produces / creates many jobs.
    syn_examples:
      - the: Solar panels generate electricity.
        syns:
          - produce
          - create
          - yield
        avoid:
          cause: >-
            = the general verb of bringing about a consequence; electricity is the
            panels' product, not a consequence that follows, and the frame is
            "produce electricity". It is accepted for debate
          give rise to: >-
            = a formal phrase meaning lead to, used of consequences; a panel makes
            electricity and nothing here follows from anything, so the frame is
            "produce electricity"
      - the: The scheme is expected to generate many jobs.
        syns:
          - create
          - produce
        avoid:
          cause: >-
            = to bring about a consequence; jobs are the scheme's product, and the
            frame is "create jobs", while "cause jobs" is left for harm. It is
            accepted for debate
          give rise to: >-
            = a formal phrase meaning lead to, used of consequences; a scheme
            creates or produces jobs, and jobs are what it makes, not a side effect.
            It is accepted for debate
          yield: >-
            = to give a result or return, usually measured, as in "yield a profit";
            "the scheme yields many jobs" is not idiomatic, and the frame is "create
            jobs". It is right for electricity
      - the: The findings are likely to generate a lot of debate.
        syns:
          - cause
          - give rise to
        avoid:
          yield: >-
            = to give a result or return, usually measured, as in "yield a profit";
            a debate is not a measured return, so the frame is "cause a debate" or
            "give rise to debate"
    syn_notes:
      produce: make
      create: make new
      yield: produce a result
      cause: bring about
      give rise to: result in
    syn_near:
      - manufacture
      - fabricate
      - kindle
      - incite
      - elicit
    syn_avoid:
      cause: >-
        = the general verb of bringing about a consequence: right for "a lot of
        debate", but not for electricity or jobs, which the subject makes or
        brings into being
      create: >-
        = bring something new into existence: natural for electricity and jobs,
        but a debate is not built, it is caused or sparked
      give rise to: >-
        = a formal phrase meaning lead to, used for consequences: a scheme gives
        rise to controversy, but not to jobs or electricity
      produce: >-
        = make or bring out, the plainest of the family: fine for electricity, but
        "produce a debate" is not the natural collocation
      yield: >-
        = give a result or return, usually measured, as in yield a profit: "yield
        jobs" and "yield a debate" are not idiomatic
      manufacture: >-
        = make goods in a factory: right for electricity or equipment, but too
        narrow for jobs and wrong for a debate, which is caused rather than built
      fabricate: >-
        = make something artificially, and often dishonestly, as in fabricate
        data: too loaded for electricity or jobs and out of place with debate
      kindle: >-
        = a literary fire metaphor used of interest, enthusiasm or feeling: it
        cannot take electricity or jobs, and for debate the plain verbs are cause
        and spark
      incite: >-
        = stir people up to act, so it takes people or an action, as in incite
        violence: not electricity, not jobs, not a debate
      elicit: >-
        = draw out a response, an answer or a confession: an academic option for
        sparking debate, but it cannot take electricity or jobs
    syn_nuance: >-
      All five mean bring into being or bring about. Generate is neutral between
      output and consequence, taking electricity, jobs, income and interest.
      Produce and create fit things made or brought into existence, yield fits a
      measured return, and cause and give rise to fit consequences such as a
      debate or a reaction.
