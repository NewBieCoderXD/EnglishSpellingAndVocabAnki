      - spelling
      - definitions
      - synonyms
  - word: recommend
    ipa: /ˌrek.əˈmend/
    pos: verb
    tip: rec-om-mend — double m at the end
    spelling_hint: ""
    definition: To suggest something as suitable or good.
    example: I recommend trying the local food.
    synonyms:
      - suggest
      - advise
      - propose
      - counsel
      - endorse
    syn_pos: verb
    syn_example: Recommend / suggest / advise a change.
    syn_examples:
      - the: I recommend trying the local food.
        syns:
          - suggest
          - propose
        avoid:
          advise: >-
            = to tell someone what to do, so it needs a hearer ("she advised me to
            rest"); "I advise trying the local food" leaves the listener out, the
            frame is "suggest it"
          counsel: >-
            = to give serious, often professional advice, so it takes a person
            ("counsel a patient"); nothing can counsel trying a dish, the frame is
            "suggest trying it"
          endorse: >-
            = to lend public, official support, putting your name behind a product
            or cause; a tip about a dish carries no endorsement, the frame is
            "suggest trying it"
      - the: Doctors recommend regular exercise.
        syns:
          - advise
          - counsel
        avoid:
          endorse: >-
            = to lend public, official backing to a product, cause or campaign; here
            the doctors are advising patients, with no product or cause for them to
            back
          suggest: >-
            = to put an idea forward as a mere possibility ("I suggest trying it");
            a clinic must give weighty advice, so the frame is "advise" or "counsel
            patients"
      - the: The committee is expected to recommend the new plan.
        syns:
          - endorse
          - propose
        avoid:
          advise: >-
            = to tell someone what to do, so it needs a hearer to advise ("advise
            the team"); a committee advises nobody, and its report runs "endorse" or
            "propose the plan"
          counsel: >-
            = to give serious, professional advice to a person, as in "counsel a
            patient"; a committee cannot counsel, and the plan is put forward rather
            than advised
          suggest: >-
            = to put an idea forward tentatively; a committee's report formally puts
            forward a plan, so the frame is "propose" or "endorse the plan"
    syn_notes:
      suggest: mention as an idea
      advise: recommend with authority
      propose: put forward formally
      counsel: give advice
      endorse: support officially
    syn_near:
      - prescribe
      - urge
      - nominate
      - praise
    syn_avoid:
      suggest: >-
        = to put an idea forward as a mere possibility ("I suggest trying it"); in
        a clinic or a committee report a hint carries no weight, and the expected
        verb there is recommend or advise
      advise: >-
        = to tell someone what to do, so it needs a hearer ("she advised me to
        rest", "advise a patient"); "I advise trying the local food" leaves out
        the listener, and a committee advises nobody
      counsel: >-
        = to give careful, serious advice, usually professional, as in "counsel a
        patient" or "counsel him to seek help"; it takes a person rather than an
        activity, so nothing here can counsel trying the food
      propose: >-
        = to table a plan or motion for others to accept ("propose a motion");
        that is the frame in the third sentence, but beside a doctor's advice it
        suggests a meeting rather than guidance to a patient
      endorse: >-
        = to lend public, official support, as a politician backs a policy or a
        star promotes a brand; nobody endorses a dish or an exercise routine
        unless they are lending their name to it
      prescribe: >-
        = a doctor orders a specific medicine ("prescribe antibiotics"); an
        exercise routine can be advised but not prescribed, and a committee
        prescribes nothing at all
      urge: >-
        = to press a person towards action, so it takes a person as object ("she
        urged me to rest"); "I urge trying the local food" leaves out the person
        being urged, so the pressure, not the sense, is wrong
      nominate: >-
        = to formally name someone or something for a post ("nominate a
        candidate"); naming a plan for approval is not supporting it, and a plan
        is proposed, never nominated
      praise: >-
        = to express admiration for something already judged good, and its object
        is a person or an achievement; a dish you have not tried cannot be
        praised, and a committee does not praise a plan
    syn_nuance: >-
      These all point someone towards an action, but the frame decides which.
      Recommend is the neutral verb and takes a gerund ("I recommend trying it"),
      advise and counsel need a hearer ("counsel a patient"), suggest offers a
      possibility, propose tables a plan for a meeting, and endorse lends public
      support to a product.
