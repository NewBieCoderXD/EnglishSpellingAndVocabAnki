  - word: integral
    ipa: /ˈɪn.tɪ.ɡrəl/
    pos: adjective
    tip: in-te-gral — 'te', then 'gral'
    spelling_hint: ""
    definition: Necessary to make something complete; essential.
    example: Teamwork is integral to the project.
    synonyms:
      - essential
      - vital
      - intrinsic
      - indispensable
      - key
    syn_pos: adjective
    syn_example: R&D is integral / essential / key to growth.
    syn_examples:
      - the: Teamwork is integral to the project.
        syns:
          - essential
          - vital
          - key
          - indispensable
        avoid:
          intrinsic: >-
            = inherent in the nature of something, so it needs "intrinsic to" or
            "intrinsic in the nature of"; teamwork is a part added to a project, not
            a property it has by nature
      - the: Exercise is an integral part of a healthy life.
        syns:
          - essential
          - intrinsic
          - vital
      - the: She is an integral member of the team.
        syns:
          - indispensable
          - essential
          - key
        avoid:
          intrinsic: >-
            = inherent in the nature of something, so it takes "intrinsic to +
            noun", never "an intrinsic + person"; she joined the team, so membership
            is not in her nature
    syn_notes:
      essential: absolutely necessary
      vital: critically important
      intrinsic: part of the nature of
      indispensable: cannot do without
      key: most important
    syn_near:
      - crucial
      - compulsory
      - mandatory
      - imperative
      - fundamental
    syn_avoid:
      indispensable: >-
        = you cannot do without it (a person, a tool): too strong for a component
        that simply belongs to the whole
      key: >-
        = the single most important of several; needs "a key part" or "key to",
        and it ranks rather than belongs
      intrinsic: >-
        = inherent in the nature of something: too narrow for a part you add or a
        member you join
      vital: >-
        = the whole thing depends on it, as in "a vital part" or "vital to growth";
        for one person it needs "vital to the team", not "a vital member of"
      crucial: '= the outcome depends on it, far too dramatic for "part of a healthy life"'
      compulsory: "= forced on you by a rule, a contract or the law"
      mandatory: "= the same as compulsory: imposed from outside, not natural to the thing"
      imperative: >-
        needs "imperative to + verb" or "it is imperative that ..."; it marks
        urgency, never "an imperative part of"
      fundamental: >-
        the set phrase is "an integral part"; "fundamental" is stronger and reads
        oddly with "part of"
    syn_nuance: >-
      All of these mean necessary, but the frame decides which is natural:
      integral and essential = a component that makes up the whole, vital =
      the whole depends on it, indispensable = you cannot function without it,
      key = the most important of several, and imperative, mandatory and
      compulsory = imposed from outside.
