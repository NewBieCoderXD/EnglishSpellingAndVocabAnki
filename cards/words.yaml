      experimental: >-
        = relying on a designed trial, of a drug, a method or a prototype, and it
        fits the data frame; the support frame is about a claim no trial has yet
        backed
      scientific: >-
        = connected with science as a field, so it is far wider and says nothing
        about the source of the knowledge; it suits the standing of a discipline
        rather than a claim
      proven: >-
        = shown to be true, of a result, a cure or a method, so it directly
        contradicts lacks support; the frames here are about the kind of backing,
        not about proof
      objective: >-
        = free of personal bias and fair, a word for a judgement, a report or a
        decision; it does not say how the knowledge was obtained
      data-driven: >-
        = decided by analysing numbers, business jargon for a decision, a strategy
        or a team; it normally sits before an action, and saying data is
        data-driven is circular
      statistical: >-
        = resting on numbers from a sample, so it is narrower, and it excludes
        plain observation, case work and designed experiments
    syn_nuance: >-
      All say the knowledge comes from observation and measurement rather than
      theory, and the noun after them shows which. Empirical takes support,
      evidence, research and data. Experimental says the work came from a designed
      trial, evidence-based modifies an approach or a policy, and factual is the
      looser, everyday member.
