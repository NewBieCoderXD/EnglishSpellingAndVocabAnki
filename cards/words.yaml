  - word: severance
    ipa: /ˈsev.ər.əns/
    pos: noun
    tip: sev-er-ance — 'er', then 'ance'
    spelling_hint: ""
    definition: The ending of a contract or employment; compensation paid on dismissal.
    example: He received a large severance package.
    synonyms:
      - termination
      - dismissal
      - redundancy
      - separation
      - compensation
    syn_pos: noun
    syn_example: Discuss severance / redundancy / termination pay in corporate contexts.
    syn_examples:
      - the: He received a large severance package.
        syns:
          - redundancy
          - compensation
      - the: The contract ended after a lengthy severance.
        syns:
          - termination
          - separation
          - dismissal
    syn_notes:
      termination: the ending of employment
      dismissal: being fired
      redundancy: job loss through cutbacks
      separation: leaving or being cut off
      compensation: payment made
    syn_near:
      - settlement
      - payout
      - notice
      - golden handshake
    syn_avoid:
      termination: >-
        = the formal ending of a contract or of employment, the frame "termination
        of employment"; you name the money as a severance or redundancy package,
        not as a large termination
      dismissal: >-
        = the act of being fired, so it heads "dismissal for misconduct" or "a
        dismissal"; a payment for leaving is a package, and the act itself carries
        no money
      separation: >-
        = the state of being apart, the frame "separation from + noun" or "a
        voluntary separation"; in British usage the payment that follows a cut is
        called redundancy pay
      redundancy: >-
        = losing a job because the post was cut, the frame of "a redundancy
        payment or package"; a business contract that ends is terminated, not made
        redundant
      compensation: >-
        = money paid to make up for a loss, the frame "compensation for injuries
        or delay"; when a contract simply ends there is no loss to compensate, so
        the ending is the severance itself
      settlement: >-
        = the agreed sum that ends a dispute, the frame "a settlement with + the
        other side"; money paid when a contract ends is not a settlement
      payout: >-
        = any lump sum handed over, as in a lottery payout; it is informal and
        general, and it names the money rather than the ending of the contract
      notice: >-
        = the warning period before you leave or before a change; it goes with
        "give or receive notice" and a number of weeks, not with the payment
        itself
      golden handshake: >-
        = the informal British label for a generous severance package for a
        departing employee; it is journalistic, and a contract would say severance
        payment
    syn_nuance: >-
      Severance covers the money and the ending in one word, and it splits two
      ways. For a job it is the payment, so "a severance package or payment" goes
      with redundancy and compensation. For a contract it is the act of ending, so
      "a lengthy severance" goes with termination, dismissal and separation.
