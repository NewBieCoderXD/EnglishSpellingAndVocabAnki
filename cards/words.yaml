  - word: contribute
    ipa: /kənˈtrɪb.juːt/
    pos: verb
    tip: con-tri-bute — the stressed 'trɪ'
    spelling_hint: ""
    definition: To give something (money, effort, ideas) to help achieve something.
    example: Everyone contributed to the discussion.
    synonyms:
      - donate
      - add to
      - help
      - play a part in
      - chip in
    syn_pos: verb
    syn_example: Several factors contribute / add to the rising cost.
    syn_examples:
      - the: Several factors contribute to the rising cost.
        syns:
          - add to
          - play a part in
        avoid:
          donate: >-
            = to give money or goods to a charity or a fund, so it needs a giver and
            a recipient; "factors donate to the rising cost" names neither a donor
            nor anything given away
          help: >-
            = to make a person's task easier, and it takes a person as its object,
            as in "help the team"; the subject here is factors and the object a
            cost, so nobody is helped
      - the: Each member can contribute ideas to the discussion.
        syns:
          - chip in
          - add to
          - play a part in
        avoid:
          donate: >-
            = to give money or goods to a charity or a fund, so it needs a
            recipient; here the frame is "contribute ideas to + noun", not
            "contribute to + noun", and an idea is not a gift
          help: >-
            = to make a person's task easier; here the frame is "contribute ideas to
            + noun", not "contribute to + noun", so the right pattern is "help with
            ideas"
      - the: Companies are urged to contribute to local charities.
        syns:
          - donate
          - chip in
        avoid:
          help: >-
            = to make a person's task easier, and it takes a person or a task, not
            an institution; "help to local charities" is wrong, and the pattern is
            "help local charities"
    syn_notes:
      donate: give money or goods
      add to: increase something
      help: assist
      play a part in: be one of the causes
      chip in: give a share (informal)
    syn_near:
      - give
      - input
      - support
      - foster
      - attribute
    syn_avoid:
      add to: >-
        = to make a total bigger, so it takes a quantity as its object: it fits
        the cost and the ideas frames, but add to local charities has no amount to
        add and would need add to the funds of
      chip in: >-
        = informal, and it is always a small gift of money or a share of the work:
        it fits the ideas and the charity frames, but a factor cannot chip in,
        because a factor gives nothing
      donate: >-
        = to give money or goods to a charity, an institution or a fund: it needs
        a giver and a recipient, so it cannot name a cause or an idea
      help: >-
        = to make a person's task easier, and it takes a person as its object, as
        in help the team: factors help to the cost and help to charities both
        fail, and the right pattern is help with ideas
      play a part in: >-
        = to be one contributing cause, and it needs a noun of activity after in:
        it fits the cost frame, but a factor that plays a part in charity is not
        what the money frames mean
      give: >-
        = the general verb of transfer, which needs to or an indirect object: give
        to the cost and give ideas to the discussion are not idiomatic, so only
        the charity frame works
      input: >-
        = a noun for a contribution, and it takes an input to or input into: as a
        verb it means to enter data, so no frame here accepts it in the contribute
        slot
      support: >-
        = to hold up or finance something, which keeps it going rather than making
        it bigger: it takes a bare object, as in support charities, so the
        family's to + noun pattern fails too
      foster: >-
        = to encourage the growth of something positive, such as trust or
        innovation: it will not take the rising cost as the thing that grows, and
        it cannot mean to give to a charity
      attribute: >-
        = to explain the cause of something, and it needs an agent plus attribute
        X to Y: the direction runs the other way here, so a factor cannot
        attribute the cost
    syn_nuance: >-
      Contribute to + noun is the core frame, taking a cause, as in factors
      contribute to the cost, or a destination, as in contribute to charity.
      Contribute something to something adds a gift of money, time or ideas.
      Donate takes only money or goods, play a part in marks one cause among
      others, chip in is informal, and help needs a person.
