    example: Technology can enhance the learning experience.
    synonyms:
      - improve
      - boost
      - strengthen
      - augment
      - heighten
    syn_pos: verb
    syn_example: Enhance / boost / improve performance at work.
    syn_examples:
      - the: Technology can enhance the learning experience.
        syns:
          - improve
          - boost
          - heighten
          - strengthen
      - the: The new feature aims to enhance productivity.
        syns:
          - boost
          - augment
          - heighten
          - improve
          - strengthen
    syn_notes:
      improve: make better
      boost: raise quickly
      strengthen: make stronger
      augment: increase in size or quantity
      heighten: make more intense
    syn_near:
      - increase
      - intensify
      - expand
      - enlarge
      - maximize
    syn_avoid:
      augment: >-
        = add to the size or number of a thing: it fits "augment productivity",
        where output grows, but "augment the learning experience" sounds like
        adding items to an experience
      increase: >-
        = a plain rise in a number or amount: too weak for "enhance the learning
        experience", which is about a better quality
      intensify: >-
        = to make something already forceful stronger, as in "intensify the heat":
        sound English, but it wants a force or a degree, not a neutral experience
      expand: >-
        = to widen the size or scope, as in "expand the business": it adds
        coverage, whereas enhance adds quality
      enlarge: >-
        = to make physically bigger, usual of photos and buildings: a change of
