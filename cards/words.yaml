      - spelling
      - definitions
      - synonyms
  - word: environment
    ipa: /ɪnˈvaɪ.rən.mənt/
    pos: noun
    tip: en-vi-<b>ron</b>-ment — keep the "r" after the "n"
    spelling_hint: ""
    definition: The natural world, or the surroundings and conditions in which someone or something lives.
    example: We must protect the environment for future generations.
    synonyms:
      - surroundings
      - ecosystem
      - habitat
      - setting
    syn_pos: noun
    syn_example: '"Protecting the environment" — habitat / ecosystem for nature essays, surroundings for people.'
    syn_examples:
      - the: We must protect the environment for future generations.
        syns:
          - ecosystem
          - surroundings
        avoid:
          habitat: >-
            = the natural home of a species or group, so it needs a creature
            attached, as in "a protected habitat"; nothing is named here, so
            "protect the habitat" has no referent
          setting: >-
            = the scene or context where something happens, as in "a rural setting"
            or "a calm learning setting"; "protect the setting" narrows it to a film
            or stage scene and loses the whole surroundings
      - the: Children learn best in a calm learning environment.
        syns:
          - surroundings
          - setting
        avoid:
          habitat: >-
            = the natural home of a species or group, so "a learning habitat" is a
            specialist early-years term; ordinary English here is "a calm learning
            environment" or "setting"
      - the: Coral reefs form a fragile marine environment.
        syns:
          - habitat
          - ecosystem
        avoid:
          setting: >-
            = the scene or context, standard for films, novels and locations; "a
            fragile marine setting" sounds like a painted backdrop, while the reefs
            are the living habitat itself
    syn_notes:
      surroundings: the things around you
      ecosystem: a community of living things
      habitat: the natural home of a species
      setting: a scene or context
    syn_near:
      - environmental
      - ambience
      - milieu
      - context
      - nature
    syn_avoid:
      surroundings: >-
        = the physical area and objects around a person, fine for "a calm learning
        environment" but not for coral reefs, where a whole living system is meant
        rather than what stands nearby
      ecosystem: >-
        = a community of living things plus the physical conditions around them,
        so "marine environment" reads oddly; the natural frames are "a fragile
        ecosystem" or "marine ecosystems"
      habitat: >-
        = the natural home of a species or group, so it is rejected in "protect
        the environment for future generations"; in early-years education "a
        learning habitat" is a specialist use
      setting: >-
        = the scene or context in which something happens, as in "a calm learning
        setting" or "a rural setting"; "protect the setting" and "marine setting"
        miss the wider sense
      environmental: >-
        = the adjective, as in "environmental protection" or "environmental
        conditions"; the sentence here needs the noun that can follow the definite
        article after protect
      ambience: >-
        = the mood or atmosphere of a place, felt rather than built up, so it can
        stand for "a calm learning environment" but never for coral reefs or the
        natural world
      milieu: >-
        = the social or cultural setting a person moves in, a word of sociology
        and arts criticism, far too narrow for a marine system or a stretch of
        countryside
      context: >-
        = the circumstances and background that give something meaning, abstract
        and countable, and it has no room for a physical or biological system
      nature: >-
        = the physical world with its plants and animals, the opposite of nurture;
        "protect nature" is good English, but the card wants the single countable
        noun
    syn_nuance: >-
      Environment is the broadest term, covering natural, social and learning
      contexts. Surroundings is the physical area around you, setting the scene in
      which something happens, ecosystem a community of living things plus its
      conditions, and habitat the natural home of a species, which is why it takes
      marine and wildlife contexts.
    components:
      - spelling
      - definitions
      - synonyms
  - word: exacerbate
    ipa: /ɪɡˈzæs.ə.beɪt/
    pos: verb
    tip: ex-<b>ac</b>-er-bate — the "ac" followed by "er" catches people out
    spelling_hint: ""
    definition: To make a bad situation, problem or feeling worse.
    example: Cutting funding only exacerbated the problem.
    synonyms:
      - worsen
      - aggravate
      - intensify
      - compound
    syn_pos: verb
    syn_example: '"The crisis was exacerbated by..." — worsen / aggravate for direct cause-effect statements.'
    syn_examples:
      - the: Cutting budgets can exacerbate the problem.
        syns:
          - worsen
          - compound
          - aggravate
        avoid:
          intensify: >-
            = to increase something in degree, and it fits "intensify existing
            inequalities"; it is rejected for "the problem", an all-or-nothing state
            with no scale to make more intense
      - the: The pandemic may exacerbate existing inequalities.
        syns:
          - intensify
          - aggravate
          - worsen
        avoid:
          compound: >-
            = to make worse by adding a further cause, which fits "compound the
            problem"; here the pandemic is the single cause, so "may compound
            existing inequalities" implies another factor piled on
      - the: Poor diets can exacerbate long-term health problems.
        syns:
          - worsen
          - aggravate
        avoid:
          intensify: >-
            = to raise something in degree, which suits "intensify existing
            inequalities"; illness is a state, not a scale, so "intensify long-term
            health problems" asks for more severity, not more illness
          compound: >-
            = to make worse by adding a further cause; one agent should name one
            worsening, and "can compound long-term health problems" implies diet
            joins other causes instead of being the cause
    syn_notes:
      worsen: become worse
      aggravate: make worse
      intensify: increase in intensity
      compound: make worse by adding
    syn_near:
      - exasperate
      - escalate
      - inflame
      - strengthen
      - aggravation
    syn_avoid:
      compound: >-
        = to make worse by adding a further cause, which fits "can compound the
        problem"; it is rejected with "inequalities" and "health problems", where
        the verb should name a single worsening agent
      intensify: >-
        = to increase something in degree, and it fits "intensify existing
        inequalities"; it is rejected for "the problem" and "health problems",
        states that are already absolute
      exasperate: >-
        = to annoy a person deeply, always with a person as object, as in "she was
        exasperated by the delay"; the slots here take a problem or a condition
      escalate: >-
        = to rise in scale or intensity, mostly intransitive or with tensions and
        disputes, as in "the dispute escalated"; it is not the transitive verb for
        making a problem worse
      inflame: >-
        = to set alight, or to stir up strong feeling, as in 'inflame the
        debate'; it points at heat and anger, while the sentence is a neutral
        claim about money and health
      strengthen: >-
        = to make something firmer or better, the opposite of the sense wanted
        here, and it never combines with "the problem" in this pattern
      aggravation: >-
        = the noun, as in "a skin aggravation" or "the aggravation of the
        dispute"; the sentence needs a full verb after "can" and before "the
        problem"
    syn_nuance: >-
      All make an existing fault worse, but register and image differ: worsen is
      neutral and also runs intransitive, aggravate is formal and medical,
      exacerbate is the most journalistic, and compound adds a second cause piling
      on. Intensify is the near neighbour, pointing at degree rather than at harm.
    components:
      - spelling
      - definitions
      - synonyms
  - word: fluctuate
    ipa: /ˈflʌk.tʃu.eɪt/
    pos: verb
    tip: flu-<b>ctu</b>-ate — the tricky consonant cluster is in the middle
    spelling_hint: ""
    definition: To rise and fall irregularly; to change repeatedly in level or amount.
    example: Oil prices fluctuate from week to week.
    synonyms:
      - vary
      - oscillate
      - swing
      - waver
    syn_pos: verb
    syn_example: '"Prices fluctuate hugely" — vary / swing describe task 1 line-graph movement.'
    syn_examples:
      - the: Oil prices fluctuate from week to week.
        syns:
          - vary
          - swing
          - oscillate
        avoid:
          waver: >-
            = to lose firmness or change one's mind, as in "he wavered over the
            offer"; it belongs to people and decisions, so "prices waver" makes an
            impersonal market look indecisive
      - the: Temperatures fluctuate sharply between the seasons.
        syns:
          - vary
          - oscillate
          - swing
        avoid:
          waver: >-
            = to lose firmness or conviction, standard for a person hesitating
            ('he wavered over the offer'); a measured figure moves up and down,
            so 'temperatures wavered' is not the natural verb here
    syn_notes:
      vary: change
      oscillate: move back and forth (technical)
      swing: move widely between extremes
      waver: become unsteady or changeable
    syn_near:
      - fluctuation
      - volatile
      - unstable
      - sway
      - alternate
    syn_avoid:
      waver: >-
        = to lose firmness or conviction, describing a person or a decision,
        as in 'he wavered over the offer'; a measured figure moves up and down
        instead, so waver does not fit these frames
      fluctuation: >-
        = the noun, as in "price fluctuations" or "fluctuations in temperature";
        the sentences here need the verb, since the subject prices or temperatures
        already fills that role
      volatile: >-
        = the adjective for markets and prices that move wildly, so "oil prices
        are volatile" is a standing quality, whereas the verb marks each rise and
        fall from week to week
      unstable: >-
        = not firmly fixed, the plain opposite of stable, and it judges a whole
        system rather than tracing the regular up-and-down movement of a series
      sway: >-
        = to move slowly from side to side, or to influence someone, a physical or
        political image that does not fit the rise and fall of prices between two
        levels
      alternate: >-
        = to happen in turn by arrangement, as in "alternating shifts" or
        "alternating between A and B"; the movement of prices is irregular and
        nobody plans it
    syn_nuance: >-
      All describe values that rise and fall, but the frames differ: prices, rates
      and temperatures fluctuate, vary and swing, swing adding wide movement
      between two extremes and oscillate being the technical term of physics and
      economics. Waver is the odd one out, describing a person or a decision.
    components:
      - spelling
      - definitions
      - synonyms
  - word: government
    ipa: /ˈɡʌv.ən.mənt/
    pos: noun
    tip: gov-<b>ern</b>-ment — don't drop the "n" when writing fast
    spelling_hint: ""
    definition: The group of people with the authority to govern a country or state.
    example: The government announced a new tax on sugary drinks.
    synonyms:
      - authorities
      - administration
      - state
      - regime
    syn_pos: noun
    syn_example: '"The government should invest..." — authorities / administration are the natural equivalents.'
    syn_examples:
      - the: The government announced a new tax on sugary drinks.
        syns:
          - authorities
          - administration
        avoid:
          regime: >-
            = a government carrying a political judgement, as in "the former
            regime"; a tax announcement is an ordinary act of governance, not a
            political line anyone has to defend
      - the: The government has pledged more money for schools.
        syns:
          - administration
          - state
        avoid:
          regime: >-
            = a government viewed with a political judgement, usual in "the old
            regime"; pledging school funding is routine work, and "the regime has
            pledged" implies an authoritarian state
      - the: The government must tackle growing inequality.
        syns:
          - authorities
          - state
        avoid:
          regime: >-
            = a government carrying a political judgement, as in "the former
            regime"; the frame is a neutral duty, and "the regime must tackle" reads
            as a repressive power under threat
    syn_notes:
      authorities: those in power
      administration: the governing body
      state: the country as a political body
      regime: a government (possibly authoritarian)
    syn_near:
      - governance
      - govern
      - ministry
      - council
      - politician
    syn_avoid:
      authorities: >-
        = the people holding power, plural and deliberately vague, so it works in
        "the authorities announced" or "must tackle inequality" but the sentence
        pledging money names one continuing body
      administration: >-
        = the team in office for a given period, as in "the previous
        administration", and also the civil service; it is rejected for the
        long-term duty "must tackle growing inequality"
      state: >-
        = the country as a political body, so it is rejected where a tax is
        announced; elsewhere, as in "the state has pledged more money for
        schools", it is perfectly good English
      regime: >-
        = a government carrying a political judgement, as in "the former regime";
        that criticism makes it wrong for a tax announcement and for routine
        duties such as tackling inequality
      governance: >-
        = the abstract process of running a country, as in "good governance", and
        it never announces or pledges anything; the card needs a countable body
        that acts
      govern: >-
        = the verb behind the noun, as in "governments must implement rules"; all
        three sentences already carry a determiner before the blank, so a verb
        cannot go there
      ministry: >-
        = one department of government, so it is the wrong level of scale for a
        body that announces a national tax or pledges money for schools
      council: >-
        = a local or advisory body, such as a city council or a safety council,
        not the national government that can set national policy on inequality
      politician: >-
        = a person holding office rather than the institution itself, so it names
        an individual where the sentence needs a collective body to act for a
        whole country
    syn_nuance: >-
      All can stand for the state, but register differs: government is the neutral
      everyday word, state names the country as a political body, administration
      is the team in office for a period, authorities stresses the people in
      power, and regime adds a hint of authoritarian rule. Choose by who acts, not
      by judgement.
    components:
      - spelling
      - definitions
      - synonyms
  - word: implement
    ipa: /ˈɪm.plɪ.ment/
    pos: verb
    tip: im-<b>ple</b>-ment — remember the "e" after "pl"
    spelling_hint: ""
    definition: To put a plan, decision or agreement into effect.
    example: The school will implement the new timetable next term.
    synonyms:
      - introduce
      - enforce
      - adopt
      - apply
    syn_pos: verb
    syn_example: '"Implement reforms" — introduce / adopt / enforce fit policy sentences.'
    syn_examples:
      - the: The school will implement the new timetable next term.
        syns:
          - introduce
          - adopt
          - apply
        avoid:
          enforce: >-
            = to make sure people obey, so it needs a rule with a penalty behind it;
            the frame here is "will implement the new timetable", and a school
            laying out a schedule is not policing anyone
      - the: Governments must implement stricter environmental rules.
        syns:
          - introduce
          - enforce
      - the: The company plans to implement the agreed changes.
        syns:
          - apply
          - adopt
          - introduce
        avoid:
          enforce: >-
            = to make sure people obey, so it needs a rule with a penalty behind it;
            "plans to implement the agreed changes" is about carrying out terms both
            sides settled, which nobody has to be made to obey
    syn_notes:
      introduce: bring in formally
      enforce: make sure it is followed
      adopt: take up officially
      apply: put into effect
    syn_near:
      - examine
      - comply
      - impose
      - installation
      - launch
    syn_avoid:
      adopt: >-
        = to take up officially, which fits "the agreed changes"; it is rejected
        for stricter rules, where nothing is being chosen for the first time, only
        brought into force
      apply: >-
        = to put rules into force, but the usual collocation is "apply the rules
        to conduct"; it is rejected in "Governments must implement stricter
        rules", where the new rules themselves are the news
      enforce: >-
        = to make sure people obey, which needs an authority with power to punish;
        a school bringing in a timetable or a company applying agreed changes has
        nobody to enforce them on
      examine: >-
        = to inspect closely, a false friend from Latin; the sentences need a verb
        meaning put into practice, not one meaning study a timetable or a set of
        changes
      comply: >-
        = to obey a rule, and it always takes "with", as in "comply with the new
        timetable"; here the school and the government are making the rule, not
        obeying it
      impose: >-
        = to force something on people, as in "impose a tax" or "impose a ban"; it
        fits the announcement of a tax but not bringing agreed changes or a
        timetable into practice
      installation: >-
        = the noun, as in "the installation of the new system"; every sentence
        here needs a verb after its subject, so a noun cannot fill the slot before
        the object
      launch: >-
        = to start something publicly, as in "launch an app" or "launch a
        product"; it suits the entrepreneur's app, not the putting of a timetable
        or agreed changes into effect
    syn_nuance: >-
      The family splits between putting something into force and making people
      obey it. Implement is the neutral policy word, introduce and apply cover a
      new measure or a rule, adopt stresses official choice, and enforce needs an
      authority with power to sanction. A firm implements; a government or a court
      enforces.
    components:
      - spelling
      - definitions
      - synonyms
  - word: inevitable
    ipa: /ɪˈnev.ɪ.tə.bəl/
    pos: adjective
    tip: in-<b>evit</b>-able — don't slip in an extra "e" before "able"
    spelling_hint: ""
    definition: Certain to happen; impossible to avoid or prevent.
    example: With rising rents, higher prices were inevitable.
    synonyms:
      - unavoidable
      - inescapable
      - certain
      - sure
    syn_pos: adjective
    syn_example: '"Conflict became inevitable" — unavoidable / certain for outcome essays.'
    syn_examples:
      - the: With rising rents, higher prices were inevitable.
        syns:
          - unavoidable
          - certain
        avoid:
          sure: >-
            = used for what a person knows ("I am sure rents will rise") and it
            wants of, about or that; "higher prices were sure" is not English here,
            since the sentence asserts the outcome itself
      - the: Some job losses are inevitable when firms automate.
        syns:
          - unavoidable
          - inescapable
        avoid:
          sure: >-
            = it reports a person's certainty and wants of, about or that; "job
            losses are sure" would need "sure to happen" here, and this sentence
            gives a result, not anyone's belief
      - the: Change is inevitable in any growing economy.
        syns:
          - unavoidable
          - certain
          - inescapable
        avoid:
          sure: >-
            = a person's belief, with of, about or that ("I am sure change will
            come"); "change is sure in any growing economy" is not English, since
            the claim is general, not anyone's
    syn_notes:
      unavoidable: cannot be avoided
      inescapable: cannot escape
      certain: not in doubt
      sure: for certain
    syn_near:
      - unforeseen
      - fated
      - impending
      - automatic
      - bound
    syn_avoid:
      certain: >-
        = not in doubt, usually reporting what a speaker knows ("the outcome is
        certain"); it fits "prices were certain", but in "some job losses are
        certain" it turns a likely outcome into knowledge
      inescapable: >-
        = you cannot get away from it once it is on you ("an inescapable
        conclusion"); fine in "job losses are inescapable", but a market rise is
        no escape from a pursuer, so it is too psychological here
      sure: >-
        = used for what a person knows ("I am sure it will happen"), and it wants
        of, about or that; no sentence here asserts what anyone believes, and
        "prices were sure" is not English at all
      unforeseen: >-
        = not expected in advance; it sits on the opposite axis, since an
        unforeseen rise is a surprise, while an inevitable one is fully
        predictable from the causes already named
      fated: >-
        = destined by fate, literary and grand ("a fated encounter"); the
        inflation suits a romance, not a price rise, and "higher prices were
        fated" is strained where inevitable is plain
      impending: >-
        = about to happen very soon ("an impending crisis"); it is a warning that
        comes before the event, while inevitable argues that the event cannot be
        dodged whatever the timing
      automatic: >-
        = happening with no human action at all ("an automatic response"); a price
        rise follows from decisions people take, and nobody calls a market outcome
        automatic
      bound: >-
        = certain to happen, but it only works with "bound to + verb", as in
        "prices are bound to rise"; as a bare adjective after were it gives the
        wrong frame, so use inevitable
    syn_nuance: >-
      Certain means not in doubt and reports what a speaker believes, while
      inevitable and unavoidable argue from the causes and take a noun such as an
      outcome or a consequence. Inescapable is stronger, as if you could not get
      away from it, and sure needs of, about or that.
    components:
      - spelling
      - definitions
      - synonyms
  - word: mitigate
    ipa: /ˈmɪt.ɪ.ɡeɪt/
    pos: verb
    tip: mit-i-<b>gate</b> — three syllables, no double letters
    spelling_hint: ""
    definition: To make something bad or harmful less severe, serious or painful.
    example: New laws were introduced to mitigate the effects of pollution.
    synonyms:
      - reduce
      - alleviate
      - lessen
      - ease
    syn_pos: verb
    syn_example: '"Mitigate the risks" — reduce / alleviate are the plain IELTS verbs.'
    syn_examples:
      - the: Trees help mitigate the effects of flooding.
        syns:
          - reduce
          - lessen
          - alleviate
        avoid:
          ease: >-
            = to make a burden or a pain gentler ("ease the burden", "ease the
            pain"); with "the effects of flooding" there is no load to lift, so
            reduce, lessen or alleviate fit instead
      - the: New laws aim to mitigate pollution in cities.
        syns:
          - alleviate
          - reduce
          - lessen
        avoid:
          ease: >-
            = it goes with burdens, pressure and pain ("ease the pressure on
            hospitals"); "ease pollution" is wrong, since pollution is a condition
            to cut, not a weight to carry
      - the: We must mitigate the financial risks involved.
        syns:
          - lessen
          - ease
          - reduce
    syn_notes:
      reduce: make smaller
      alleviate: relieve suffering or pain
      lessen: make less
      ease: make less painful
    syn_near:
      - prevent
      - eradicate
      - combat
      - offset
      - cushion
    syn_avoid:
      alleviate: >-
        = relief for pain, poverty or hardship ("alleviate poverty"); fine in the
        pollution sentence, but a financial risk is a chance of loss rather than
        suffering, so it will not take risks
      ease: >-
        = to make a burden, a pressure or a pain gentler ("ease the burden"); it
        is accepted with risks, but "ease the effects of flooding" is wrong, since
        nothing physical is lifted here
      prevent: >-
        = to stop something from happening at all, so it is the exact opposite of
        mitigate, which only lowers the force of an effect that still occurs
      eradicate: >-
        = to destroy something completely, usually a disease or a practice
        ("eradicate poverty"); nothing here is wiped out, only weakened, so it
        promises far too much
      combat: >-
        = to fight against a person, a disease or a problem ("combat crime"); the
        martial image is wrong for the neutral, technical tone of the pollution
        and risk frames
      offset: >-
        = to cancel out a bad effect with a good one ("higher costs offset by
        savings"); it implies two sides of a balance, whereas mitigate only
        weakens the damage and names no credit
      cushion: >-
        = to soften an impact or absorb a blow ("cushion the shock of the cuts");
        it wants a sudden knock after it, not a gradual effect, so it cannot stand
        with the effects of flooding
    syn_nuance: >-
      Mitigate only weakens something that still happens, so it takes the effects
      of, the risks of or the impact of. Reduce and lessen are neutral and fit any
      quantity, alleviate is reserved for suffering, pain and hardship, and ease
      is used for a burden, a pressure or a credit crunch.
    components:
      - spelling
      - definitions
      - synonyms
  - word: necessary
    ipa: /ˈnes.ə.ser.i/
    pos: adjective
    tip: one <b>c</b>, double <b>s</b> — ne-<b>ces</b>-sary
    spelling_hint: ""
    definition: Needed in order to achieve something; essential.
    example: It is necessary to register before the deadline.
    synonyms:
      - essential
      - vital
      - required
      - indispensable
    syn_pos: adjective
    syn_example: '"It is necessary to..." — essential / vital are the stronger IELTS adjectives.'
    syn_examples:
      - the: It is necessary to register before the deadline.
        syns:
          - essential
          - vital
          - required
        avoid:
          indispensable: >-
            = something you cannot do without at all, and it sits with a person or a
            tool ("an indispensable key"); "necessary to register before the
            deadline" is a rule with a date on it, not a must-have
      - the: Adequate funding is necessary for the research to continue.
        syns:
          - essential
          - required
          - vital
        avoid:
          indispensable: >-
            = the one thing you cannot do without ("an indispensable part"); funding
            that "is necessary for the research to continue" can be cut and found
            again, so the work is not impossible without it
      - the: Take only necessary luggage on the flight.
        syns:
          - essential
          - indispensable
    syn_notes:
      essential: absolutely necessary
      vital: critically important
      required: demanded
      indispensable: cannot do without
    syn_near:
      - compulsory
      - feasible
      - beneficial
      - minimal
      - superfluous
    syn_avoid:
      indispensable: >-
        = you cannot do without it at all ("an indispensable tool"); accepted with
        luggage, but "it is indispensable to register" overstates, since something
        can be useful without being unavoidable
      required: >-
        = demanded by a rule, a form or a person ("qualifications are required");
        right for registration, but "required funding" and "required luggage"
        suggest an outside rule rather than a speaker's choice
      vital: >-
        = the whole depends on it, a stronger claim ("vital organs"); it fits
        funding, but not "vital luggage", and for registration it sounds more
        urgent than a plain requirement
      compulsory: >-
        = forced on you by law, contract or school ("compulsory education");
        nothing imposes registration on the traveller, it simply has to be done
        first, so the frame of external force fails
      feasible: >-
        = possible to do ("it is feasible to register by post"); it answers
        whether something can happen, while necessary answers whether it must, so
        the two test different questions
      beneficial: >-
        = good for you but not required ("a beneficial habit"); luggage has to be
        limited, not merely useful, and this sentence counts weight rather than
        benefit
      minimal: >-
        = the smallest amount possible ("minimal luggage"); it is a quantity word,
        so it says the aim is a low total, while necessary says only that the
        requirement is being met
      superfluous: >-
        = more than is needed, the exact opposite; fine in "superfluous items",
        but it can never fill a slot where necessary is wanted, since it points to
        excess rather than need
    syn_nuance: >-
      Necessary, essential and required all fit a thing you cannot do without, but
      indispensable is absolute, vital adds the sense that the whole depends on
      it, and required points to an outside rule. In "it is necessary to + verb"
      they differ mainly in strength, while with a noun such as luggage only
      necessary and indispensable read naturally.
    components:
      - spelling
      - definitions
      - synonyms
  - word: opportunity
    ipa: /ˌɒp.əˈtjuː.nə.ti/
    pos: noun
    tip: op-<b>por</b>-tu-ni-ty — double <b>p</b>
    spelling_hint: ""
    definition: A favourable time or chance to do something.
    example: Studying abroad was the opportunity of a lifetime.
    synonyms:
      - chance
      - prospect
      - opening
      - possibility
    syn_pos: noun
    syn_example: '"Career opportunities" — prospects / openings fit employment essays.'
    syn_examples:
      - the: Studying abroad was the opportunity of a lifetime.
        syns:
          - chance
        avoid:
          possibility: >-
            = just something that can happen, with no luck in it ("a possibility of
            rain"); a once-in-a-lifetime chance is a rare good opening, not simply
            an outcome
          prospect: >-
            = something likely to happen later, and it likes "the prospect of +
            noun"; studying abroad here is already over and was the chance itself,
            not a future likelihood
      - the: The internet creates new opportunities for small businesses.
        syns:
          - prospect
          - chance
        types:
          - prospects
          - possibilities
          - chances
        avoid:
          possibility: >-
            = only an outcome, with nothing there to take up; "creates new X for
            small businesses" points at openings a firm can act on, so this frame
            wants the chance sense, not a bare outcome
      - the: She was given the opportunity to lead the project.
        syns:
          - chance
        avoid:
          possibility: >-
            = it names an outcome, and it prefers "the possibility of + -ing"; she
            was handed something she can use, so "the possibility to lead the
            project" is not the frame
          prospect: >-
            = a future likelihood that wants "of" ("the prospect of leading the
            project"); she has already been given it, so nothing is left ahead to
            look forward to
    syn_notes:
      chance: a favourable possibility
      prospect: a likely future opportunity
      opening: an available position or gap
      possibility: something that can happen
    syn_near:
      - occasion
      - window
      - option
      - break
      - privilege
    syn_avoid:
      possibility: >-
        = simply something that can happen, with no luck or favour in it ("a
        possibility of rain"); fine as a plural in "new possibilities", but a
        once-in-a-lifetime opening is not just an outcome
      prospect: >-
        = something likely to happen later, normally a plural ("job prospects", "the
        prospect of a rise"); it looks forward, so it cannot report an opening
        already handed to someone
      opening: >-
        = a vacant post, a gap in a diary or a slot for entry ("an opening in the
        team", "job openings"); it names a post, not a chance, and needs in / at
        / for
      occasion: >-
        = a particular time when an event happens ("on this occasion", "a formal
        occasion"); it dates an event rather than naming a favourable opening, and
        "the occasion of a lifetime" is a different idiom
      window: >-
        = it only works inside the fixed phrase "a window of opportunity"; on its
        own a window is glass or a gap in a wall, and the bare noun cannot fill
        "the ___ of a lifetime"
      option: >-
        = one choice from a list ("a cheaper option"); it is neutral, with no luck
        or favour involved, so it drops the sense of a good chance worth taking up
      break: >-
        = a lucky opening in a career, informal ("she got her big break"); the
        tone is journalistic and vague, and the phrase does not combine with "of a
        lifetime"
      privilege: >-
        = an honour or an advantage others do not get ("a privilege to work
        here"); it praises a social or moral advantage, which is not the same as a
        practical opening that came along
    syn_nuance: >-
      All name a chance that something good can happen, but chance adds luck,
      possibility is neutral and often plural ("new possibilities"), and prospect
      looks forward to what is likely ("job prospects"). Opportunity is the
      neutral one and the only member that takes "of a lifetime" or "an ___ to +
      verb"; opening needs "an opening in / at".
    components:
      - spelling
      - definitions
      - synonyms
  - word: phenomenon
    ipa: /fəˈnɒm.ɪ.nən/
    pos: noun
    tip: <b>ph</b>e-<b>no</b>-me-non — "ph" for the /f/ sound, double <b>n</b> before "on"
    spelling_hint: ""
    definition: A fact, event or situation that can be observed to exist or happen.
    example: Globalisation is not a new phenomenon.
    synonyms:
      - occurrence
      - trend
      - event
      - development
    syn_pos: noun
    syn_example: '"A global phenomenon" — trend / occurrence for society essays.'
    syn_examples:
      - the: Globalisation is a global phenomenon.
        syns:
          - trend
          - occurrence
          - development
        avoid:
          event: >-
            = something happening at a stated time and place ("a sporting event");
            the frame here is "is a global X", which wants a dated occasion, but
            globalisation is a pattern spread over many years
      - the: Urban migration is a modern phenomenon.
        syns:
          - development
          - trend
          - occurrence
        avoid:
          event: >-
            = a dated, one-off happening ("a sporting event"); "is a modern event"
            reads as one set in the present, while urban migration is a long-run
            pattern, not an occasion
      - the: The Northern Lights are a natural phenomenon.
        syns:
          - occurrence
          - event
    syn_notes:
      occurrence: something that happens
      trend: a general direction or pattern
      event: a specific happening
      development: a newly occurring situation
    syn_near:
      - incidence
      - spectacle
      - anomaly
      - outbreak
      - phenomenal
    syn_avoid:
      development: >-
        = a new situation that comes about over time ("political developments");
        it is accepted for globalisation and migration, but the Northern Lights
        have always been there, so nothing is developing
      event: >-
        = something that happens at a stated time and place ("a sporting event");
        it is accepted for the Northern Lights, but a pattern seen across many
        countries is not one dated happening
      trend: >-
        = a general direction that figures move in ("a downward trend"); it is
        accepted for globalisation, but a single display has no direction over
        time and a phenomenon is not a measured series
      incidence: >-
        = the rate at which something happens ("a high incidence of disease"); it
        is a statistic counting cases in a population, whereas the aurora is the
        thing itself and is not measured by frequency
      spectacle: >-
        = a show put on for an audience, as in "the opening spectacle"; fine in "a
        natural spectacle", but the word adds scale and entertainment that the
        plain report of the Northern Lights does not need
      anomaly: >-
        = something that departs from what is normal ("a statistical anomaly");
        the display is rare, so the word overstates the oddity and frames it as a
        deviation rather than a regular process
      outbreak: >-
        = the sudden start of a disease or a fire across an area ("a disease
        outbreak"); it needs a harmful event that spreads, and nothing is
        spreading when the sky lights up
      phenomenal: >-
        = an adjective meaning outstanding ("a phenomenal athlete"); good English,
        but it is the wrong part of speech for a noun slot after "a natural ___"
    syn_nuance: >-
      A phenomenon is a thing that can be observed, and the family splits by what
      it stresses. Occurrence is the neutral count of something happening, trend
      and development need change over time, and event needs a single dated
      happening. A natural phenomenon can last minutes, so it has no direction.
    components:
      - spelling
      - definitions
      - synonyms
  - word: significant
    ipa: /sɪɡˈnɪf.ɪ.kənt/
    pos: adjective
    tip: <b>signi</b>-fi-<b>cant</b> — commonly mis-spelled "signficant"
    spelling_hint: ""
    definition: Large or important enough to be noticed; having a real effect on something.
    example: The results show a significant improvement.
    synonyms:
      - substantial
      - considerable
      - major
      - marked
      - notable
    syn_pos: adjective
    syn_example: '"A significant improvement" — substantial / considerable are task 1 staples.'
    syn_examples:
      - the: The results show a significant improvement.
        syns:
          - substantial
          - notable
          - marked
        avoid:
          major: >-
            = of high importance or big size, and it is fine for a breakthrough ("a
            major breakthrough"); the results here only report a measured change,
            and major would add a ranking the data does not make
      - the: There has been a significant rise in online shopping.
        syns:
          - considerable
          - major
          - substantial
      - the: The study found significant differences between the two groups.
        syns:
          - marked
          - considerable
          - notable
        avoid:
          major: >-
            = it rates something as important or big ("a major concern"); with two
            groups the study reports a measurable gap, and major would claim the gap
            was large, which the sentence does not say
    syn_notes:
      substantial: large in amount
      considerable: quite large
      major: big or important
      marked: clearly noticeable
      notable: worth noting
    syn_near:
      - appreciable
      - dramatic
      - sizeable
      - sharp
      - relevant
    syn_avoid:
      substantial: >-
        = large in amount, and it is accepted with the rise; but "a substantial
        improvement" and "substantial differences" claim a big size, whereas the
        study reports the strength of a measured gap
      considerable: >-
        = quite large in amount, so it is right for the rise; but "a considerable
        improvement" and "considerable differences" overstate the size and still
        leave out statistical weight
      major: >-
        = of high importance or big size, and it fits the rise; but "a major
        improvement" and "major differences" talk of importance, where the study
        reports a measurable gap, not a ranking
      marked: >-
        = clearly noticeable ("marked differences"), and it fits the differences;
        but "a marked improvement" and "a marked rise" promise a striking change,
        which is a stronger claim than significant
      notable: >-
        = worth remarking on ("a notable achievement"), and it fits the
        differences; but "a notable improvement" and "a notable rise" say only
        that it deserved a comment, not that it was large or measurable
      appreciable: >-
        = large enough to be noticed ("an appreciable rise"); correct in the rise
        sentence, but it measures how noticeable an effect is, so it cannot report
        the weight of a finding or a difference
      dramatic: >-
        = sudden and far bigger than expected, or done for effect ("a dramatic
        fall in sales"); it adds shock and speed that significant does not, so "a
        dramatic improvement" overstates a plain gain
      sizeable: >-
        = the same as substantial but less formal; it can only mean large in size
        or amount, so it fails for "significant differences" and for the
        statistical weight of a finding
      sharp: >-
        = rising or falling fast, as in "a sharp rise in costs"; it describes the
        shape of the change, and here the data report size and weight rather than
        speed
      relevant: >-
        = connected to the matter in hand ("relevant evidence"); it says what
        relates, not what matters or how large it is, so "relevant differences"
        answers a different question
    syn_nuance: >-
      Significant covers two senses. With a quantity ("a significant rise") it
      means large, like substantial, considerable and major, and with a result
      ("significant differences") it means large enough to be trusted, which is
      where marked and notable belong. Sharp and dramatic add speed and shock.
    components:
      - spelling
      - definitions
      - synonyms
  - word: sustainable
    ipa: /səˈsteɪ.nə.bəl/
    pos: adjective
    tip: sus-<b>tain</b>-able — keep the "ai" in the middle
    spelling_hint: ""
    definition: Able to continue or be maintained at a certain rate or level over time, without harming the environment.
    example: The company is looking for more sustainable sources of energy.
    synonyms:
      - renewable
      - viable
      - responsible
      - clean
    syn_pos: adjective
    syn_example: '"Sustainable development" — renewable / clean fit environment essays.'
    syn_examples:
      - the: The company is looking for more sustainable sources of energy.
        syns:
          - renewable
          - clean
          - viable
      - the: Tourism must become sustainable to protect local communities.
        syns:
          - viable
          - responsible
    syn_notes:
      renewable: can be replenished (energy)
      viable: can work over time
      responsible: not harmful, careful
      clean: environmentally friendly
    syn_near:
      - green
      - recyclable
      - affordable
      - environmental
      - durable
    syn_avoid:
      clean: >-
        = free from dirt or harmful substances ("clean energy", "clean air"); it
        is accepted for energy, but it reports the absence of pollution, which
        says nothing about keeping a resource up over time
      renewable: >-
        = a resource that nature can replace ("renewable energy"); correct in the
        energy sentence, but it is a property of a physical input, and tourism has
        no input that is replenished
      responsible: >-
        = careful and not to blame ("responsible tourism"); it is accepted for
        tourism, where it means fair to local people, but it describes conduct,
        not whether a resource lasts
      green: >-
        = informal for environmentally friendly ("green transport"); fine English
        that covers both senses, but it is too loose for a policy sentence and
        never states the long-term test that sustainable means
      recyclable: >-
        = able to be reprocessed into new material ("recyclable packaging"); good
        in "recyclable glass", but it is a property of one product after use and
        does not mean the resource itself is replaced
      affordable: >-
        = cheap enough for most people to pay ("affordable housing"); an industry
        can be affordable and still use resources up, so this is an economic test
        and not the long-term one meant here
      environmental: >-
        = connected with the natural world ("environmental policy"); it is a
        neutral label for a subject, and a thing cannot be environmental, only
        friendly to the environment, so it states no verdict
      durable: >-
        = made to last a long time ("durable goods"); it is a claim about one
        product's lifespan, and even a long-lasting resource runs out unless it is
        replenished, so it is not the test meant here
    syn_nuance: >-
      Sustainable is the umbrella word for a resource that can be kept up over
      time. Renewable and clean describe one input ("renewable energy", "clean
      energy"), responsible describes conduct ("responsible tourism"), and viable
      asks whether a plan or a business can continue ("a viable industry").
    components:
      - spelling
      - definitions
      - synonyms
  - word: ubiquitous
    ipa: /juːˈbɪk.wɪ.təs/
    pos: adjective
    tip: u-bi-<b>qui</b>-tous — every "q" is followed by "u"
    spelling_hint: ""
    definition: Seeming to be everywhere at the same time; very common.
    example: Smartphones have become ubiquitous in modern life.
    synonyms:
      - everywhere
      - pervasive
      - widespread
      - omnipresent
    syn_pos: adjective
    syn_example: '"Smartphones are ubiquitous" — pervasive / omnipresent are the academic replacements.'
    syn_examples:
      - the: Smartphones have become ubiquitous in modern life.
        syns:
          - pervasive
          - omnipresent
          - everywhere
          - widespread
      - the: Data collection is ubiquitous in the app economy.
        syns:
          - widespread
          - pervasive
          - omnipresent
      - the: The brand is ubiquitous in the fashion industry.
        syns:
          - omnipresent
          - widespread
          - everywhere
    syn_notes:
      everywhere: present everywhere
      pervasive: spreading through everything
      widespread: over a wide area
      omnipresent: present everywhere at once
    syn_near:
      - prevalent
      - universal
      - global
      - endemic
      - rampant
    syn_avoid:
      everywhere: >-
        = an adverb of place, so it works as "the brand is everywhere"; but "have
        become everywhere" is not English after become, and the slot before "in
        modern life" needs an adjective
      pervasive: >-
        = spreading through a place or a system ("pervasive surveillance"); it is
        fine in the data sentence, but it hints at intrusion, which sits badly
        with a brand that is merely popular
      prevalent: >-
        = common in a place or at a time ("the disease was prevalent"); very close
        in sense, but it measures how common a thing is, and "prevalent in the app
        economy" needs a place after it
      universal: >-
        = done, held or understood by everyone ("universal healthcare", "a
        universal truth"); it applies to all people or all cases, not to the
        presence of an object, and not everyone owns a smartphone
      global: >-
        = covering the whole world ("global warming", "the global economy"); it
        names the scope, not the frequency, so a product can be ubiquitous inside
        one city and never be global
      endemic: >-
        = found only in one particular area ("an endemic disease"); it is the
        opposite of spreading everywhere, so it points at confinement rather than
        presence across many places
      rampant: >-
        = spreading fast and out of control, as in 'rampant crime'; it is
        negative or alarming, while this sentence praises how widespread the
        brand is, so the tone is wrong
    syn_nuance: >-
      All of these say a thing is present in many places, but omnipresent and
      everywhere are absolute, while widespread and prevalent point to a wide area
      or a high rate. Ubiquitous also suits something that has quietly become
      normal, so crime is rampant and endemic means found in one area only.
    components:
      - spelling
      - definitions
      - synonyms
