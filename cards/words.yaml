  - word: negotiate
    ipa: /nɪˈɡəʊ.ʃi.eɪt/
    pos: verb
    tip: ne-go-ti-ate — 'go', then 'ti-ate'
    spelling_hint: ""
    definition: To discuss something formally to reach an agreement.
    example: They negotiated a new contract.
    synonyms:
      - bargain
      - discuss
      - arrange
      - mediate
      - settle
    syn_pos: verb
    syn_example: Negotiate / bargain / settle a deal.
    syn_examples:
      - the: The union met to negotiate a new contract.
        syns:
          - bargain
          - settle
        avoid:
          arrange: >-
            = to organize and book things yourself ("arrange a meeting", "arrange
            for a taxi"); a contract is signed by both sides, so the union cannot
            arrange it alone
          mediate: >-
            = to step in as a third party between two others, so the frame is
            "mediate between A and B"; the union is one of the bargaining sides, not
            a neutral party
      - the: The two sides met to negotiate a deal.
        syns:
          - discuss
        avoid:
          arrange: >-
            = to organize and book things yourself, and it takes the deal as already
            agreed ("arrange a meeting"); the two sides are still talking it over,
            so the frame is "discuss a deal"
          mediate: >-
            = to step in as a third party between two others; the two sides are the
            ones bargaining, and neither can stand between itself and the other
          bargain: >-
            = to haggle over price or pay, so it needs buyers and sellers; no price
            or wage is named here, so the two sides are only discussing terms
      - the: A neutral party helped to negotiate the dispute.
        syns:
          - mediate
          - settle
          - discuss
        avoid:
          arrange: >-
            = to organize and book things yourself, as in "arrange a meeting"; a
            neutral party can set that meeting up, but not arrange away a dispute,
            which needs "mediate" or "settle"
          bargain: >-
            = to haggle over price or pay, so it needs buyers and sellers; a neutral
            party buys and sells nothing, and a dispute is settled, not bargained
            over
    syn_notes:
      bargain: haggle over terms
      discuss: talk about
      arrange: organize an agreement
      mediate: step in between parties
      settle: resolve definitely
    syn_near:
      - confer
      - arbitrate
      - compromise
      - intervene
    syn_avoid:
      bargain: >-
        = to haggle over price or pay; it needs buyers and sellers, so it is too
        small for a union and an employer signing a contract or a neutral party
        settling a dispute
      discuss: >-
        = to talk about a subject with no promise of agreement; "met to discuss a
        deal" is fine, but a contract is settled rather than merely raised, and
        "met to discuss a contract" understates the bargaining
      arrange: >-
        = to organize things yourself, in the frames "arrange a meeting" or
        "arrange for a taxi"; a contract is arranged by both sides after they
        agree, so it cannot stand for the negotiating itself
      mediate: >-
        = to step in as a third party between two others, so it needs "between A
        and B" or a neutral actor; here the two sides are doing the bargaining and
        neither is standing between
      settle: >-
        = to bring a matter to a definite end, often a debt or a claim, and it is
        often intransitive ("settle on a price"); at the stage of meeting to
        negotiate a deal nothing is closed yet
      confer: >-
        = to hold a formal talk, normally "confer with someone"; it reports the
        meeting rather than the bargaining and takes a person with "with", not a
        contract as its object
      arbitrate: >-
        = for an impartial body to impose a binding decision, as in salary
        arbitration; the parties here agree terms themselves, and a neutral party
        helps them, it does not rule
      compromise: >-
        = the concession each side makes, a noun, or the verb of giving ground; it
        names the settlement already reached, so nobody negotiates a compromise,
        they reach one
      intervene: >-
        = to step in to change a course of events, usually to stop harm ("the
        government intervened"); it takes no contract or dispute as its object
        here and implies something was going wrong
    syn_nuance: >-
      Negotiate and mediate both assume two sides working towards terms, but
      negotiate is the two-sided talk itself, bargain adds haggling over price,
      and settle means the matter is already closed. Discuss reports the talk
      without any promise of terms, while arrange only puts the result in order.
