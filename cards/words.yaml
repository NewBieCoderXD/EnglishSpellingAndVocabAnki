      All of these mean that one clear message does not come through, but the
      object decides which. A word or a rule takes ambiguous, unclear or
      equivocal, with equivocal adding a deliberate choice by a speaker. Vague
      means the opposite problem, lack of detail; indistinct is for shapes, and
      uncertain is for a person in doubt.
