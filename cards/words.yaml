words:
  - word: achieve
    ipa: /əˈtʃiːv/
    pos: verb
    tip: a-chieve — the common 'ie' after c is the trap
    spelling_hint: ""
    definition: To successfully reach a desired aim or result by effort.
    example: She worked hard to achieve her goals.
    synonyms:
      - attain
      - accomplish
      - reach
      - realize
      - fulfil
    syn_pos: verb
    syn_example: Achieve / attain / reach your goals — all are formal IELTS verbs.
    syn_examples:
      - the: She worked hard to achieve her goals.
        syns:
          - accomplish
          - attain
          - reach
          - realize
          - fulfil
      - the: The team managed to achieve the performance target.
        syns:
          - reach
          - attain
          - accomplish
      - the: He hoped to achieve his ambition of living abroad.
        syns:
          - realize
          - fulfil
    syn_notes:
      attain: by age, status, or position
      accomplish: by effort and completion
      reach: by progress toward a target
      realize: by making a long-held dream real
      fulfil: by satisfying an ambition or promise
    syn_near:
      - acquire
      - obtain
      - secure
      - execute
    syn_avoid:
      realize: >-
        = make a long-held dream real; it does not take a measurable target, and
        in US English it also means to become aware of something
      fulfil: >-
        = satisfy a promise, a role or a potential; the target here is a measured
        figure nobody promised, so the frame points elsewhere
      attain: >-
        = arrive at a level by age, status or slow progress; fine with a target,
        but the deck gives this lifelong-ambition frame to realize and fulfil
      accomplish: >-
        = finish a task that has actually been carried out; it fits a goal, though
        the deck reserves it for completed effort, not for a wish to live abroad
      reach: >-
        = get to a point by moving toward it step by step; natural with targets,
        but 'reach his ambition of living abroad' fights the sense of progress
      acquire: >-
        = get something you did not previously have, like a skill or a degree;
        goals are reached, not picked up, so the verb is wrong here
      obtain: >-
        = get a document, a permit or a post by asking for it; it takes something
        you can apply for, never a goal or a target
      secure: >-
        = lock in a job, a contract or a grant against rivals; a firm is offered a
        job, it does not secure one, so the collocation fails
      execute: >-
        = carry out a plan, a contract or an order; an ambition is achieved
        rather than carried out, and 'execute a goal' is not idiomatic English
    syn_nuance: >-
      All of these name reaching an intended result, but the object decides which
      is idiomatic: accomplish is a task finished by effort, attain is a level
      reached with time, reach is a target approached step by step, realize is a
      dream made real, fulfil is a promise satisfied. Only reach, attain and
      accomplish collocate with a measured target.
    components:
      - spelling
      - definitions
      - synonyms
  - word: alternative
    ipa: /ɔːlˈtɜː.nə.tɪv/
    pos: adjective/noun
    tip: alt-ern-ative — keep the 'ern' in the middle
    spelling_hint: ""
    definition: One of two or more available possibilities; a different option.
    example: We considered an alternative plan.
    synonyms:
      - option
      - choice
      - substitute
      - fallback
    syn_pos: noun
    syn_example: Offer an alternative or an option when presenting solutions in an essay.
    syn_examples:
      - the: We need an alternative to the current plan.
        syns:
          - option
          - choice
          - substitute
          - fallback
      - the: They proposed a cheaper alternative.
        syns:
          - option
          - choice
          - substitute
    syn_notes:
      option: one among several selections
      choice: the result of deciding
      substitute: a replacement that takes the place
      fallback: a second-best backup plan
    syn_near:
      - replacement
      - rival
      - variant
      - equivalent
    syn_avoid:
      fallback: >-
        = the reserve you switch to when the first choice breaks down, as in 'a
        fallback option'; a cheaper candidate here is a plan on the table, not a
        breakdown plan
      replacement: >-
        = the item that takes the place of a used or missing one, like a spare
        tyre; an alternative is chosen from options, not worn out first
      rival: >-
        = a competitor trying to beat another, and it takes a firm or product
        after it, as in 'a cheaper rival'; a proposal is not a competitor
      variant: >-
        = a slightly different form of the same item, such as another size or
        model; an alternative is a different course of action, not a variant of
        one thing
      equivalent: >-
        = something equal in value or function, as in 'no equivalent word exists';
        it matches one thing against another, not one plan against a current one
    syn_nuance: >-
      All of these are a second course of action, but the pattern is 'an
      alternative to + noun' and 'a cheaper alternative': option and choice are
      neutral members of a list, substitute needs 'a substitute for + noun' and
      stands in for something, while fallback only names the plan you turn to once
      the first choice fails.
    components:
      - spelling
      - definitions
      - synonyms
  - word: analyze
    ipa: /ˈæn.əl.aɪz/
    pos: verb
    tip: an-a-lyze — 'a-na-ly-ze', three syllables
    spelling_hint: ""
    definition: To examine something in detail in order to understand or explain it.
    example: We analyzed the data carefully.
    synonyms:
      - examine
      - inspect
      - study
      - evaluate
      - investigate
    syn_pos: verb
    syn_example: Analyze, examine or investigate a problem in your task 2 body.
    syn_examples:
      - the: We need to analyze the data before deciding.
        syns:
          - examine
          - inspect
          - study
          - evaluate
          - investigate
      - the: The report is designed to analyze the causes of the problem.
        syns:
          - study
          - investigate
          - examine
    syn_notes:
      examine: look closely at
      inspect: check for faults in detail
      study: examine in depth over time
      evaluate: judge value or worth
      investigate: probe systematically for facts or causes
    syn_near:
      - assess
      - review
      - interpret
      - diagnose
      - compare
    syn_avoid:
      evaluate: >-
        = judge the value or worth of something and pass a verdict on it; causes
        are looked into rather than rated, so keep it for 'evaluate the impact'
      inspect: >-
        = check a physical object or site closely for faults; it fits 'inspect the
        equipment' but not the abstract 'causes of the problem'
      assess: >-
        = judge how good, bad or costly something is; it answers a question of
        quality, while analyze takes a whole apart to see what is in it
      review: >-
        = look over again once it exists, as in a review meeting or an annual
        review; the deck wants a first look at data and at causes
      interpret: >-
        = give a meaning to something already grasped; analysis has to come first,
        so 'interpret the causes' puts the steps in the wrong order
      diagnose: >-
        = find the fault in a patient or a machine and name it; a report studies a
        whole field of causes, it does not diagnose them one by one
      compare: >-
        = set two items side by side to see the difference; nothing in the
        sentence invites a contrast, and the frame has no second term to set
        against the first
    syn_nuance: >-
      All of these mean looking at something carefully, but the object sets the
      verb: analyze takes data, evidence or a whole situation and breaks it into
      parts, study and examine are neutral or in-depth, inspect is a physical
      fault check, evaluate adds a judgement of worth, and investigate implies
      hunting for causes.
    components:
      - spelling
      - definitions
      - synonyms
  - word: apparent
    ipa: /əˈpær.ənt/
    pos: adjective
    tip: ap-parent — one p, then 'arent'
    spelling_hint: ""
    definition: Clearly visible or understood; obvious.
    example: It became apparent that we were lost.
    synonyms:
      - obvious
      - evident
      - clear
      - visible
      - plain
    syn_pos: adjective
    syn_example: It was apparent / evident / obvious that costs were rising.
    syn_examples:
      - the: It became apparent that the plan would fail.
        syns:
          - obvious
          - evident
          - clear
          - plain
      - the: The benefits of the policy are apparent to everyone.
        syns:
          - clear
          - visible
          - plain
          - obvious
          - evident
    syn_notes:
      obvious: impossible to miss
      evident: clear from evidence
      clear: free from doubt
      visible: able to be seen
      plain: simple and easy to see
    syn_near:
      - noticeable
      - explicit
      - blatant
      - perceptible
    syn_avoid:
      visible: >-
        = able to be seen with the eye, so it needs a physical thing after it; the
        benefits of a policy can be visible, but a that-clause after 'became' is
        not
      noticeable: >-
        = describing a change or a detail that draws attention, as in a noticeable
        drop; it modifies a noun and cannot be handed a that-clause
      explicit: >-
        = stated word for word in detail, as in explicit instructions; a plan's
        failure is inferred from signs, not spelled out on the page
      blatant: >-
        = shockingly obvious, normally of something wrong or unfair; a conclusion
        is not blatant, and the word inflates the tone of a neutral report
      perceptible: >-
        = able to be sensed by eye or ear, as in a perceptible shift in tone;
        correct with a noun after it, not with 'it became perceptible that'
    syn_nuance: >-
      All of these mean easy to see, and apparent, obvious, evident, clear and
      plain all take 'it became ___ that ...', plain being the formal or literary
      one. Visible is the odd one out: it needs a concrete thing in front of the
      eye, as in 'a visible increase'. Evident leans on outside evidence, and
      clear adds certainty.
    components:
      - spelling
      - definitions
      - synonyms
  - word: aspect
    ipa: /ˈæs.pekt/
    pos: noun
    tip: a-spect — no 'e' before the final t
    spelling_hint: ""
    definition: A particular feature or part of something.
    example: We looked at every aspect of the problem.
    synonyms:
      - feature
      - facet
      - side
      - dimension
      - element
      - factor
    syn_pos: noun
    syn_example: Discuss every aspect / facet / dimension of the issue.
    syn_examples:
      - the: We discussed every aspect of the issue.
        syns:
          - feature
          - side
          - facet
          - dimension
      - the: Cost is just one aspect of a complex decision.
        syns:
          - factor
          - facet
          - dimension
          - element
    syn_notes:
      feature: a distinguishing attribute
      facet: one side among many
      side: one viewpoint
      dimension: an aspect that adds depth
      element: a basic part
      factor: a contributing cause
    syn_near:
      - respect
      - angle
      - area
      - segment
    syn_avoid:
      element: >-
        = a basic part of a system or a substance, as in an element of risk; the
        deck keeps it for 'one element of a decision', too technical beside 'every
        element of the issue'
      factor: >-
        = a cause that pushes the outcome along, as in a key factor in success;
        nothing here is a cause of the issue, so the causal frame does not fit
      feature: >-
        = a quality that marks out a person, product or place, as in a feature of
        the design; an issue has parts and sides, not features that distinguish it
      side: >-
        = one half or viewpoint of a dispute, as in 'the other side of the
        argument'; the deck sets it beside people who disagree, so it misses
        'discussed every ___ of'
      respect: >-
        = a point of concern, used in the fixed phrase 'in this respect'; the
        sentence wants the plain noun with an every-of pattern, so 'every respect
        of' fails
      angle: >-
        = a way of looking at a subject, as in 'a fresh angle on the debate'; it
        takes 'on' or 'from', never 'every ___ of the issue'
      area: >-
        = a field of activity or study, as in the area of genetics; the sentence
        is about parts of one topic, so 'every area of the issue' misuses the word
      segment: >-
        = a piece cut off a larger whole, used of data or a market; a topic has
        parts and sides rather than cut pieces, so the metaphor fails
    syn_nuance: >-
      All of these are a part of a larger thing, but the part decides the word:
      aspect and feature suit 'every ___ of the issue', facet and dimension suit
      'one ___ of a decision' and add a sense of depth, element is a technical
      part of a system, factor is a cause, and side belongs to 'the other side of
      the argument'.
    components:
      - spelling
      - definitions
      - synonyms
  - word: assumption
    ipa: /əˈsʌmp.ʃən/
    pos: noun
    tip: as-sump-tion — double s, then 'ump'
    spelling_hint: ""
    definition: A statement taken as true without proof, whether a working guess or a case assumed for argument's sake.
    example: The analysis rests on the assumption that the figures are comparable.
    synonyms:
      - belief
      - supposition
      - premise
      - hypothesis
      - presumption
    syn_pos: noun
    syn_example: Challenge a common assumption / belief / premise in your essay.
    syn_examples:
      - the: The argument rests on a false assumption.
        syns:
          - belief
          - supposition
          - premise
          - presumption
      - the: Scientists test each assumption before proceeding.
        syns:
          - hypothesis
          - supposition
        avoid:
          : >-
            = the starting statement a whole argument rests on; data support or
            refute a hypothesis, so you never 'test each premise'
    syn_notes:
      belief: a conviction held
      supposition: a tentative case granted for the sake of argument
      premise: the starting point of an argument
      hypothesis: an explanation put to the test
      presumption: held true by default, until proven otherwise
    syn_near:
      - guess
      - opinion
      - theory
      - delusion
    syn_avoid:
      belief: >-
        = something a person is convinced of, not necessarily proved; it fits 'a
        widely held belief' but not 'test each belief', which concerns a working
        premise
      hypothesis: >-
        = a proposal put forward to be tested and possibly disproved; an argument
        rests on something already taken for granted, so nothing there is on trial
      presumption: >-
        = a belief held true by default, by law or convention, until proven
        otherwise; it fits 'on the presumption that', but you do not test a
        presumption item by item, so it stays out of the second frame
      guess: >-
        = a rough estimate with nothing behind it, as in 'have a guess'; an
        assumption is reasoned inside an argument, not hit on by chance
      opinion: >-
        = a personal view that the speaker owns and defends; an assumption is a
        step the argument depends on, not a preference to be argued over
      theory: >-
        = a developed system of explanation, as in the theory of relativity; it
        fits 'test each theory' but an argument rests on one starting point, never
        on a theory
      delusion: >-
        = a false belief held in defiance of evidence; the argument needs
        something it can correct, while a delusion by definition cannot be given
        up, so it overstates
    syn_nuance: >-
      All are taken as true to get work done, and assumption is the general word:
      a working guess or a case assumed for argument's sake. Supposition is the
      same idea framed as an argument, presumption is held true by default, by
      law or convention, until disproved, premise is the base an argument rests
      on, and hypothesis is the one you put to the test. Belief leans on
      conviction.
    components:
      - spelling
      - definitions
      - synonyms
  - word: benefit
    ipa: /ˈben.ɪ.fɪt/
    pos: noun/verb
    tip: bene-fit — no double letters
    spelling_hint: ""
    definition: An advantage or profit gained from something; to gain from it.
    example: The plan offers clear benefits to everyone.
    synonyms:
      - advantage
      - gain
      - profit
      - plus
      - upside
    syn_pos: noun
    syn_example: List the benefits / advantages / pluses of a policy.
    syn_examples:
      - the: A key benefit is stress relief.
        syns:
          - advantage
          - plus
          - upside
      - the: Both sides can benefit from the agreement.
        syns:
          - gain
          - profit
    syn_notes:
      advantage: a position of superiority
      gain: an increase or winnings
      profit: a financial return
      plus: a positive factor
      upside: the good side of a situation
    syn_near:
      - perk
      - reward
      - asset
      - return
    syn_avoid:
      advantage: >-
        = a stronger position than a rival's, as in 'a major advantage'; it is a
        noun, and the verb frame is 'benefit from + noun', not 'advantage from'
      gain: >-
        = a rise in amount or a thing won, so 'a key gain is stress relief' reads
        as a figure going up; the deck wants the general word for a good outcome
        here
      profit: >-
        = money left after costs, or the verb meaning to earn a margin; a purely
        financial word, so it cannot stand for relief from stress
      plus: >-
        = the good point in a list of pros and cons, as in 'the main plus of the
        job'; it is informal and needs a con to be weighed against, which this
        sentence lacks
      upside: >-
        = the good side of a situation that could go either way, as in 'the upside
        is faster delivery'; no risk or con is in view, so the balance frame is
        missing
      perk: >-
        = a small extra that comes with a job, usually informal and often a
        tangible one like free meals; stress relief is a main advantage, not a
        bonus on the side
      reward: >-
        = something handed back for effort or good service, as in 'a reward for
        hard work'; it wants a doer who earned it, while a benefit is simply there
        for both sides
      asset: >-
        = a possession or quality belonging to a person or firm, as in 'a valuable
        asset'; a key asset is what someone owns, not a good the agreement
        delivers
      return: >-
        = the income an investment pays back, as in 'a good return on savings'; it
        is a financial figure, so it cannot stand for the relief of stress
    syn_nuance: >-
      All of these are good outcomes, but benefit splits by frame: 'a benefit of +
      noun' and 'a key benefit is ...' cover any gain, 'benefit from + noun' is
      the verb, advantage compares you with others, upside and plus need a
      possible downside in view, and gain and profit read as figures of money or
      amount.
    components:
      - spelling
      - definitions
      - synonyms
  - word: comprehensive
    ipa: /ˌkɒm.prɪˈhen.sɪv/
    pos: adjective
    tip: com-pre-hen-sive — note the 'hen'
    spelling_hint: ""
    definition: Including everything or nearly everything; complete and thorough.
    example: The report gives a comprehensive overview.
    synonyms:
      - thorough
      - complete
      - extensive
      - full
      - all-inclusive
    syn_pos: adjective
    syn_example: A comprehensive / thorough / extensive study of the topic.
    syn_examples:
      - the: The report provides a comprehensive overview.
        syns:
          - thorough
          - complete
          - extensive
          - full
      - the: We offer comprehensive support.
        syns:
          - extensive
          - all-inclusive
          - thorough
          - complete
    syn_notes:
      thorough: careful and detailed
      complete: with all parts
      extensive: covering a wide area
      full: entire, complete
      all-inclusive: including everything
    syn_near:
      - detailed
      - broad
      - rigorous
      - absolute
    syn_avoid:
      all-inclusive: >-
        = a package that includes every extra, as in an all-inclusive holiday; the
        sentence already states the coverage, and the hyphenated label reads
        clunky beside 'overview'
      full: >-
        = total and undivided, as in 'the full picture'; 'full support' suggests
        blanket backing with no thought for what is offered, so the deck sets it
        aside
      detailed: >-
        = full of small points, as in a detailed report; it measures how much
        information is packed in, not how wide the coverage runs
      broad: >-
        = wide-ranging, and it belongs with 'overview' and 'outline'; it measures
        width, while comprehensive claims that nothing has been left out
      rigorous: >-
        = strict and exact about method, as in rigorous testing; it praises how
        carefully something was done, not how much of the field it covered
      absolute: >-
        = complete without any limit, as in absolute certainty; far too strong for
        a report or a support package, which always leave some gaps
    syn_nuance: >-
      All of these claim that nothing has been left out, but comprehensive
      describes the coverage of a whole area: it takes 'overview', 'review',
      'support' or 'insurance', while thorough praises the care of the method,
      complete stresses that no part is missing, and extensive measures sheer size
      or spread.
    components:
      - spelling
      - definitions
      - synonyms
  - word: consequence
    ipa: /ˈkɒn.sɪ.kwəns/
    pos: noun
    tip: con-se-quence — the 'ue' before 'nce'
    spelling_hint: ""
    definition: A result or effect of an action or condition.
    example: Pollution has serious consequences for health.
    synonyms:
      - result
      - outcome
      - effect
      - repercussion
      - impact
    syn_pos: noun
    syn_example: Weigh the consequences / repercussions / outcomes of a decision.
    syn_examples:
      - the: A serious consequence of climate change is rising sea levels.
        syns:
          - result
          - effect
          - impact
          - repercussion
          - outcome
      - the: Every action has some consequence.
        syns:
          - result
          - outcome
          - effect
    syn_notes:
      result: what follows
      outcome: the final result
      effect: a direct change produced
      repercussion: a negative indirect result
      impact: a strong effect
    syn_near:
      - cause
      - consequential
      - aftermath
      - implication
    syn_avoid:
      cause: >-
        = the thing that produces the effect, not the effect itself: it fills the
        other half of the pair, as in the cause of climate change, so it cannot
        follow the adjective a serious
      consequential: >-
        = an adjective, meaning following as a result or simply very important:
        the noun slot here needs a noun, since a serious consequential is not
        English
      aftermath: >-
        = the whole state of disorder that follows an event, and it takes the, as
        in the aftermath of the flood: a serious aftermath of climate change
        misses the determiner and the frame
      implication: >-
        = a likely effect on someone or a hidden meaning, and it runs implications
        for or the implication is that: it never combines with a serious plus of +
        noun
      impact: >-
        = a powerful effect, normally with on, as in an impact on coastal towns: a
        serious impact of needs that on phrase, so the of + noun frame here fails
      repercussion: >-
        = an indirect knock-on that is usually unwelcome, and it runs plural with
        for, as in repercussions for wages: some repercussion is not idiomatic in
        this frame
    syn_nuance: >-
      Consequence, result and outcome are neutral and take the of + noun frame, so
      they fit any following event. Effect and impact prefer an effect on X, with
      impact far stronger and usually negative, while repercussion is an indirect
      knock-on, normally plural.
    components:
      - spelling
      - definitions
      - synonyms
  - word: constitute
    ipa: /ˈkɒn.stɪ.tjuːt/
    pos: verb
    tip: con-sti-tute — 'sti', not 'stit'
    spelling_hint: ""
    definition: To be or form part of something; to make up.
    example: Women constitute the majority of the workforce.
    synonyms:
      - form
      - make up
      - comprise
      - represent
      - account for
    syn_pos: verb
    syn_example: Students constitute / form / make up a large share of users.
    syn_examples:
      - the: Women constitute the majority of the workforce.
        syns:
          - form
          - make up
          - comprise
          - represent
          - account for
      - the: This single payment will constitute the entire fee.
        syns:
          - form
          - make up
          - represent
          - comprise
    syn_notes:
      form: make something
      make up: be the parts that form
      comprise: consist of
      represent: stand for
      account for: be the amount or cause of
    syn_near:
      - compose
      - consist
      - construct
      - establish
    syn_avoid:
      account for: >-
        = to be a share or the cause, so it needs a figure or a causer, as in
        women account for 60%: it never means to equal a whole, so the single
        payment cannot account for the whole fee
      compose: >-
        = to put parts together into a text, a tune or a whole, and the passive
        runs composed of: a subject cannot compose its own majority, so the
        direction is reversed in both frames
      consist: >-
        = intransitive and only ever takes of, as in the workforce consists of
        women: standing alone before a noun it fails both the majority frame and
        the fee frame
      construct: >-
        = to build a physical thing or a system out of parts, a making word rather
        than an equals word, so it fits neither the majority sentence nor the fee
        sentence
      establish: >-
        = to set up an institution, to prove a fact or to fix a price: it never
        means to make up a whole, so a payment cannot establish the entire fee
    syn_nuance: >-
      Constitute, form and make up all put the part first and the whole second, as
      in women constitute the majority, while comprise reverses that with the
      whole as subject. Constitute is the formal, legal register of make up.
      Represent means to stand for, and account for takes a share or a cause, so
      it never equals one whole.
    components:
      - spelling
      - definitions
      - synonyms
  - word: contemporary
    ipa: /kənˈtem.pər.ər.i/
    pos: adjective
    tip: con-tem-por-ary — keep the 'por'
    spelling_hint: ""
    definition: Living or occurring at the same time; modern or current.
    example: Contemporary art challenges traditional ideas.
    synonyms:
      - modern
      - current
      - present-day
      - recent
      - up-to-date
    syn_pos: adjective
    syn_example: Modern / contemporary / present-day society faces new problems.
    syn_examples:
      - the: She buys contemporary art.
        syns:
          - modern
          - present-day
          - current
      - the: The journal covers contemporary research in biology.
        syns:
          - current
          - up-to-date
          - recent
          - present-day
    syn_notes:
      modern: of today’s era
      current: of the present time
      present-day: nowadays
      up-to-date: containing the latest information
      recent: happened not long ago
    syn_near:
      - new
      - latest
      - cutting-edge
      - nowadays
    syn_avoid:
      modern: >-
        = the loose, everyday word for the present era, as in modern art: in the
        research frame the journal reports work that is current, recent or up to
        date, not merely work of this era
      recent: >-
        = dated to the near past, so it wants an event, a change or a report that
        has a date: a style or a school of art is not recent, it is contemporary
      up-to-date: >-
        = carrying the newest information, and it is the right word for a guide or
        a database: here it measures how fresh a piece of content is, not which
        era an art style belongs to
      new: >-
        = recently made and not yet established, and it adds a hint of novelty, as
        in a new theory: for a style, a field or a body of research the era word
        is contemporary
      latest: >-
        = the most recent item in a series, so it always names one specific thing,
        as in the latest report: it cannot describe a whole era, a style or a
        discipline
      cutting-edge: >-
        = at the very frontier of innovation, and it is a journalistic word: right
        for cutting-edge technology, but far too narrow and too informal for a
        whole style or discipline
      nowadays: >-
        = an adverb of time, meaning in these days, and it can never modify a
        noun: the adjective with that sense is present-day, as in present-day art
    syn_nuance: >-
      Contemporary means of the present era, and it is the fixed term for art,
      design and the scholarship of today, set against historical. Current, up to
      date and recent grade how fresh the information is, which is what a journal
      covers, modern is the loose everyday word, and present-day is an adjective
      placed before a noun.
